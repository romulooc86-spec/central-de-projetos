<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Rebocadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  color-scheme:light;
  --font-display:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --navy:#042738;--navy-soft:#103C52;--teal:#06BEAE;--teal-deep:#048C80;--teal-wash:#E0F6F3;
  --page:#F2F6F6;--card:#FFFFFF;--card-soft:#F8FBFB;
  --tx:#0B2530;--tx2:#52656C;--tx3:#8B9A9F;--on-navy:#fff;--on-navy-mu:#A9C3CB;
  --bd:#E0E9E9;--bd2:#CCD9D9;
  --good:#048C80;--good-w:#E0F6F3;--warn:#5B6E75;--warn-w:#EEF3F4;--crit:#103C52;--crit-w:#E7EDF0;
  --grid:#E5EDED;--axis:#6F8288;
  --y-old:#9AAEB4;--y-mid:#103C52;--y-cur:#048C80;
  --c1:#042738;--c2:#06BEAE;--c3:#5F8793;--c4:#A9B8BD;--c5:#048C80;--c6:#8ED8CE;--c7:#C9D3D6;--c-other:#B7C1C4;
  --s1:#CFEFEA;--s2:#8ED8CE;--s3:#3FBFB1;--s4:#048C80;--s5:#03443E;
  --shadow:0 1px 2px rgba(4,39,56,.07),0 2px 8px rgba(4,39,56,.04);--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--page:#051620;--card:#0A2233;--card-soft:#0C2838;--tx:#EAF3F4;--tx2:#9DB4BA;--tx3:#6D8389;
  --bd:#1C323C;--bd2:#274653;--good:#2FD3C3;--good-w:#0E3733;--warn:#9DB4BA;--warn-w:#1C323C;--crit:#CFE0E6;--crit-w:#1C323C;
  --grid:#1C2E34;--axis:#7F979D;--y-old:#6F8790;--y-mid:#7FB2CF;--y-cur:#1FBFAE;--teal-wash:#0E3733;
  --c1:#E6EEF0;--c2:#06BEAE;--c3:#7FA3AD;--c4:#4F646B;--c5:#3FA59B;--c6:#9FE3DA;--c7:#33464D;--c-other:#6D8389;--s1:#1B4A46;--s2:#227C73;--s3:#2FA99C;--s4:#5CD3C6;--s5:#B5F2EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;--page:#051620;--card:#0A2233;--card-soft:#0C2838;--tx:#EAF3F4;--tx2:#9DB4BA;--tx3:#6D8389;
  --bd:#1C323C;--bd2:#274653;--good:#2FD3C3;--good-w:#0E3733;--warn:#9DB4BA;--warn-w:#1C323C;--crit:#CFE0E6;--crit-w:#1C323C;
  --grid:#1C2E34;--axis:#7F979D;--y-old:#6F8790;--y-mid:#7FB2CF;--y-cur:#1FBFAE;--teal-wash:#0E3733;
  --c1:#E6EEF0;--c2:#06BEAE;--c3:#7FA3AD;--c4:#4F646B;--c5:#3FA59B;--c6:#9FE3DA;--c7:#33464D;--c-other:#6D8389;--s1:#1B4A46;--s2:#227C73;--s3:#2FA99C;--s4:#5CD3C6;--s5:#B5F2EA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.25);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--tx);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
button,select,input{font:inherit;color:inherit}
.top{background:linear-gradient(150deg,var(--navy),var(--navy-soft));color:var(--on-navy);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(560px 260px at 92% -10%,rgba(6,190,174,.28),transparent 70%);pointer-events:none}
.top-in{position:relative;max-width:1240px;margin:0 auto;padding:22px 28px 18px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.brand{display:flex;align-items:center;gap:16px}
.badge{background:#fff;border-radius:10px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.badge img{display:block;height:34px;width:auto}
.eyebrow{font:500 11px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.brand h1{font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.brand p{font-size:13px;color:var(--on-navy-mu)}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asof{font-size:12px;color:var(--on-navy-mu);text-align:right}
.btn{background:var(--teal);color:#04302B;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:var(--font-display);font-size:13px}
.btn:hover{filter:brightness(1.08)} .btn.ghost{background:transparent;border:1px solid var(--bd2);color:var(--tx)}
.top .ghost{border-color:rgba(255,255,255,.3);color:#fff}
.tabs{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;position:relative}
.tabs button{background:none;border:0;color:var(--on-navy-mu);padding:11px 14px;cursor:pointer;font:600 13px var(--font-display);white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center}
.tabs button span{font:500 10px var(--font-display);border:1px solid currentColor;border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;opacity:.7}
.tabs button.on{color:#fff;border-bottom-color:var(--teal)} .tabs button:hover{color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:18px 28px 56px}
#filters{display:flex;gap:18px 26px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.fg{display:flex;flex-direction:column;gap:5px}.fl{font:700 10.5px var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.seg2{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.seg2 button{background:var(--card);border:0;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--tx2);border-right:1px solid var(--bd2)}
.seg2 button:last-child{border-right:0}.seg2 button.on{background:var(--navy);color:#fff}
[data-theme=dark] .seg2 button.on{background:var(--teal-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg2 button.on{background:#0f6f66}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--bd2);border-radius:999px;padding:5px 11px 5px 9px;cursor:pointer;font-size:12.5px;color:var(--tx3);display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;opacity:.35}.chip.on{color:var(--tx);border-color:var(--tx3);background:var(--card-soft)}.chip.on i{opacity:1}
select{background:var(--card);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.kgrid.k3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal)}
.kpi-hero{grid-column:span 2;border-top-width:5px;padding:20px 22px}.kpi-hero .kv{font-size:44px}.kpi-hero .kl{font-size:13px}
.kpi-hero.good{background:linear-gradient(165deg,var(--good-w),var(--card) 65%)}.kpi-hero.bad{background:linear-gradient(165deg,var(--crit-w),var(--card) 65%)}
@media (max-width:720px){.kpi-hero{grid-column:span 1}.kpi-hero .kv{font-size:32px}}
.kl{font:600 12px var(--font-display);color:var(--tx2)} .kl em{font-style:normal;color:var(--teal-deep)}
.kv{font:800 30px var(--font-display);letter-spacing:-.02em;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.kn{font-size:12.5px;color:var(--tx2);display:flex;gap:6px;align-items:baseline;margin-top:2px}.kn b{font-weight:700}
.kn.good{color:var(--good)}.kn.bad{color:var(--crit)}.kn.warn{color:var(--warn)}.kn .ic{font-size:10px;width:12px}.kn .mu{color:var(--tx3)}
.kf{font-size:11.5px;color:var(--tx3);margin-top:8px;border-top:1px solid var(--bd);padding-top:7px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px 16px;box-shadow:var(--shadow);min-width:0}
.card.mt{margin-top:16px}
.card.alert{border-top:3px solid var(--crit)}.card.alert .card-head h3{color:var(--crit)}
.card.ok{border-top:3px solid var(--good)}
.card-head{margin-bottom:10px}.card-head h3{font-size:15.5px;font-weight:800;letter-spacing:-.005em}.card-head p{font-size:12.5px;color:var(--tx2);margin-top:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-top:16px}
.kgrid+.two{margin-top:0}
#view>.card+.two,#view>.two+.card,#view>.ctl+.card{margin-top:16px}
.msgs{list-style:none;display:flex;flex-direction:column;gap:11px}
.msgs li{padding-left:14px;border-left:3px solid var(--teal);font-size:13.5px;line-height:1.5}
.note{font-size:12.5px;color:var(--tx2);margin-top:10px;line-height:1.5}
.alert{background:var(--warn-w);color:var(--tx);border-left:3px solid var(--warn);padding:9px 12px;border-radius:6px;font-size:12.5px;margin-bottom:10px}
.empty{padding:30px;text-align:center;color:var(--tx3)}
.mu{color:var(--tx3);font-size:.92em}
.lgd{margin-bottom:6px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}.legend i,.dotc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dotc{border-radius:50%}
svg{width:100%;height:auto;display:block;overflow:visible}
svg .grid{stroke:var(--grid);stroke-width:1}svg .base{stroke:var(--bd2);stroke-width:1}
svg .ax{fill:var(--axis);font:11px var(--font-body)}svg .cx{font-size:11.5px;fill:var(--tx2)}
svg .vl{fill:var(--tx);font:600 11px var(--font-body);font-variant-numeric:tabular-nums}
svg .dl{fill:var(--tx);font:700 11.5px var(--font-display)}
svg .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg .dot{stroke:var(--card);stroke-width:2}
svg .xh{stroke:var(--tx3);stroke-width:1;stroke-dasharray:3 3}
svg .bar{cursor:default}svg .bar:hover{filter:brightness(1.12)}
svg .wt{fill:var(--y-mid)} svg .wu{fill:var(--crit)} svg .wd{fill:var(--teal-deep)}
[data-theme=dark] svg .wt{fill:#3C6E88}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) svg .wt{fill:#3C6E88}}
svg .wc{stroke:var(--tx3);stroke-dasharray:3 3}
.stack{display:flex;gap:2px;height:30px;flex:1}.seg{display:flex;align-items:center;justify-content:center;border-radius:4px;min-width:2px;color:#fff;font:700 11.5px var(--font-body)}

.lrow{display:flex;align-items:center;gap:12px;margin:9px 0}.ly{font:700 13px var(--font-display);width:38px;color:var(--tx2)}
.bandleg{margin-top:10px}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{font:700 11px var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--bd2)}
table.dense td{font-size:12.5px;padding:6px 8px}td.ob{color:var(--tx2);min-width:200px;max-width:340px}
.tc{font-weight:700;font-size:12.5px}.tc.good{color:var(--good)}.tc.bad{color:var(--crit)}
table.loc td{vertical-align:middle}.bcell{width:32%;min-width:130px}
.bb{height:8px;background:var(--card-soft);border-radius:4px;margin:3px 0}.bb i{display:block;height:100%;border-radius:4px}.b1{background:var(--y-cur)}.b0{background:var(--y-old)}
.ctl{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px 16px}
.sl{display:flex;align-items:center;gap:10px}.sl input{width:min(340px,50vw);accent-color:var(--teal-deep)}
.lvl{display:flex;flex-direction:column;gap:6px}.lvr{display:grid;grid-template-columns:82px 1fr 150px;gap:10px;align-items:center;font-size:12.5px}
.lk{font-variant-numeric:tabular-nums;font-weight:700}.lb{height:14px;background:var(--card-soft);border-radius:4px}.lb i{display:block;height:100%;background:var(--teal-deep);border-radius:4px}.lv{color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.drop{margin-top:14px;border:2px dashed var(--bd2);border-radius:10px;padding:22px;text-align:center;color:var(--tx2)}.drop.over{border-color:var(--teal);background:var(--teal-wash)}
.tip{position:fixed;z-index:50;background:var(--navy);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28);min-width:120px;max-width:280px}
.tip .th{font:700 12px var(--font-display);margin-bottom:4px;color:var(--teal)}.tip .tr{display:flex;gap:8px;align-items:center;justify-content:space-between}.tip .tr b{margin-left:auto;padding-left:10px}.tip .sw{width:9px;height:9px;border-radius:2px;flex:none}.tip .mu{color:#A9C3CB}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:60;font-size:13px;max-width:90vw}
.foot{max-width:1240px;margin:0 auto;padding:0 28px 30px;font-size:11.5px;color:var(--tx3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:720px){.wrap{padding:14px 14px 40px}.top-in{padding:16px 14px}.kv{font-size:26px}.lvr{grid-template-columns:70px 1fr}.lv{grid-column:1/-1;text-align:left}}
@media print{.top,.tabs,#filters,.acts{display:none}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}

/* ===== Adições: marco/insight, mapa de calor (padrão Prime Ocean), painel de detalhe (drawer) ===== */
.milestone{background:linear-gradient(120deg,var(--navy) 0%,#0B3F55 100%);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.milestone .mi-ic{font-size:20px;flex:0 0 auto;line-height:1.3}
.milestone b{color:var(--teal)}
.milestone .mi-num{font:800 22px var(--font-display);color:#fff;white-space:nowrap}
.milestone-grid{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.milestone-item{min-width:150px}
.milestone-item .ml{font-size:10.5px;color:#A9C3CB;text-transform:uppercase;letter-spacing:.4px}
.milestone-item .mv{font:800 20px var(--font-display);color:#fff;margin-top:2px}
.milestone-item .mv.acc{color:var(--teal)}
@media(max-width:640px){.milestone{flex-direction:column}}

.hm-wrap{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:4px;font-size:11.5px;width:100%}
.hm th{font-weight:700;color:var(--tx2);font-size:10px;text-transform:uppercase;letter-spacing:.2px;padding:2px 4px;text-align:center}
.hm td.rh{text-align:left;font-weight:700;color:var(--tx);padding-right:10px;white-space:nowrap;font-size:12px}
.hm td.c{text-align:center;border-radius:7px;padding:11px 4px;font-weight:800;min-width:52px;transition:transform .1s ease}
.hm td.c:not(.empty):hover{transform:scale(1.06)}
.hm td.c.empty{background:var(--card-soft);color:var(--tx3);cursor:default}

.drw-ov{position:fixed;inset:0;background:rgba(4,39,56,.45);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:60}
.drw-ov.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--card);z-index:61;box-shadow:-10px 0 30px rgba(4,39,56,.28);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.drw.on{transform:translateX(0)}
.drw-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--bd);flex:none}
.drw-head h3{font:800 15px var(--font-display);color:var(--tx)}
.drw-x{border:none;background:none;color:var(--tx2);font-size:14px;cursor:pointer;padding:5px 8px;border-radius:6px;line-height:1}
.drw-x:hover{background:var(--card-soft);color:var(--tx)}
.drw-body{flex:1;overflow-y:auto;padding:18px}
.drw-body .kgrid{margin-bottom:6px}
.drw-body .kpi{padding:12px 14px}
.drw-body .kv{font-size:22px}
.drw-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);margin:18px 0 8px;font-weight:700}
.drw-body .drw-msgs{margin:12px 0}
.drw-body .drw-msgs li{padding-left:12px;border-left:3px solid var(--teal);font-size:12.5px;line-height:1.5;margin-bottom:8px}
.drw-body svg{max-width:100%}
@media(max-width:480px){.drw{width:100%}}

.rowclick{cursor:pointer;transition:background .12s ease}
.rowclick:hover{background:var(--card-soft)}
.rowclick:hover td:first-child{color:var(--teal-deep)}

.vtoggle{margin-bottom:12px}

.seg.segclick{cursor:pointer;transition:filter .1s ease}
.seg.segclick:hover{filter:brightness(1.1)}

/* ===== Modo apresentação (discreto): esconde controles de edição/atualização de dados ===== */
.top .ghost#present{font-size:15px;line-height:1;padding:9px 12px}
.top .ghost#present.on{background:rgba(6,190,174,.28);border-color:var(--teal);color:#fff}
body.present #upd{display:none!important}
body.present #toast{display:none!important}
body.present .tabs button[data-t="dados"]{display:none!important}

/* ===== Responsivo: telas menores (tablet/celular) ===== */
@media (max-width:640px){
  .top-in{padding:16px 14px 12px;gap:12px}
  .badge{padding:6px 10px}
  .badge img{height:26px}
  .brand{gap:10px}
  .brand h1{font-size:17px}
  .brand p{font-size:11.5px}
  .eyebrow{font-size:10px}
  .acts{gap:6px;width:100%;justify-content:flex-end}
  .asof{font-size:10.5px;text-align:left;flex:1}
  .btn{padding:8px 11px;font-size:12px}
  .wrap{padding:12px 12px 40px}
  #filters{padding:10px 12px;gap:12px 18px}
  .kv{font-size:22px}
  .kgrid,.kgrid.k3{grid-template-columns:1fr 1fr}
  .milestone{padding:14px}
  .milestone-grid{gap:16px}
  .milestone .mi-num{font-size:18px}
  .drw-body{padding:14px}
  table{font-size:12px}
  th,td{padding:6px 6px}
  .hm td.c{min-width:38px;padding:8px 3px;font-size:10.5px;border-radius:5px}
  .hm th{font-size:9px}
}
@media (max-width:420px){
  .kgrid,.kgrid.k3{grid-template-columns:1fr}
  .brand p{display:none}
  .ly{width:30px;font-size:11.5px}
}
/* ===== Eficiência em custos + dados ao vivo ===== */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--on-navy-mu);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px 6px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:#9AAEB4;flex:none}
.live i.on{background:var(--teal);box-shadow:0 0 0 0 rgba(6,190,174,.6);animation:livep 2.2s infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(6,190,174,.55)}70%{box-shadow:0 0 0 7px rgba(6,190,174,0)}100%{box-shadow:0 0 0 0 rgba(6,190,174,0)}}
@media (prefers-reduced-motion:reduce){.live i.on{animation:none}}
.gestao-hero{padding:22px 24px}
.gh-k{font:700 11px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.gh-t{font:700 19px/1.35 var(--font-display);color:#fff}
.gestao-hero .mi-num{font-size:30px;color:var(--teal);margin:0 4px}

/* ===== v2: padrão analítico ===== */
svg .grid{display:none}
svg .ax{font-weight:600}
svg .cx{font:700 11.5px var(--font-display)!important;fill:var(--tx2)!important;letter-spacing:.01em}
svg .dl{font:700 11.5px var(--font-display)!important}
.legend,.legend span,.iab-leg span,.bandleg{font-weight:700}
svg .vl{font:600 10px var(--font-body)!important;fill:var(--tx2)}
svg .dlab{font:600 10.5px var(--font-body);fill:var(--tx3);pointer-events:none}
:root{--dbc:rgba(6,190,174,.5)}
td.db{background-image:linear-gradient(90deg,var(--dbc) var(--p),transparent var(--p));background-repeat:no-repeat;background-size:100% 5px;background-position:0 calc(100% - 3px)}
td.dmax{font-weight:800;color:var(--tx)}
td.dv{font-weight:800}td.dv-g{color:var(--teal-deep)}td.dv-b{color:var(--crit)}td.dv-n{color:var(--tx2)}
.rk{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--card-soft);border:1px solid var(--bd2);font:700 10px var(--font-display);align-items:center;justify-content:center;margin-right:8px;color:var(--tx2);vertical-align:1px}
tbody tr:first-child .rk{background:var(--navy);color:#fff;border-color:var(--navy)}
.srt{font-size:9px;color:var(--teal-deep)}
.seg{position:relative}.seg.sm span{position:absolute;top:100%;margin-top:3px;color:var(--tx2);font:700 10px var(--font-body);white-space:nowrap}
.lrow{margin:9px 0 20px}
body.present #fbar,body.present .teste,body.present .foot,body.present .inf,body.present #filters{display:none!important}
body.present .wrap,body.present .tabs,body.present .top-in{max-width:1600px}
body.present{font-size:15px}
.mc-s b,.lev-l b{color:var(--tx);font-weight:800}
tbody td:first-child:has(.rk){white-space:nowrap}
svg .axt{font:700 10.5px var(--font-display);letter-spacing:.09em;fill:var(--tx3)}
/* marco principal com mais destaque */
.gestao-hero{position:relative;overflow:hidden;padding:26px 30px;border-left:6px solid var(--teal)}
.gestao-hero::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:260px;background:var(--teal);opacity:.10;clip-path:polygon(0 30%,78% 0,100% 62%,22% 100%);pointer-events:none}
.gestao-hero .mi-ic{display:none}
.gestao-hero .gh-t{font:600 18px/1.4 var(--font-display)}
.gestao-hero .mi-num{display:block;font:800 58px/1.05 var(--font-display);color:var(--teal);margin:6px 0 4px;letter-spacing:-.02em}
.gestao-hero .milestone-grid{margin-top:18px;gap:0}
.gestao-hero .milestone-item{padding:0 26px;border-left:1px solid rgba(255,255,255,.18)}
.gestao-hero .milestone-item:first-child{padding-left:0;border-left:0}
.gestao-hero .milestone-item .mv{font-size:24px}
.mcs .mc.acc{background:var(--navy);border-left-color:var(--teal)}
.mcs .mc.acc .mc-l{color:var(--teal)}.mcs .mc.acc .mc-v{color:#fff}.mcs .mc.acc .mc-s,.mcs .mc.acc .mc-s b{color:#CFE3EA}
@media (max-width:640px){.gestao-hero .mi-num{font-size:40px}.gestao-hero .milestone-item{padding:8px 0;border-left:0;min-width:45%}}
svg .du{fill:var(--crit);font-weight:800}svg .dd{fill:var(--teal-deep);font-weight:800}svg .dz{fill:var(--tx3)}
svg .pc{font-size:11.5px}
td.ibc{white-space:nowrap}
.ib{display:inline-block;width:64px;height:8px;background:var(--card-soft);border-radius:4px;margin-right:10px;vertical-align:1px;overflow:hidden}
.ib i{display:block;height:100%;background:var(--teal);border-radius:4px}
.ib{float:left;margin:6px 12px 0 0}td.ibc{min-width:190px}
svg .cx{font-size:12.5px!important}
svg .vl{font-size:11.5px!important}
.stkw{flex:1;min-width:0}
.stk-sm{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:4px;font-size:11.5px;color:var(--tx2)}
.stk-sm i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.stk-sm b{color:var(--tx)}
.lrow{margin:9px 0 12px;align-items:flex-start}.lrow .ly{padding-top:6px}
.tp{display:flex;flex-direction:column;gap:12px;margin:6px 0 10px}
.tp-r{display:grid;grid-template-columns:54px 1fr 150px;grid-template-rows:auto auto;column-gap:14px;align-items:center}
.tp-a{font:800 14px var(--font-display);color:var(--tx2);grid-row:1/3}
.tp-b{display:flex;height:20px;background:var(--card-soft);border-radius:5px;overflow:hidden}
.tp-b i{display:block;height:100%}
.tp-v{text-align:right;font-size:13px;white-space:nowrap}.tp-v b{font:800 16px var(--font-display)}.tp-v em{font-style:normal;font-weight:800;font-size:12px}
.tp-v .du{color:var(--crit)}.tp-v .dd{color:var(--teal-deep)}
.tp-s{grid-column:2/4;font-size:11.5px;color:var(--tx3)}
</style></head>

function bindTip(el, fn) {
    el.addEventListener('mousemove', e => showTip(fn(e), e));
    el.addEventListener('mouseleave', hideTip);
}

/* ---------- painel de detalhe (drawer) — clique em gráfico abre resumo do item ---------- */
const drwOv = document.createElement('div');
drwOv.className = 'drw-ov';
const drwEl = document.createElement('aside');
drwEl.className = 'drw';
drwEl.setAttribute('role', 'dialog');
drwEl.setAttribute('aria-label', 'Detalhe');
drwEl.innerHTML = '<div class="drw-head"><h3 id="drwTitle"></h3><button class="drw-x" id="drwClose" aria-label="Fechar">✕</button></div><div class="drw-body" id="drwBody"></div>';
document.body.appendChild(drwOv);
document.body.appendChild(drwEl);

function openDrawer(title, bodyHtml, after) {
    $('#drwTitle', drwEl).textContent = title;
    $('#drwBody', drwEl).innerHTML = bodyHtml;
    drwOv.classList.add('on');
    drwEl.classList.add('on');
    $('#drwBody', drwEl).scrollTop = 0;
    if (after) after($('#drwBody', drwEl));
}

function closeDrawer() {
    drwOv.classList.remove('on');
    drwEl.classList.remove('on');
}
drwOv.addEventListener('click', closeDrawer);
$('#drwClose', drwEl).addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDrawer();
});

/* ---------- gráficos (SVG) ---------- */
function niceMax(v) {
    if (!(v > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(k => n <= k + 1e-9) || 10) * p;
}

function lineChart(host, {
    series,
    xl,
    yfmt,
    ymin = 0,
    tipfmt,
    H = 270,
    W = 760,
    onClick
}) {
    const m = {
            l: 58,
            r: 78,
            t: 14,
            b: 28
        },
        iw = W - m.l - m.r,
        ih = H - m.t - m.b;
    const vals = series.flatMap(s => s.pts.filter(p => p.y != null).map(p => p.y));
    if (!vals.length) {
        host.innerHTML = '<div class="empty">Sem dados para o filtro selecionado.</div>';
        return;
    }
    const ymaxRaw = Math.max(...vals);
    let lo = ymin,
        top;
    if (ymin === 'auto') {
        const mn = Math.min(...vals);
        const st = niceMax((ymaxRaw - mn) * 1.4) / 4;
        lo = Math.max(0, Math.floor(mn * 0.85 / st) * st);
        top = lo + Math.ceil((ymaxRaw * 1.04 - lo) / st) * st;
    } else top = niceMax(ymaxRaw * 1.02);
    const X = i => m.l + iw * (xl.length === 1 ? 0.5 : i / (xl.length - 1)),
        Y = v => m.t + ih * (1 - (v - lo) / (top - lo));
    let g = '';
    for (let k = 0; k <= 4; k++) {
        const v = lo + (top - lo) * k / 4,
            y = Y(v);
        g += `<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l-8}" y="${y+4}" text-anchor="end">${yfmt(v)}</text>`;
    }
    xl.forEach((l, i) => {
        g += `<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`;
    });
    const ends = [];
    series.forEach(s => {
        const segs = [];
        let cur = [];
        s.pts.forEach((p, i) => {
            if (p.y == null) {
                if (cur.length) segs.push(cur);
                cur = [];
            } else cur.push([X(i), Y(p.y)]);
        });
        if (cur.length) segs.push(cur);
        segs.forEach(sg => {
            g += `<polyline class="ln" style="stroke:${s.color}" points="${sg.map(p=>p.join(',')).join(' ')}"/>`;
            if (sg.length === 1) g += `<circle cx="${sg[0][0]}" cy="${sg[0][1]}" r="4" style="fill:${s.color}"/>`;
        });
        const li = s.pts.map((p, i) => p.y != null ? i : -1).filter(i => i >= 0).pop();
        if (li != null) {
            ends.push({
                s,
                li,
                y: Y(s.pts[li].y)
            });
        }
    });
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) {
        const prev = ends[k - 1].ly != null ? ends[k - 1].ly : ends[k - 1].y;
        if (ends[k].y - prev < 14) ends[k].ly = prev + 14;
    }
    ends.forEach(e => {
        const ly = e.ly != null ? e.ly : e.y;
        g += `<circle class="dot" cx="${X(e.li)}" cy="${e.y}" r="4.5" style="fill:${e.s.color}"/><text class="dl" x="${X(e.li)+9}" y="${ly+4}">${esc(e.s.name)}</text>`;
    });
    g += `<line class="xh" id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" style="display:none"/>`;
    g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" style="${onClick?'cursor:pointer':''}"/>`;
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="gráfico de linhas">${g}</svg>`;
    const svg = $('svg', host),
        xh = $('#xh', svg),
        hit = $('.hit', svg);
    const idxAt = e => {
        const b = svg.getBoundingClientRect();
        const px = b.width ? (e.clientX - b.left) / b.width * W : 0;
        let i = Math.round((px - m.l) / iw * (xl.length - 1));
        if (!isFinite(i)) i = 0;
        return Math.max(0, Math.min(xl.length - 1, i));
    };
    hit.addEventListener('mousemove', e => {
        const i = idxAt(e);
        xh.setAttribute('x1', X(i));
        xh.setAttribute('x2', X(i));
        xh.style.display = '';
        const rows = series.filter(s => s.pts[i] && s.pts[i].y != null).map(s => `<div class="tr"><span class="sw" style="background:${s.color}"></span><span>${esc(s.name)}</span><b>${(tipfmt||yfmt)(s.pts[i].y,s.pts[i])}</b></div>`).join('');
        showTip(`<div class="th">${xl[i]}</div>${rows||'<div class="tr">sem dados</div>'}${onClick?'<div class="tr mu">clique para detalhar</div>':''}`, e);
    });
    hit.addEventListener('mouseleave', () => {
        xh.style.display = 'none';
        hideTip();
    });
    if (onClick) hit.addEventListener('click', e => {
        hideTip();
        onClick(idxAt(e), xl[idxAt(e)]);
    });
}

function groupedBars(host, {
    cats,
    series,
    val,
    yfmt,
    lfmt,
    H = 270,
    W = 760,
    label = 'all',
    tip: tf,
    onClick
}) {
    const m = {
            l: 58,
            r: 12,
            t: 22,
            b: 34
        },
        iw = W - m.l - m.r,
        ih = H - m.t - m.b;
    const all = [];
    cats.forEach(c => series.forEach(s => {
        const v = val(c, s);
        if (v != null) all.push(v);
    }));
    if (!all.length) {
        host.innerHTML = '<div class="empty">Sem dados para o filtro selecionado.</div>';
        return;
    }
    const top = niceMax(Math.max(...all) * 1.08),
        Y = v => m.t + ih * (1 - v / top);
    let g = '';
    for (let k = 0; k <= 4; k++) {
        const v = top * k / 4,
            y = Y(v);
        g += `<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l-8}" y="${y+4}" text-anchor="end">${yfmt(v)}</text>`;
    }
    const cw = iw / cats.length,
        gap = Math.min(4, cw * 0.02),
        bw = Math.min(34, (cw * 0.7 - gap * (series.length - 1)) / series.length),
        gw = bw * series.length + gap * (series.length - 1);
    cats.forEach((c, ci) => {
        const x0 = m.l + cw * ci + (cw - gw) / 2;
        series.forEach((s, si) => {
            const v = val(c, s);
            const x = x0 + si * (bw + gap);
            if (v != null && v > 0) {
                const y = Y(v),
                    h = m.t + ih - y;
                g += `<path class="bar" data-c="${ci}" data-s="${si}" style="fill:${s.color};${onClick?'cursor:pointer':''}" d="M${x},${m.t+ih} V${y+4} Q${x},${y} ${x+4},${y} H${x+bw-4} Q${x+bw},${y} ${x+bw},${y+4} V${m.t+ih} Z"/>`;
                if (label === 'all' || (label === 'last' && si === series.length - 1)) g += `<text class="vl" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${lfmt(v)}</text>`;
            }
        });
        g += `<text class="ax cx" x="${m.l+cw*ci+cw/2}" y="${H-10}" text-anchor="middle">${esc(c)}</text>`;
    });
    g += `<line class="base" x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}"/>`;
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="gráfico de barras">${g}</svg>`;
    $$('.bar', host).forEach(b => {
        const c = cats[+b.dataset.c],
            s = series[+b.dataset.s];
        bindTip(b, () => tf ? tf(c, s, val(c, s)) : `<div class="th">${esc(c)}</div><div class="tr"><span class="sw" style="background:${s.color}"></span><span>${esc(s.name)}</span><b>${lfmt(val(c,s))}</b></div>${onClick?'<div class="tr mu">clique para detalhar</div>':''}`);
        if (onClick) b.addEventListener('click', () => {
            hideTip();
            onClick(c, s, val(c, s));
        });
    });
}

function legend(items) {
    return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
}

function waterfall(host, steps, {
    fmt
}) {
    const W = 1100,
        H = 300,
        m = {
            l: 20,
            r: 20,
            t: 34,
            b: 52
        },
        iw = W - m.l - m.r,
        ih = H - m.t - m.b;
    let run = 0;
    const bars = steps.map((s, i) => {
        if (s.total) {
            run = s.v;
            return {
                ...s,
                a: 0,
                b: s.v
            };
        }
        const a = run;
        run += s.v;
        return {
            ...s,
            a,
            b: run
        };
    });
    const lo = Math.min(...bars.map(b => Math.min(b.a, b.b))),
        hi = Math.max(...bars.map(b => Math.max(b.a, b.b)));
    const base = Math.min(0, lo),
        top = hi + (hi - base) * 0.12;
    const Y = v => m.t + ih * (1 - (v - base) / (top - base));
    const cw = iw / bars.length,
        bw = Math.min(84, cw * 0.62);
    let g = '';
    bars.forEach((b, i) => {
        const x = m.l + cw * i + (cw - bw) / 2,
            y1 = Y(Math.max(b.a, b.b)),
            y2 = Y(Math.min(b.a, b.b)),
            hgt = Math.max(2, y2 - y1);
        const cls = b.total ? 'wt' : (b.v > 0 ? 'wu' : 'wd');
        g += `<rect class="wf ${cls}" x="${x}" y="${y1}" width="${bw}" height="${hgt}" rx="4"/>`;
        const lab = b.total ? fmt(b.v) : ((b.v > 0 ? '+' : '−') + fmt(Math.abs(b.v)));
        g += `<text class="vl" x="${x+bw/2}" y="${y1-7}" text-anchor="middle">${lab}</text>`;
        const words = b.name.split(' ');
        const l1 = words.slice(0, Math.ceil(words.length / 2)).join(' '),
            l2 = words.slice(Math.ceil(words.length / 2)).join(' ');
        g += `<text class="ax cx" x="${x+bw/2}" y="${H-30}" text-anchor="middle">${esc(l1)}</text><text class="ax cx" x="${x+bw/2}" y="${H-16}" text-anchor="middle">${esc(l2)}</text>`;
        if (i < bars.length - 1) g += `<line class="wc" x1="${x+bw}" x2="${x+cw}" y1="${Y(b.b)}" y2="${Y(b.b)}"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ponte de valores">${g}</svg>`;
    $$('.wf', host).forEach((el, i) => bindTip(el, () => `<div class="th">${esc(bars[i].name)}</div><div class="tr">${bars[i].note||''}</div>`));
}

function stackBar(items, {
    fmt,
    min = 7
}) { // [{name,color,v}] -> barra 100% HTML
    const tot = items.reduce((a, b) => a + b.v, 0) || 1;
    return `<div class="stack">${items.filter(i=>i.v>0).map(i=>{ const p=i.v/tot; return `<div class="seg" style="width:${p*100}%;background:${i.color};color:${i.tc||'#fff'}" data-tip="${esc(i.name)}|${esc(fmt(i.v))}|${NF1.format(p*100)}%">${p*100>=min?`<span>${NF0.format(p*100)}%</span>`:''}</div>`; }).join('')}</div>`;
}

function bindStackTips(root) {
    $$('.seg', root).forEach(s => bindTip(s, () => {
        const [n, v, p] = s.dataset.tip.split('|');
        return `<div class="th">${n}</div><div class="tr"><span>${v}</span><b>${p}</b></div>`;
    }));
}

/* ---------- mapa de calor (paleta sequencial da Prime Ocean: --s1..--s5) ---------- */
function heatMap(host, {
    rowsL,
    cols,
    val,
    fmt,
    tipFmt,
    onClick
}) {
    const stops = ['--s1', '--s2', '--s3', '--s4', '--s5'].map(cssVar).filter(Boolean);
    if (stops.length < 2) stops.push('#CFEFEA', '#03443E');
    const cells = [];
    rowsL.forEach(r => cols.forEach(c => {
        const v = val(r, c);
        if (v != null && isFinite(v)) cells.push(v);
    }));
    if (!cells.length) {
        host.innerHTML = '<div class="empty">Sem dados para o filtro selecionado.</div>';
        return;
    }
    const lo = Math.min(...cells),
        hi = Math.max(...cells);
    let html = '<div class="hm-wrap"><table class="hm"><thead><tr><th></th>' + cols.map(c => `<th>${esc(c.l)}</th>`).join('') + '</tr></thead><tbody>';
    rowsL.forEach(r => {
        html += `<tr><td class="rh">${esc(r.l)}</td>`;
        cols.forEach(c => {
            const v = val(r, c);
            if (v == null || !isFinite(v)) {
                html += '<td class="c empty">—</td>';
            } else {
                const t = hi > lo ? (v - lo) / (hi - lo) : 0.5;
                const rgb = scaleColorRGB(t, stops);
                const textDark = relLum(rgb) > 0.42;
                html += `<td class="c" data-r="${esc(String(r.k))}" data-c="${esc(String(c.k))}" style="background:rgb(${rgb.join(',')});color:${textDark?'#04302B':'#fff'};${onClick?'cursor:pointer':''}">${fmt(v)}</td>`;
            }
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    host.innerHTML = html;
    $$('.c:not(.empty)', host).forEach(td => {
        const r = rowsL.find(x => String(x.k) === td.dataset.r),
            c = cols.find(x => String(x.k) === td.dataset.c);
        bindTip(td, () => (tipFmt ? tipFmt(r, c, val(r, c)) : `<div class="th">${esc(r.l)} · ${esc(c.l)}</div><div class="tr"><b>${fmt(val(r,c))}</b></div>`) + (onClick ? '<div class="tr mu">clique para detalhar</div>' : ''));
        if (onClick) td.addEventListener('click', () => {
            hideTip();
            onClick(r, c, val(r, c));
        });
    });
}

/* ---------- decomposição preço x mix x volume ----------
   keyFn opcional agrupa por outra dimensão além de fornecedor (r.a) — por exemplo
   por porte de embarcação (r.tier), para isolar quanto da variação de custo veio
   de renegociar tarifa (mesma faixa) vs. trocar de embarcação (mudou de faixa). */
function decompose(y0, y1, rs, keyFn) {
    keyFn = keyFn || (r => r.a);
    const A = new Set();
    const r0 = rs.filter(r => r.y === y0),
        r1 = rs.filter(r => r.y === y1);
    r0.concat(r1).forEach(r => A.add(keyFn(r)));
    const t0 = agg(r0),
        t1 = agg(r1);
    if (!t0.h || !t1.h) return null;
    let price = 0,
        mix = 0;
    const per = [];
    A.forEach(a => {
        const a0 = agg(r0.filter(r => keyFn(r) === a)),
            a1 = agg(r1.filter(r => keyFn(r) === a));
        const s0 = a0.h / t0.h,
            s1 = a1.h / t1.h;
        let e0 = a0.eff,
            e1 = a1.eff;
        if (e0 == null) e0 = e1;
        if (e1 == null) e1 = e0;
        const p = s1 * (e1 - e0),
            mx = (s1 - s0) * e0;
        price += p;
        mix += mx;
        per.push({
            a,
            price: p,
            mix: mx,
            s0,
            s1,
            e0,
            e1,
            h0: a0.h,
            h1: a1.h
        });
    });
    const vol = (t1.h - t0.h) * t0.eff;
    return {
        t0,
        t1,
        price,
        mix,
        vol,
        priceTot: t1.h * price,
        mixTot: t1.h * mix,
        per
    };
}

/* ---------- conteúdo dos painéis de detalhe (clique nos gráficos) ---------- */
function agRowsHtml(rs) {
    const byAg = [...groupBy(rs, r => r.a)].map(([k, g]) => ({
        a: k,
        ag: agg(g)
    })).sort((x, y) => y.ag.c - x.ag.c);
    return byAg.map(x => `<tr class="rowclick" data-ag="${esc(x.a)}"><td><i class="dotc" style="background:${agColor(x.a)}"></i>${esc(x.a)}</td><td class="n">${fN(x.ag.n)}</td><td class="n">${fH(x.ag.h)}</td><td class="n">${fMi(x.ag.c)}</td><td class="n">${x.ag.eff?fR(x.ag.eff):'—'}</td></tr>`).join('') || '<tr><td colspan="5" class="mu">Sem dados</td></tr>';
}

function wireAgRows(root, year) {
    $$('.rowclick[data-ag]', root).forEach(tr => tr.addEventListener('click', () => openAgencyYearDrawer(tr.dataset.ag, year)));
}

/* clique no mês (mapa de calor) → detalhe daquele mês específico, com quem gastou e a maior operação */
function openMonthDrawer(year, month) {
    const label = MES[month - 1].toUpperCase() + ' / ' + year;
    const g = S.all.filter(r => r.t === 'H' && r.y === year && r.m === month && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const a = agg(g);
    const yG = S.all.filter(r => r.t === 'H' && r.y === year && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const ya = agg(yG);
    const dv = dlt(a.eff, ya.eff);
    const byAg = [...groupBy(g, r => r.a)].map(([k, rs]) => ({
        a: k,
        ag: agg(rs)
    })).sort((x, y2) => y2.ag.c - x.ag.c);
    const top = byAg[0];
    const topOp = g.length ? [...g].sort((x, y2) => (y2.vt || 0) - (x.vt || 0))[0] : null;
    const insights = [];
    if (dv != null) insights.push(`Este mês custou <b>${fR(a.eff)}/h</b>, ${fP(Math.abs(dv),false)} ${dv<0?'abaixo':'acima'} da média de ${year} (${fR(ya.eff)}/h).`);
    if (top && a.c) insights.push(`<b>${esc(top.a)}</b> respondeu por <b>${NF0.format(top.ag.c/a.c*100)}%</b> do gasto do mês.`);
    if (topOp) insights.push(`Maior operação: <b>${esc(topOp.e)}</b> em ${esc(topOp.l)} — ${fMi(topOp.vt)} (${NF1.format(topOp.h)} h a ${fR(topOp.vh)}/h).`);
    const body = `<div class="kgrid k3">
      ${kpi('Custo por hora', a.eff?fR(a.eff):'—', dv!=null?[trend(dv,true,'vs média de '+year)]:[], '')}
      ${kpi('Manobras', fN(a.n), [], '')}
      ${kpi('Custo por manobra', a.n?fR(a.c/a.n):'—', [], '')}
    </div>
    ${insights.length?`<ul class="msgs drw-msgs">${insights.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}
    ${byAg.length?`<h4>Gasto por fornecedor neste mês</h4><div id="drw-chart"></div>`:''}
    <h4>Detalhe por fornecedor <span class="mu">— clique para ver o ano inteiro</span></h4>
    ${tbl([{t:'Fornecedor'},{t:'Manobras',c:'n'},{t:'Horas',c:'n'},{t:'Gasto',c:'n'},{t:'R$/h',c:'n'}],[agRowsHtml(g)])}`;
    openDrawer(label, body, root => {
        wireAgRows(root, year);
        if (byAg.length) groupedBars($('#drw-chart', root), {
            cats: byAg.map(x => x.a),
            series: [{
                name: 'Gasto',
                color: 'var(--teal)'
            }],
            val: c => {
                const f = byAg.find(x => x.a === c);
                return f ? f.ag.c : null;
            },
            yfmt: v => fMi(v),
            lfmt: v => fMi(v),
            H: 170,
            W: 360,
            label: 'all',
            onClick: c => openAgencyYearDrawer(c, year)
        });
    });
}

/* clique num ponto de gráfico mensal (linha) → compara aquele mês entre todos os anos */
function openMonthAllYearsDrawer(mi) {
    const month = mi + 1,
        label = MES[mi].toUpperCase() + ' — comparação entre anos';
    const per = S.years.map(y => {
        const g = S.all.filter(r => r.t === 'H' && r.y === y && r.m === month && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
        return {
            y,
            a: agg(g)
        };
    });
    const withData = per.filter(p => p.a.n && p.a.eff != null);
    let insight = '';
    if (withData.length > 1) {
        const best = withData.reduce((m, p) => (m == null || p.a.eff < m.a.eff) ? p : m, null);
        const worst = withData.reduce((m, p) => (m == null || p.a.eff > m.a.eff) ? p : m, null);
        if (best && worst && best.y !== worst.y) {
            insight = `<ul class="msgs drw-msgs"><li><b>${MES[mi].toUpperCase()}</b> foi mais barato em <b>${best.y}</b> (${fR(best.a.eff)}/h) e mais caro em <b>${worst.y}</b> (${fR(worst.a.eff)}/h) — diferença de ${fP(Math.abs(dlt(worst.a.eff,best.a.eff)),false)}.</li></ul>`;
        }
    }
    const rows = per.map(p => `<tr class="rowclick" data-y="${p.y}"><td>${p.y}</td><td class="n">${fN(p.a.n)}</td><td class="n">${fH(p.a.h)}</td><td class="n">${fMi(p.a.c)}</td><td class="n">${p.a.eff?fR(p.a.eff):'—'}</td><td class="n">${p.a.n?fR(p.a.c/p.a.n):'—'}</td></tr>`).join('');
    const body = `${insight}
    ${withData.length?'<div id="drw-chart"></div>':''}
    <h4>Por ano <span class="mu">— clique para ver o mês por fornecedor</span></h4>
    ${tbl([{t:'Ano'},{t:'Manobras',c:'n'},{t:'Horas',c:'n'},{t:'Gasto',c:'n'},{t:'R$/h',c:'n'},{t:'R$/manobra',c:'n'}],[rows])}`;
    openDrawer(label, body, root => {
        $$('.rowclick[data-y]', root).forEach(tr => tr.addEventListener('click', () => openMonthDrawer(+tr.dataset.y, month)));
        if (withData.length) lineChart($('#drw-chart', root), {
            series: [{
                name: 'R$/h efetivo',
                color: 'var(--teal)',
                pts: per.map(p => ({
                    y: p.a.eff
                }))
            }],
            xl: S.years.map(String),
            yfmt: v => NF0.format(v),
            tipfmt: v => fR(v) + '/h',
            ymin: 'auto',
            H: 150,
            W: 360,
            onClick: i => openMonthDrawer(S.years[i], month)
        });
    });
}

/* clique numa barra de "custo por hora, ano a ano" → detalhe do ano, com de-onde-vem-a-variação e sazonalidade */
function openYearDrawer(year) {
    const g = S.all.filter(r => r.t === 'H' && r.y === year && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const a = agg(g);
    const idx = S.years.indexOf(year);
    const prevYear = idx > 0 ? S.years[idx - 1] : null;
    let insight = '';
    if (prevYear) {
        const dec = decompose(prevYear, year, rowsF(['H']));
        if (dec) {
            const pp = dec.price,
                mm = dec.mix;
            insight = `<ul class="msgs drw-msgs"><li>Vs. ${prevYear}: <b>${fR(Math.abs(pp))}</b>/h ${pp<0?'vieram da redução de tarifa dentro dos fornecedores':'vieram de aumento de tarifa nos fornecedores'} e <b>${fR(Math.abs(mm))}</b>/h ${mm<0?'da mudança para fornecedores mais baratas (mix)':'de um mix mais caro'}.</li></ul>`;

    }
    const monthly = MES.map((_, mi) => agg(g.filter(r => r.m === mi + 1)));

/* clique num fornecedor (tabela, barras ou mapa de calor) → detalhe daquele fornecedor naquele ano, vs. a frota */
function openAgencyYearDrawer(agency, year) {
    const g = S.all.filter(r => r.t === 'H' && r.a === agency && r.y === year && (!S.f.loc || r.l === S.f.loc));
    const a = agg(g);
    const fleet = agg(S.all.filter(r => r.t === 'H' && r.y === year && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc)));
    const dv = dlt(a.eff, fleet.eff);
    const cap = S.cap;
    let sv = 0,
        hAb = 0;
    g.forEach(r => {
        if (r.vh > cap) {
            sv += (r.vh - cap) * r.bh;
            hAb += r.h;
        }
    });
    const insights = [];
    if (dv != null) insights.push(`Tarifa <b>${fP(Math.abs(dv),false)} ${dv<0?'abaixo':'acima'}</b> da média da frota em ${year} (${fR(fleet.eff)}/h).`);
    if (sv > 1) insights.push(`Renegociar as horas deste fornecedor acima de ${fR(cap)}/h geraria <b>${fMi(sv)}</b> de economia (${fH(hAb)}).`);
    const monthly = MES.map((_, mi) => agg(g.filter(r => r.m === mi + 1)));
    const rows = MES.map((m, i) => monthly[i].n ? `<tr class="rowclick" data-m="${i+1}"><td>${m.toUpperCase()}</td><td class="n">${fN(monthly[i].n)}</td><td class="n">${fH(monthly[i].h)}</td><td class="n">${fMi(monthly[i].c)}</td><td class="n">${monthly[i].eff?fR(monthly[i].eff):'—'}</td></tr>` : '').join('');
    const body = `<div class="kgrid k3">
      ${kpi('Tarifa média', a.tar?fR(a.tar):'—', dv!=null?[trend(dv,true,'vs frota '+year)]:[], String(year))}
      ${kpi('Manobras', fN(a.n), [], '')}
      ${kpi('Gasto no ano', fMi(a.c), [], '')}
    </div>
    ${insights.length?`<ul class="msgs drw-msgs">${insights.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}
    <h4>Mês a mês <span class="mu">— clique para o detalhe do mês</span></h4>
    <div id="drw-chart"></div>
    ${tbl([{t:'Mês'},{t:'Manobras',c:'n'},{t:'Horas',c:'n'},{t:'Gasto',c:'n'},{t:'R$/h',c:'n'}],[rows])}`;
    openDrawer(esc(agency) + ' · ' + year, body, root => {
        $$('.rowclick[data-m]', root).forEach(tr => tr.addEventListener('click', () => openMonthDrawer(year, +tr.dataset.m)));
        lineChart($('#drw-chart', root), {
            series: [{
                name: 'R$/h',
                color: agColor(agency),
                pts: monthly.map(m => ({
                    y: m.n ? m.eff : null
                }))
            }],
            xl: MES.map(m => m.toUpperCase()),
            yfmt: v => NF0.format(v),
            tipfmt: v => fR(v) + '/h',
            ymin: 'auto',
            H: 150,
            W: 360,
            onClick: mi => openMonthDrawer(year, mi + 1)
        });
    });
}

/* clique numa faixa do gráfico "Renegociação de tarifa vs. porte" → detalhe daquele porte naquele ano */
function openTierDrawer(tier, year) {
    const inYear = y => S.all.filter(r => r.t === 'H' && r.y === y && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const g = inYear(year).filter(r => r.tier === tier);
    const a = agg(g);
    const fleet = agg(inYear(year));
    const share = fleet.h ? a.h / fleet.h * 100 : null;
    const idx = S.years.indexOf(year);
    const prevYear = idx > 0 ? S.years[idx - 1] : null;
    const insight = [];
    if (prevYear) {
        const gPrev = inYear(prevYear).filter(r => r.tier === tier);
        const fleetPrev = agg(inYear(prevYear));
        const aPrev = agg(gPrev);
        const sharePrev = fleetPrev.h ? aPrev.h / fleetPrev.h * 100 : null;
        if (share != null && sharePrev != null) {
            const dShare = share - sharePrev;
            insight.push(`Participação nas horas: <b>${NF1.format(share)}%</b> em ${year}, ante <b>${NF1.format(sharePrev)}%</b> em ${prevYear} (${dShare>=0?'+':''}${NF1.format(dShare)} p.p.).`);
        }
        if (a.eff != null && aPrev.eff != null) {
            const dv = dlt(a.eff, aPrev.eff);
            insight.push(`Tarifa efetiva desta faixa: <b>${fR(a.eff)}/h</b> em ${year} vs ${fR(aPrev.eff)}/h em ${prevYear} — ${fP(Math.abs(dv),false)} ${dv<0?'abaixo':'acima'}.`);
        }
    }
    const byVessel = [...groupBy(g, r => r.eN)].map(([k, gg]) => ({
        e: gg[0].e || k,
        a: gg[0].a,
        ag: agg(gg)
    })).sort((x, y) => y.ag.h - x.ag.h);
    const vesselRows = byVessel.map(x => `<tr><td>${esc(x.e)}<br><span class="mu">${esc(x.a)}</span></td><td class="n">${fN(x.ag.n)}</td><td class="n">${fH(x.ag.h)}</td><td class="n">${fMi(x.ag.c)}</td><td class="n">${x.ag.eff?fR(x.ag.eff):'—'}</td></tr>`).join('') || '<tr><td colspan="5" class="mu">Sem dados</td></tr>';
    const monthly = MES.map((_, mi) => agg(g.filter(r => r.m === mi + 1)));
    const body = `<div class="kgrid k3">
      ${kpi('Horas nesta faixa', fH(a.h), [], share!=null?NF1.format(share)+'% das horas de '+year:'')}
      ${kpi('Gasto no ano', fMi(a.c), [], '')}
      ${kpi('Custo por hora efetivo', a.eff?fR(a.eff):'—', [], TIER_RANGE[tier]||'')}
    </div>
    ${insight.length?`<ul class="msgs drw-msgs">${insight.map(m=>`<li>${m}</li>`).join('')}</ul>`:''}
    <h4>Mês a mês em ${year}</h4>
    <div id="drw-chart"></div>
    <h4>Embarcações desta faixa <span class="mu">— ${byVessel.length} embarcaç${byVessel.length===1?'ão':'ões'}</span></h4>
    ${tbl([{t:'Embarcação / fornecedor'},{t:'Manobras',c:'n'},{t:'Horas',c:'n'},{t:'Gasto',c:'n'},{t:'R$/h',c:'n'}],[vesselRows])}`;
    openDrawer(TIER_LABEL[tier] + ' · ' + year, body, root => {
        lineChart($('#drw-chart', root), {
            series: [{
                name: 'R$/h',
                color: TIER_COLOR[tier],
                pts: monthly.map(m => ({
                    y: m.h >= 5 ? m.eff : null
                }))
            }],
            xl: MES.map(m => m.toUpperCase()),
            yfmt: v => NF0.format(v),
            tipfmt: v => fR(v) + '/h',
            ymin: 'auto',
            H: 150,
            W: 360
        });
    });
}

/* ---------- elementos comuns ---------- */
function card(title, sub, body, cls = '') {
    return `<section class="card ${cls}"><div class="card-head"><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${body}</section>`;
}

function kpi(label, value, notes, foot, big) {
    const wash = big && notes[0] ? (notes[0].cls === 'good' ? 'good' : notes[0].cls === 'bad' ? 'bad' : '') : '';
    return `<div class="kpi ${big?'kpi-hero':''} ${wash}"><div class="kl">${label}</div><div class="kv">${value}</div>${notes.map(n=>`<div class="kn ${n.cls||''}"><span class="ic">${n.ic||''}</span>${n.t}</div>`).join('')}${foot?`<div class="kf">${foot}</div>`:''}</div>`;
}

function trend(d, mode = true, ref = '') {
    if (d == null) return {
        cls: '',
        ic: '',
        t: '—'
    };
    const down = d < 0,
        flat = Math.abs(d) < 0.005;
    let cls = '';
    if (!flat) {
        if (mode === true) cls = down ? 'good' : 'bad';
        else if (mode === 'spend') cls = down ? 'good' : 'warn';
    }
    return {
        cls,
        ic: flat ? '■' : (down ? '▼' : '▲'),
        t: `<b>${fP(d)}</b> ${ref}`
    };
}

/* alterna entre tabela e mapa de calor no mesmo card — usado em Preço, Volume e Fornecedores */
function toggleView(id, label1, label2) {
    return `<div class="seg2 vtoggle" data-vt="${id}"><button data-k="tab" class="on">${label1}</button><button data-k="heat">${label2}</button></div><div id="${id}-body"></div>`;
}

function wireToggle(id, renders) { // renders = {tab(host), heat(host)}
    const root = $(`.vtoggle[data-vt="${id}"]`);
    if (!root) return;
    const body = $('#' + id + '-body');
    const show = k => {
        body.innerHTML = '';
        renders[k](body);
        $$('button', root).forEach(b => b.classList.toggle('on', b.dataset.k === k));
    };
    $$('button', root).forEach(b => b.onclick = () => show(b.dataset.k));
    show('tab');
}

function tbl(head, rows, cls = '') {
    return `<div class="tw"><table class="${cls}"><thead><tr>${head.map((h,i)=>`<th class="${h.c||''}">${h.t!==undefined?h.t:h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ===================== VIEWS ===================== */
const V = {};

V.resumo = function() {
    const rs = rowsF(['H']),
        by = byYear(rs),
        cur = S.cur,
        prv = S.cur - 1,
        base = S.years[0];
    const A = y => agg(by[y] || []);
    const a = A(cur),
        p = A(prv),
        b = A(base);
    const rsAll = rowsF(['H', 'D', 'A', 'S']);
    const totAll = y => rsAll.filter(r => r.y === y).reduce((s, r) => s + (r.vt || 0), 0);
    const dec = decompose(prv, cur, rs);
    const decT = decompose(prv, cur, rs, r => r.tier);
    const kp = [
        kpi('Custo médio por hora <em>efetivo</em>', fR(a.eff), [trend(dlt(a.eff, p.eff), true, 'vs ' + prv + ' <span class="mu">(' + fR(p.eff) + ')</span>'), base !== prv ? trend(dlt(a.eff, b.eff), true, 'vs ' + base + ' <span class="mu">(' + fR(b.eff) + ')</span>') : null].filter(Boolean), 'gasto ÷ horas realizadas de rebocador', true),
        kpi('Tarifa média contratada (R$/h)', fR(a.tar), [trend(dlt(a.tar, p.tar), true, 'vs ' + prv + ' <span class="mu">(' + fR(p.tar) + ')</span>'), base !== prv ? trend(dlt(a.tar, b.tar), true, 'vs ' + base + ' <span class="mu">(' + fR(b.tar) + ')</span>') : null].filter(Boolean), 'média ponderada da tarifa/h cobrada'),
        kpi('Gasto com rebocadores (por hora)', fMi(a.c), [trend(dlt(a.c, p.c), 'spend', 'vs ' + prv + ' <span class="mu">(' + fMi(p.c) + ')</span>'), base !== prv ? trend(dlt(a.c, b.c), 'spend', 'vs ' + base + ' <span class="mu">(' + fMi(b.c) + ')</span>') : null].filter(Boolean), 'não inclui diárias/afretamentos'),
        kpi('Horas de rebocador', fH(a.h), [trend(dlt(a.h, p.h), false, 'vs ' + prv + ' <span class="mu">(' + fH(p.h) + ')</span>'), base !== prv ? trend(dlt(a.h, b.h), false, 'vs ' + base + ' <span class="mu">(' + fH(b.h) + ')</span>') : null].filter(Boolean), fN(a.n) + ' linhas de rebocador em ' + cur),
        kpi('Manobras no ano', fN(a.n), [trend(dlt(a.n, p.n), false, 'vs ' + prv + ' <span class="mu">(' + fN(p.n) + ')</span>'), base !== prv ? trend(dlt(a.n, b.n), false, 'vs ' + base + ' <span class="mu">(' + fN(b.n) + ')</span>') : null].filter(Boolean), a.n ? 'custo médio ' + fR(a.c / a.n) + '/manobra' : ''),
    ];
    const msgs = [];
    if (a.eff && p.eff) {
        const d = dlt(a.eff, p.eff);
        msgs.push(`<b>Preço por hora:</b> o custo efetivo de ${cur} é <b>${fR(a.eff)}/h</b>, <b>${fP(Math.abs(d),false)} ${d<0?'abaixo':'acima'}</b> de ${prv} (${fR(p.eff)}/h)` + (b.eff && base !== prv ? ` e ${fP(Math.abs(dlt(a.eff,b.eff)),false)} ${a.eff<b.eff?'abaixo':'acima'} de ${base}` : '') + ` — mesmo período (${perLabel()}).`);
    }
    if (dec) {
        const pp = dec.price,
            mm = dec.mix;
        msgs.push(`<b>De onde vem a variação:</b> da diferença de ${fR(Math.abs(a.eff-p.eff))}/h, <b>${fR(Math.abs(pp))}</b> ${pp<0?'vêm da redução de tarifa dentro das próprios fornecedores':'são aumento de tarifa dentro dos fornecedores'} e <b>${fR(Math.abs(mm))}</b> ${mm<0?'vêm da mudança no mix (mais horas nos fornecedores mais baratas)':'vêm de mix mais caro'}.`);
        const vd = dlt(a.h, p.h),
            cd = dlt(a.c, p.c);
        msgs.push(`<b>Gasto total:</b> ${cd>=0?'subiu':'caiu'} <b>${fP(Math.abs(cd),false)}</b> (${fMi(p.c)} → ${fMi(a.c)}) porque o volume de horas ${vd>=0?'cresceu':'caiu'} <b>${fP(Math.abs(vd),false)}</b> — preço menor, mas mais horas contratadas.`);
    }
    if (decT) {
        const gCur = (by[cur] || []),
            gPrv = (by[prv] || []);
        const hCur = gCur.reduce((s, r) => s + r.h, 0) || 1,
            hPrv = gPrv.reduce((s, r) => s + r.h, 0) || 1;
        const shGrandeCur = gCur.filter(r => r.tier === 'Grande').reduce((s, r) => s + r.h, 0) / hCur * 100;
        const shGrandePrv = gPrv.filter(r => r.tier === 'Grande').reduce((s, r) => s + r.h, 0) / hPrv * 100;
        if (Math.abs(decT.mixTot) > Math.max(1000, a.c * 0.001)) {
            msgs.push(`<b>Porte das embarcações:</b> as horas em rebocadores de <b>grande porte</b> foram de <b>${NF1.format(shGrandePrv)}%</b> (${prv}) para <b>${NF1.format(shGrandeCur)}%</b> (${cur}) do total; isso ${decT.mixTot<0?`sozinho evitou <b>${fMi(Math.abs(decT.mixTot))}</b>`:`sozinho custou <b>${fMi(Math.abs(decT.mixTot))}</b> a mais`} em ${cur}, além do efeito de renegociação de tarifa (aba <i>Eficiência em custos</i>).`);
        }
    }
    // dispersão
    const cur_rs = by[cur] || [];
    if (cur_rs.length) {
        const cap = S.cap;
        let sv = 0,
            hAbove = 0;
        cur_rs.forEach(r => {
            if (r.vh > cap) {
                sv += (r.vh - cap) * r.bh;
                hAbove += r.h;
            }
        });
        msgs.push(`<b>Oportunidade:</b> ${NF0.format(hAbove/a.h*100)}% das horas de ${cur} foram pagas acima de ${fR(cap)}/h; renegociar essas horas para o teto geraria <b>${fMi(sv)}</b>.`);
    }
    // volume de manobras e novas frentes
    if (a.n && b.n) {
        const dn = dlt(a.n, b.n);
        msgs.push(`<b>Volume de manobras:</b> ${cur} teve <b>${fN(a.n)} manobras</b> (${fP(Math.abs(dn),false)} ${dn>=0?'a mais':'a menos'} que ${base}, que teve ${fN(b.n)}) — mesmo período (${perLabel()}). Custo médio por manobra: ${fR(a.c/a.n)} em ${cur} vs ${fR(b.c/b.n)} em ${base}.`);
    }
    const locsBase = new Set(rowsF(['H']).filter(r => r.y === base).map(r => r.l));
    const locsCur = [...new Set(rowsF(['H']).filter(r => r.y === cur).map(r => r.l))];
    const novos = locsCur.filter(l => !locsBase.has(l));
    if (novos.length) {
        msgs.push(`<b>Novas frentes:</b> em ${cur}, ${novos.length} ativo(s) passaram a gerar manobras que não existiam em ${base} — ${novos.slice(0,4).map(esc).join(', ')}${novos.length>4?' e outros':''}. Isso empurra o volume para cima mesmo com preço/h em queda.`);
    }
    // marco: quanto pagaríamos sem a redução (ou aumento) de tarifa nos fornecedores
    let milestoneHtml = '';
    if (dec && a.h) {
        const savings = -dec.priceTot; // >0 = economia por redução de tarifa
        const hypot = a.c - dec.priceTot; // gasto se a tarifa/h de cada fornecedor não tivesse mudado desde `base`
        if (Math.abs(savings) > Math.max(1000, a.c * 0.002)) {
            const isGood = savings > 0;
            milestoneHtml = `<div class="milestone">
        <div class="mi-ic">${isGood?'★':'⚠'}</div>
        <div>
          <div>${isGood
            ? `<b>Marco:</b> a redução de tarifa dos fornecedores entre ${prv} e ${cur} evitou <span class="mi-num">${fMi(savings)}</span> em gastos`
            : `<b>Atenção:</b> o aumento de tarifa dos fornecedores entre ${prv} e ${cur} adicionou <span class="mi-num">${fMi(Math.abs(savings))}</span> ao gasto`} — considerando o mesmo volume e mix de horas de ${cur} (${perLabel()}).</div>
          <div class="milestone-grid">
            <div class="milestone-item"><div class="ml">Gasto real em ${cur}</div><div class="mv">${fMi(a.c)}</div></div>
            <div class="milestone-item"><div class="ml">Gasto sem a ${isGood?'redução':'variação'} de tarifa</div><div class="mv acc">${fMi(hypot)}</div></div>
            <div class="milestone-item"><div class="ml">${isGood?'Economia':'Impacto'}</div><div class="mv">${fP(hypot?savings/hypot:null,false)}</div></div>
          </div>
        </div>
      </div>`;
        }
    }
    // renegociação de tarifa vs. porte das embarcações (link direto com a planilha: coluna EMBARCAÇÃO UTILIZADA)
    let tierHtml = '';
    if (decT && a.h) {
        const inYear = y => rs.filter(r => r.y === y);
        const shareOf = (y, tier) => {
            const g = inYear(y);
            const t = g.reduce((s, r) => s + r.h, 0);
            return t ? g.filter(r => r.tier === tier).reduce((s, r) => s + r.h, 0) / t * 100 : null;
        };
        const rowsTier = S.years.map(y => {

        ${kpi('Horas em porte grande/premium', NF1.format(shareCur)+'%', [{cls:shareCur<=sharePrv?'good':'bad',t:(shareCur<=sharePrv?'▼ ':'▲ ')+NF1.format(sharePrv)+'% em '+prv}], cur+' ('+perLabel()+')')}

        name: String(y),
        color: YCOL(y),
        y
    }));

   <div class="eyebrow mt">Leitura executiva e tendência</div>

     ${card('Leitura executiva','Frases geradas automaticamente a partir da planilha — mudam quando os dados ou os filtros mudam',`<ul class="msgs">${msgs.map(m=>`<li>${m}</li>`).join('')}</ul>`)}

};

V.preco = function() {
    const rs = rowsF(['H']),
        ser = S.years.map(y => ({
            name: String(y),
            color: YCOL(y),
            y
        }));
    const per = S.f.per;
    // linha mensal
    const lines = S.years.map(y => ({
        name: String(y),
        color: YCOL(y),
        pts: MES.map((_, mi) => {
            const g = rs.filter(r => r.y === y && r.m === mi + 1);
            const a = agg(g);
            return {
                y: a.h >= 20 ? a.eff : null,
                h: a.h,
                n: a.n
            };
        })
    }));
    // faixas de tarifa
    const bands = [{
        n: 'até R$ 1.500',
        lo: 0,
        hi: 1500,
        c: 'var(--s1)'
    }, {
        n: 'R$ 1.501–2.000',
        lo: 1500,
        hi: 2000,
        c: 'var(--s2)'
    }, {
        n: 'R$ 2.001–2.500',
        lo: 2000,
        hi: 2500,
        c: 'var(--s3)'
    }, {
        n: 'R$ 2.501–3.000',
        lo: 2500,
        hi: 3000,
        c: 'var(--s4)'
    }, {
        n: 'acima de R$ 3.000',
        lo: 3000,
        hi: 1e9,
        c: 'var(--s5)'
    }];
    const by = byYear(rs);
    const ladder = S.years.map(y => {
        const items = bands.map((b, bi) => ({
            name: b.n,
            color: b.c,
            tc: bi < 3 ? '#04302B' : '#fff',
            v: (by[y] || []).filter(r => r.vh > b.lo && r.vh <= b.hi).reduce((s, r) => s + r.bh, 0)
        }));
        return `<div class="lrow"><span class="ly">${y}</span>${stackBar(items,{fmt:v=>NF0.format(v)+' h faturadas'})}</div>`;
    }).join('');
    const agsAll = agencies().filter(a => S.f.ag.has(a));
    const totH = rs.reduce((x, r) => x + r.h, 0) || 1;
    const ags = agsAll.filter(a => rs.filter(r => r.a === a).reduce((x, r) => x + r.h, 0) / totH >= 0.02);
    const tarBars = `<div class="lgd">${legend(ser)}</div><div id="ch-tar"></div>`;
    const rows = ags.map(a => {
        const vals = S.years.map(y => agg((by[y] || []).filter(r => r.a === a)));
        return `<tr><td><i class="dotc" style="background:${agColor(a)}"></i>${esc(a)}</td>${vals.map(v=>`<td class="n">${v.tar?fR(v.tar):'—'}</td>`).join('')}<td class="n">${vals[vals.length-1].tar&&vals[vals.length-2].tar?trendCell(dlt(vals[vals.length-1].tar,vals[vals.length-2].tar)):'—'}</td></tr>`;
    }).join('');
    const hmRows = S.years.map(y => ({
        k: y,
        l: String(y)
    }));
    const hmCols = MES.map((m, i) => ({
        k: i + 1,
        l: m.toUpperCase()
    }));
    const hmVal = (r, c) => {
        const a = agg((by[r.k] || []).filter(x => x.m === c.k));
        return a.h >= 20 ? a.eff : null;
    };
    const html = `${card('Custo médio por hora — mês a mês','R$ por hora de rebocador realizada (gasto ÷ horas). Meses com menos de 20 h não são plotados. Clique num ponto para comparar os anos naquele mês.',`<div class="lgd">${legend(ser)}</div><div id="ch-line"></div>`)}
  <div class="two">
   ${card('Tarifa média por fornecedor','R$ por hora faturada (média ponderada) — '+perLabel()+' · clique numa barra para detalhar',tarBars)}
   ${card('Em que faixa de tarifa pagamos as horas','% das horas faturadas por faixa de R$/h — quanto mais claro, mais barato',`<div class="ladder">${ladder}</div><div class="legend bandleg">${bands.map(b=>`<span><i style="background:${b.c}"></i>${b.n}</span>`).join('')}</div>`)}
  </div>
  ${card('Mapa de calor — custo por hora, ano × mês','R$/h efetivo · tons mais escuros da paleta Prime Ocean = mais caro · meses com menos de 20 h faturadas ficam em branco · clique numa célula para o detalhe do mês',`<div id="ch-hm"></div>`,'mt')}
  ${card('Tarifa média por fornecedor','R$/h — alterne entre tabela e mapa de calor · clique num fornecedor/célula para detalhar',toggleView('preco-ag','Ranking','Mapa de calor'),'mt')}
  ${card('Como ler','',`<p class="note"><b>Custo efetivo</b> = gasto ÷ horas realmente utilizadas (é o "valor médio por hora" do SUMÁRIO). <b>Tarifa contratada</b> = gasto ÷ horas faturadas (o preço/h combinado). A diferença entre as duas é o arredondamento de horas cobrado pelos fornecedores. Diárias, afretamentos e linhas com erro de digitação ficam fora desta aba para não distorcer a comparação (ver aba <i>Dados</i>).</p>`,'mt')}`;
    return {
        html,
        after() {
            lineChart($('#ch-line'), {
                series: lines,
                xl: MES.map(m => m.toUpperCase()),
                yfmt: v => NF0.format(v),
                tipfmt: (v, p) => fR(v) + '/h <span class="mu">· ' + NF0.format(p.h) + ' h</span>',
                ymin: 'auto',
                H: 300,
                W: 1100,
                onClick: i => openMonthAllYearsDrawer(i)
            });
            groupedBars($('#ch-tar'), {
                cats: ags,
                series: ser,
                val: (a, s) => {
                    const g = agg((by[s.y] || []).filter(r => r.a === a));
                    return g.tar;
                },
                yfmt: v => NF0.format(v),
                lfmt: v => NF0.format(Math.round(v)),
                H: 270,
                W: 560,
                label: 'none',
                tip: (c, s, v) => {
                    const g = agg((by[s.y] || []).filter(r => r.a === c));
                    return `<div class="th">${esc(c)} · ${s.name}</div><div class="tr"><span>Tarifa média</span><b>${fR(v)}/h</b></div><div class="tr"><span>Horas</span><b>${fH(g.h)}</b></div><div class="tr"><span>Gasto</span><b>${fMi(g.c)}</b></div>`;
                },
                onClick: (a, s) => openAgencyYearDrawer(a, s.y)
            });
            heatMap($('#ch-hm'), {
                rowsL: hmRows,
                cols: hmCols,
                val: hmVal,
                fmt: v => NF0.format(Math.round(v)),
                tipFmt: (r, c, v) => {
                    const a = agg((by[r.k] || []).filter(x => x.m === c.k));
                    return `<div class="th">${c.l} de ${r.k}</div><div class="tr"><span>Custo/h</span><b>${fR(a.eff)}</b></div><div class="tr"><span>Manobras</span><b>${fN(a.n)}</b></div><div class="tr"><span>Gasto</span><b>${fMi(a.c)}</b></div>`;
                },
                onClick: (r, c) => openMonthDrawer(r.k, c.k)
            });
            wireToggle('preco-ag', {
                tab: host => {
                    host.innerHTML = tbl([{
                        t: 'Fornecedor'
                    }, ...S.years.map(y => ({
                        t: y,
                        c: 'n'
                    })), {
                        t: 'Var. ' + S.cur + ' vs ' + (S.cur - 1),
                        c: 'n'
                    }], [rows]);
                },
                heat: host => heatMap(host, {
                    rowsL: ags.map(a => ({
                        k: a,
                        l: a
                    })),
                    cols: S.years.map(y => ({
                        k: y,
                        l: String(y)
                    })),
                    val: (r, c) => {
                        const g = agg((by[c.k] || []).filter(x => x.a === r.k));
                        return g.tar;
                    },
                    fmt: v => NF0.format(Math.round(v)),
                    tipFmt: (r, c, v) => {
                        const g = agg((by[c.k] || []).filter(x => x.a === r.k));
                        return `<div class="th">${esc(r.l)} · ${c.l}</div><div class="tr"><span>Tarifa média</span><b>${fR(v)}/h</b></div><div class="tr"><span>Horas</span><b>${fH(g.h)}</b></div>`;
                    },
                    onClick: (r, c) => openAgencyYearDrawer(r.k, c.k)
                })
            });
            $$('.ladder').forEach(bindStackTips);
        }
    };
};

function trendCell(d, goodDown = true) {
    if (d == null) return '—';
    const flat = Math.abs(d) < 0.005;
    const cls = (flat || goodDown === null) ? '' : ((d < 0) === goodDown ? 'good' : 'bad');
    return `<span class="tc ${cls}">${flat?'■':(d<0?'▼':'▲')} ${fP(Math.abs(d),false)}</span>`;
}

V.volume = function() {
    const rs = rowsF(['H']),
        cur = S.cur,
        cmp = S.base,
        dec = decompose(cmp, cur, rs);
    if (!dec) return {
        html: card('Volume × preço', '', `<div class="empty">Sem horas nos dois anos para o filtro selecionado.</div>`),
        after() {}
    };
    const steps = [{
            name: 'Gasto ' + cmp,
            v: dec.t0.c,
            total: 1,
            note: fMi(dec.t0.c) + ' (' + fH(dec.t0.h) + ' a ' + fR(dec.t0.eff) + '/h)'
        },
        {
            name: 'Volume de horas',
            v: dec.vol,
            note: 'Δ horas (' + (dec.t1.h - dec.t0.h >= 0 ? '+' : '') + NF0.format(dec.t1.h - dec.t0.h) + ' h) × custo/h de ' + cmp
        },
        {
            name: 'Tarifa nos fornecedores',
            v: dec.priceTot,
            note: 'Mudança de tarifa dentro de cada fornecedor, sobre as horas de ' + cur
        },
        {
            name: 'Mix de fornecedores',
            v: dec.mixTot,
            note: 'Mudança na distribuição das horas entre fornecedores, sobre as horas de ' + cur
        },
        {
            name: 'Gasto ' + cur,
            v: dec.t1.c,
            total: 1,
            note: fMi(dec.t1.c) + ' (' + fH(dec.t1.h) + ' a ' + fR(dec.t1.eff) + '/h)'
        }
    ];
    const by = byYear(rs);
    // acumulado
    const cumH = {},
        cumC = {},
        cumN = {};
    S.years.forEach(y => {
        let c = 0,
            h = 0,
            n = 0;
        cumC[y] = [];
        cumH[y] = [];
        cumN[y] = [];
        for (let m = 1; m <= 12; m++) {
            (by[y] || []).filter(r => r.m === m).forEach(r => {
                c += r.vt;
                h += r.h;
                n += 1;
            });
            const any = (by[y] || []).some(r => r.m <= m);
            cumC[y].push(any && (y < cur || m <= S.cut.m || S.f.per === 'ano') ? {
                y: c
            } : {
                y: null
            });
            cumH[y].push(any && (y < cur || m <= S.cut.m || S.f.per === 'ano') ? {
                y: h
            } : {
                y: null
            });
            cumN[y].push(any && (y < cur || m <= S.cut.m || S.f.per === 'ano') ? {
                y: n
            } : {
                y: null
            });
        }
    });
    // fim do último ano parcial: corta meses > mês do último dado
    const lastM = S.cut.m;
    S.years.forEach(y => {
        if (y === cur) {
            cumC[y] = cumC[y].map((p, i) => i + 1 > lastM ? {
                y: null
            } : p);
            cumH[y] = cumH[y].map((p, i) => i + 1 > lastM ? {
                y: null
            } : p);
            cumN[y] = cumN[y].map((p, i) => i + 1 > lastM ? {
                y: null
            } : p);
        }
    });
    const cs = S.years.map(y => ({
            name: String(y),
            color: YCOL(y),
            pts: cumC[y]
        })),
        hs = S.years.map(y => ({
            name: String(y),
            color: YCOL(y),
            pts: cumH[y]
        })),
        ns = S.years.map(y => ({
            name: String(y),
            color: YCOL(y),
            pts: cumN[y]
        }));
    // custo médio por manobra, mês a mês (não cumulativo)
    const cpmLines = S.years.map(y => ({
        name: String(y),
        color: YCOL(y),
        pts: MES.map((_, mi) => {
            const g = (by[y] || []).filter(r => r.m === mi + 1);
            const a = agg(g);
            return {
                y: a.n >= 3 ? a.c / a.n : null,
                n: a.n
            };
        })
    }));
    const dp = dec.per.filter(x => x.h0 || x.h1).sort((a, b) => (b.h1) - (a.h1));
    const rows = dp.map(x => `<tr><td><i class="dotc" style="background:${agColor(x.a)}"></i>${esc(x.a)}</td><td class="n">${NF1.format(x.s0*100)}%</td><td class="n">${NF1.format(x.s1*100)}%</td><td class="n">${x.h0?fR(x.e0):'—'}</td><td class="n">${x.h1?fR(x.e1):'—'}</td><td class="n">${x.h0&&x.h1?trendCell(dlt(x.e1,x.e0)):'—'}</td></tr>`).join('');
    const html = `<div class="ctl"><label>Comparar ${cur} com <select id="sel-base">${S.years.filter(y=>y!==cur).map(y=>`<option ${y===cmp?'selected':''}>${y}</option>`).join('')}</select></label><span class="mu">período: ${perLabel()}</span></div>
   ${card('Por que o gasto mudou: volume, tarifa ou mix?','Ponte do gasto com rebocadores por hora, '+cmp+' → '+cur+' ('+perLabel()+'). Barras vermelhas aumentam o gasto; verdes reduzem.',`<div id="ch-wf"></div><p class="note">Volume = variação de horas × custo/h de ${cmp}. Tarifa = redução de preço <i>dentro</i> de cada fornecedor. Mix = deslocamento de horas entre fornecedores com tarifas diferentes. A soma dos três explica exatamente a variação do gasto.</p>`)}
   <div class="two">
    ${card('Gasto acumulado no ano','R$ acumulado mês a mês (serviços por hora) · clique num ponto para comparar os anos naquele mês',`<div class="lgd">${legend(cs)}</div><div id="ch-cc"></div>`)}
    ${card('Horas acumuladas no ano','Horas de rebocador realizadas, acumulado',`<div class="lgd">${legend(hs)}</div><div id="ch-ch"></div>`)}
   </div>
   <div class="two">
    ${card('Manobras acumuladas no ano','Nº de manobras de rebocador, acumulado mês a mês',`<div class="lgd">${legend(ns)}</div><div id="ch-cn"></div>`)}
    ${card('Custo médio por manobra, mês a mês','Gasto ÷ nº de manobras (não cumulativo) — meses com menos de 3 manobras não são plotados. É este o indicador que pode subir mesmo com o R$/h caindo, se as manobras ficarem mais longas ou mais numerosas por operação.',`<div class="lgd">${legend(ns)}</div><div id="ch-cpm"></div>`)}
   </div>
   ${card('Mix e custo por hora, por fornecedor','Participação nas horas e custo efetivo (R$/h) em '+cmp+' e '+cur+' · alterne para o mapa de calor · clique para detalhar',toggleView('vol-ag','Ranking','Mapa de calor'),'mt')}`;
    return {
        html,
        after() {
            $('#sel-base').onchange = e => {
                S.base = +e.target.value;
                render();
            };
            waterfall($('#ch-wf'), steps, {
                fmt: fMi
            });
            lineChart($('#ch-cc'), {
                series: cs,
                xl: MES.map(m => m.toUpperCase()),
                yfmt: v => v >= 1e6 ? NF1.format(v / 1e6) + ' mi' : NF0.format(v / 1e3) + ' mil',
                tipfmt: v => fMi(v),
                H: 250,
                W: 560,
                onClick: i => openMonthAllYearsDrawer(i)
            });
            lineChart($('#ch-ch'), {
                series: hs,
                xl: MES.map(m => m.toUpperCase()),
                yfmt: v => NF0.format(v),
                tipfmt: v => fH(v),
                H: 250,
                W: 560,
                onClick: i => openMonthAllYearsDrawer(i)
            });
            lineChart($('#ch-cn'), {
                series: ns,
                xl: MES.map(m => m.toUpperCase()),
                yfmt: v => NF0.format(v),
                tipfmt: v => fN(v) + ' manobras',
                H: 250,
                W: 560,
                onClick: i => openMonthAllYearsDrawer(i)
            });
            lineChart($('#ch-cpm'), {
                series: cpmLines,
                xl: MES.map(m => m.toUpperCase()),
                yfmt: v => NF0.format(v),
                tipfmt: (v, p) => fR(v) + '/manobra <span class="mu">· ' + NF0.format(p.n) + ' manobras</span>',
                ymin: 'auto',
                H: 250,
                W: 560,
                onClick: i => openMonthAllYearsDrawer(i)
            });
            wireToggle('vol-ag', {
                tab: host => {
                    host.innerHTML = tbl([{
                        t: 'Fornecedor'
                    }, {
                        t: '% horas ' + cmp,
                        c: 'n'
                    }, {
                        t: '% horas ' + cur,
                        c: 'n'
                    }, {
                        t: 'R$/h ' + cmp,
                        c: 'n'
                    }, {
                        t: 'R$/h ' + cur,
                        c: 'n'
                    }, {
                        t: 'Var.',
                        c: 'n'
                    }], [rows]);
                },
                heat: host => heatMap(host, {
                    rowsL: dp.map(x => ({
                        k: x.a,
                        l: x.a
                    })),
                    cols: [{
                        k: cmp,
                        l: String(cmp)
                    }, {

V.onde = function() {

    })).filter(x => x.c.c || x.p.c).sort((a, b) => b.c.c - a.c.c);

  </div>
