V.efic = function() {
    const all = rowsF(['H']),
        by = byYear(all);
    const yrs = S.years;
    const arred = y => {
        const g = by[y] || [];
        const pago = g.reduce((s, r) => s + r.vt, 0),
            real = g.reduce((s, r) => s + r.h * r.vh, 0);
        return {
            ex: pago - real,
            pct: real ? pago / real - 1 : null,
            hf: g.reduce((s, r) => s + r.bh, 0),
            hr: g.reduce((s, r) => s + r.h, 0)
        };
    };
    const exc = y => {
        const g = (by[y] || []);
        const w = g.filter(r => r.ia != null && r.ex != null);
        const pos = w.filter(r => r.ex > 0.01);
        return {
            n: g.length,
            w: w.length,
            cov: g.length ? w.length / g.length : null,
            ops: pos.length,
            share: w.length ? pos.length / w.length : null,
            h: pos.reduce((s, r) => s + r.ex, 0),
            cost: pos.reduce((s, r) => s + r.ex * r.vh, 0)
        };
    };
    const canc = y => {
        const g = rowsF(['H', 'S']).filter(r => r.y === y && /cancel/i.test(r.ob));
        return {
            n: g.length,
            c: g.reduce((s, r) => s + (r.vt || 0), 0)
        };
    };
    const dia = y => {
        const g = rowsF(['D']).filter(r => r.y === y);
        return {
            n: g.length,
            c: g.reduce((s, r) => s + (r.vt || 0), 0)
        };
    };
    const th = y => `<th class="n">${y}</th>`;
    const rowA = `<tr><td>Horas realizadas</td>${yrs.map(y=>`<td class="n">${fH(arred(y).hr)}</td>`).join('')}</tr><tr><td>Horas faturadas</td>${yrs.map(y=>`<td class="n">${fH(arred(y).hf)}</td>`).join('')}</tr><tr><td>Pago a mais que o tempo realizado</td>${yrs.map(y=>`<td class="n"><b>${fMi(arred(y).ex)}</b> <span class="mu">(${arred(y).pct==null?'—':fP(arred(y).pct)})</span></td>`).join('')}</tr>`;
    const rowE = `<tr><td>Linhas com horas previstas (IA) preenchidas</td>${yrs.map(y=>`<td class="n">${fN(exc(y).w)} <span class="mu">(${exc(y).cov==null?'—':NF0.format(exc(y).cov*100)+'%'})</span></td>`).join('')}</tr><tr><td>% das linhas acima do previsto</td>${yrs.map(y=>`<td class="n">${exc(y).share==null?'—':NF0.format(exc(y).share*100)+'%'}</td>`).join('')}</tr><tr><td>Horas excedentes</td>${yrs.map(y=>`<td class="n">${exc(y).w?fH(exc(y).h):'—'}</td>`).join('')}</tr><tr><td>Custo estimado do excedente</td>${yrs.map(y=>`<td class="n"><b>${exc(y).w?fMi(exc(y).cost):'—'}</b></td>`).join('')}</tr>`;
    const rowC = `<tr><td>Linhas de operações canceladas</td>${yrs.map(y=>`<td class="n">${fN(canc(y).n)}</td>`).join('')}</tr><tr><td>Valor pago em operações canceladas</td>${yrs.map(y=>`<td class="n"><b>${fMi(canc(y).c)}</b></td>`).join('')}</tr>`;
    const rowD = `<tr><td>Dias de diária / afretamento</td>${yrs.map(y=>`<td class="n">${fN(dia(y).n)}</td>`).join('')}</tr><tr><td>Valor pago</td>${yrs.map(y=>`<td class="n"><b>${fMi(dia(y).c)}</b></td>`).join('')}</tr>`;
    const cv = yrs.map(y => ({
        y,
        c: exc(y).cov
    })).filter(x => x.c != null);
    const warn = cv.length && cv[cv.length - 1].c < 0.5 ? `<div class="alert"><b>Atenção:</b> em ${cv[cv.length-1].y} só ${NF0.format(cv[cv.length-1].c*100)}% das linhas têm horas previstas (IA) preenchidas. Sem esse dado não dá para medir o excedente — hoje o principal indicador de aderência ao planejado.</div>` : '';
    const html = `<div class="two">
   ${card('Arredondamento de horas','Os fornecedores cobram hora cheia. Valor pago − (horas realizadas × tarifa). Quando negativo, o fornecedor cobrou menos que o tempo real.',tbl([{t:''},...yrs.map(y=>({t:y,c:'n'}))],[rowA]))}
   ${card('Horas excedentes ao previsto (coluna IA)','Operações que passaram das horas previstas geram custo não planejado.'+' '+perLabel(),warn+tbl([{t:''},...yrs.map(y=>({t:y,c:'n'}))],[rowE]))}
  </div>
  <div class="two">
   ${card('Operações canceladas','Linhas cuja observação cita cancelamento, com valor cobrado',tbl([{t:''},...yrs.map(y=>({t:y,c:'n'}))],[rowC]))}
   ${card('Diárias e afretamentos','Contratados fora da lógica de hora — ficam fora dos indicadores de R$/h',tbl([{t:''},...yrs.map(y=>({t:y,c:'n'}))],[rowD]))}
  </div>`;
    return {
        html,
        after() {}
    };
};

V.sim = function() {
    const rs = (byYear(rowsF(['H']))[S.cur] || []);
    const t = agg(rs);
    if (!rs.length) return {
        html: card('Simulador', '', `<div class="empty">Sem dados para o filtro selecionado.</div>`),
        after() {}
    };
    const lvMap = groupBy(rs, r => Math.round(r.vh));
    const lv = [...lvMap].map(([k, g]) => ({
        k: +k,
        a: agg(g)
    })).sort((a, b) => a.k - b.k);
    const minTar = {};
    groupBy(rs, r => r.a).forEach((g, a) => {
        const lm = groupBy(g, r => Math.round(r.vh));
        const ok = [...lm].filter(([k, x]) => x.length >= 8).map(([k]) => +k);
        minTar[a] = ok.length ? Math.min(...ok) : Math.min(...g.map(r => r.vh));
    });
    const target = r => S.simMode === 'cap' ? S.cap : minTar[r.a];
    let sv = 0,
        hAb = 0;
    const per = {};
    rs.forEach(r => {
        const tg = target(r);
        if (r.vh > tg + 0.5) {
            const s = (r.vh - tg) * r.bh;
            sv += s;
            hAb += r.h;
            const o = per[r.a] || (per[r.a] = {
                a: r.a,
                s: 0,
                h: 0,
                tg
            });
            o.s += s;
            o.h += r.h;
        }
    });
    const newEff = (t.c - sv) / t.h;
    const mxL = Math.max(...lv.map(x => x.a.h));
    const lvRows = lv.map(x => `<div class="lvr"><span class="lk">${fR(x.k)}</span><div class="lb"><i style="width:${x.a.h/mxL*100}%;${(S.simMode==='cap'&&x.k>S.cap)?'':'opacity:.55'}"></i></div><span class="lv">${fH(x.a.h)} · ${fMi(x.a.c)}</span></div>`).join('');
    const pr = Object.values(per).sort((a, b) => b.s - a.s).map(o => `<tr><td><i class="dotc" style="background:${agColor(o.a)}"></i>${esc(o.a)}</td><td class="n">${fR(o.tg)}</td><td class="n">${fH(o.h)}</td><td class="n"><b>${fMi(o.s)}</b></td></tr>`).join('');
    const html = `<div class="ctl">
    <div class="seg2"><button data-m="cap" class="${S.simMode==='cap'?'on':''}">Teto único de R$/h</button><button data-m="min" class="${S.simMode==='min'?'on':''}">Padronizar na menor tarifa recorrente de cada fornecedor</button></div>
    ${S.simMode==='cap'?`<label class="sl">Teto: <b id="capv">${fR(S.cap)}</b>/h <input type="range" id="cap" min="1250" max="3000" step="50" value="${S.cap}"></label>`:`<span class="mu">Menor tarifa com pelo menos 8 linhas no ano, por fornecedor</span>`}
   </div>
   <div class="kgrid k3">
    ${kpi('Economia potencial em '+S.cur,fMi(sv),[{t:'<b>'+NF1.format(sv/t.c*100)+'%</b> do gasto por hora ('+fMi(t.c)+')',cls:'good',ic:'▼'}],perLabel())}
    ${kpi('Custo/h resultante',fR(newEff),[{t:'hoje: '+fR(t.eff)+' · '+trend(dlt(newEff,t.eff),true).t,cls:'good',ic:'▼'}],'gasto − economia ÷ horas realizadas')}
    ${kpi('Horas afetadas',fH(hAb),[{t:NF0.format(hAb/t.h*100)+'% das horas de '+S.cur}],'horas hoje pagas acima da tarifa-alvo')}
   </div>
   <div class="two">
    ${card('Distribuição das horas por nível de tarifa — '+S.cur,'Barras mais fortes = horas acima da tarifa-alvo'+(S.simMode==='cap'?' (teto)':''),`<div class="lvl">${lvRows}</div>`)}
    ${card('Economia por fornecedor','Se as horas acima da tarifa-alvo fossem renegociadas para ela',tbl([{t:'Fornecedor'},{t:'Tarifa-alvo',c:'n'},{t:'Horas acima',c:'n'},{t:'Economia',c:'n'}],[pr||'<tr><td colspan="4" class="mu">Nenhuma hora acima da tarifa-alvo</td></tr>']))}
   </div>
   <p class="note">Simulação simples: assume que a mesma quantidade de horas seria contratada, mas na tarifa-alvo. Não considera diferenças de porte/potência do rebocador, disponibilidade nem prazos contratuais — serve para dimensionar a oportunidade em uma negociação.</p>`;
    return {
        html,
        after() {
            $$('.seg2 button').forEach(b => b.onclick = () => {
                S.simMode = b.dataset.m;
                render();
            });
            const c = $('#cap');
            if (c) c.oninput = e => {
                S.cap = +e.target.value;
                render(true);
            };
        }
    };
};

   ${card('Base carregada','',`<div class="tw"><table><tbody><tr><td>Arquivo</td><td>${esc(S.src.name)}</td></tr><tr><td>Aba lida</td><td>${esc(S.src.sheet||'DADOS')}</td></tr><tr><td>Carregado em</td><td>${esc(S.src.at||'')}</td></tr><tr><td>Linhas lidas</td><td>${fN(S.all.length)}</td></tr><tr><td>Último registro</td><td>${S.maxDate.split('-').reverse().join('/')}</td></tr><tr><td>Anos</td><td>${S.years.join(', ')}</td></tr></tbody></table></div><p><button class="btn ghost" id="reset">Voltar aos dados ao vivo</button></p>`)}
  </div>`;
    return {

/* ===================== RESULTADOS DA GESTÃO (apresentação à diretoria) =====================
   Comparação do ano atual com o anterior no mesmo período, em três alavancas:
   1) Renegociação de tarifas  — custo por hora menor dentro do mesmo porte de embarcação;
   2) Rebocador do porte certo — horas migraram para embarcações menores e mais baratas;
   3) Planejamento             — índice de atendimento (IA): manobra dentro da meta de
                                 5 h no fundeio e 3 h dentro do porto. */
const GESTAO_INI = '2025-10';
const GESTAO_LBL = 'out/25';
const MAN_MAX_H = 12; // acima disso não é manobra (viagem, apoio longo) e fica fora do índice
const isFun = r => /FUNDEI/i.test(r.od || '');
const metaIA = r => isFun(r) ? 5 : 3;
const isMan = r => r.t === 'H' && r.h > 0 && r.h <= MAN_MAX_H;

function atend(rs) {
    const m = rs.filter(isMan);
    const o = { n: m.length, ok: 0, ex: 0, exC: 0, fn: 0, fok: 0, pn: 0, pok: 0 };
    m.forEach(r => {
        const e = r.h - metaIA(r), ok = e <= 0.01;
        if (isFun(r)) { o.fn++; if (ok) o.fok++; } else { o.pn++; if (ok) o.pok++; }
        if (ok) o.ok++;
        else { o.ex += e; o.exC += e * (r.vt / r.h); }
    });
    o.pct = o.n ? o.ok / o.n : null;
    o.fp = o.fn ? o.fok / o.fn : null;
    o.pp = o.pn ? o.pok / o.pn : null;
    o.exMan = o.n ? o.ex / o.n : null;
    return o;
}

function cancel(y) {
    const g = rowsF(['H', 'S']).filter(r => r.y === y && /cancel/i.test(r.ob || ''));
    return { n: g.length, c: g.reduce((s, r) => s + (r.vt || 0), 0) };
}

function alavancas(rs, y0, y1) {
    const r0 = rs.filter(r => r.y === y0), r1 = rs.filter(r => r.y === y1);
    const t0 = agg(r0), t1 = agg(r1);
    if (!t0.h || !t1.h) return null;
    const dT = decompose(y0, y1, rs, r => r.tier); // preço dentro do porte × troca de porte
    const ag = [...new Set(r0.concat(r1).map(r => r.a))].map(a => {
        const g0 = agg(r0.filter(r => r.a === a)), g1 = agg(r1.filter(r => r.a === a));
        return { a, e0: g0.eff, e1: g1.eff, h0: g0.h, h1: g1.h };
    });
    return { t0, t1, A0: atend(r0), A1: atend(r1), eco1: dT ? -dT.priceTot : 0, eco2: dT ? -dT.mixTot : 0, ag };
}

function timeline(host, pts, iniIdx) { // pts: [{l, y, m, c, eff}]
    const W = 760, H = 290, m = { l: 62, r: 62, t: 30, b: 34 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    if (!pts.length) { host.innerHTML = '<div class="empty">Sem dados para o filtro selecionado.</div>'; return; }
    const cMax = niceMax(Math.max(...pts.map(p => p.c || 0)) * 1.05);
    const ev = pts.filter(p => p.eff != null).map(p => p.eff);
    const eMax = niceMax(Math.max(...ev) * 1.15);
    const bw = iw / pts.length;
    const X = i => m.l + bw * i + bw / 2, Yc = v => m.t + ih * (1 - v / cMax), Ye = v => m.t + ih * (1 - v / eMax);
    let g = '';
    if (iniIdx >= 0) {
        const x0 = m.l + bw * iniIdx;
        g += `<rect x="${x0}" y="${m.t}" width="${W - m.r - x0}" height="${ih}" style="fill:var(--teal-wash)" opacity=".7"/>`;
        g += `<line x1="${x0}" x2="${x0}" y1="${m.t - 6}" y2="${m.t + ih}" style="stroke:var(--teal-deep);stroke-width:1.5;stroke-dasharray:4 3"/>`;
        g += `<text x="${x0 + 6}" y="${m.t - 10}" class="dl" style="fill:var(--teal-deep)">Reorganização dos controles · ${GESTAO_LBL}</text>`;
    }
    for (let k = 0; k <= 4; k++) {
        const y = m.t + ih * (1 - k / 4);
        g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/>`;
        g += `<text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${fMi(cMax * k / 4).replace('R$ ', '')}</text>`;
        g += `<text class="ax" x="${W - m.r + 8}" y="${y + 4}">${NF0.format(eMax * k / 4)}</text>`;
    }
    g += `<text class="ax" x="${m.l - 8}" y="${m.t - 12}" text-anchor="end">gasto R$</text><text class="ax" x="${W - m.r + 8}" y="${m.t - 12}">R$/h</text>`;
    pts.forEach((p, i) => {
        const y = Yc(p.c || 0);
        g += `<rect class="bar" x="${X(i) - bw * 0.34}" y="${y}" width="${bw * 0.68}" height="${m.t + ih - y}" rx="2" style="fill:var(--y-old)" opacity="${i >= iniIdx && iniIdx >= 0 ? .75 : .45}"/>`;
        if (p.m === 1 || i === 0) g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle" style="font-weight:700">${p.y}</text>`;
        g += `<text class="ax" x="${X(i)}" y="${H - 19}" text-anchor="middle">${MES[p.m - 1].slice(0, 1).toUpperCase()}</text>`;
    });
    const line = pts.map((p, i) => p.eff != null ? `${X(i)},${Ye(p.eff)}` : null).filter(Boolean).join(' ');
    g += `<polyline class="ln" style="stroke:var(--y-mid);stroke-width:2.6" points="${line}"/>`;
    pts.forEach((p, i) => { if (p.eff != null) g += `<circle class="dot" cx="${X(i)}" cy="${Ye(p.eff)}" r="3.6" style="fill:${i >= iniIdx && iniIdx >= 0 ? 'var(--teal-deep)' : 'var(--y-mid)'}"/>`; });
    pts.forEach((p, i) => { g += `<rect class="hit" data-i="${i}" x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`; });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto mensal e custo médio por hora">${g}</svg>`;
    $$('.hit', host).forEach(el => {
        el.addEventListener('mousemove', e => {
            const p = pts[+el.dataset.i];
            showTip(`<div class="th">${MES[p.m - 1]}/${String(p.y).slice(2)}</div><div class="tr"><span>Gasto</span><b>${fMi(p.c)}</b></div><div class="tr"><span>Custo médio</span><b>${fR(p.eff)}/h</b></div><div class="tr"><span>Horas</span><b>${fH(p.h)}</b></div>`, e);
        });
        el.addEventListener('mouseleave', hideTip);
    });
}

function levCard(n, titulo, valor, linhas, cls) {
    return `<div class="lev ${cls || ''}"><div class="lev-h"><span class="lev-n">${n}</span><span class="lev-t">${titulo}</span></div><div class="lev-v">${valor}</div>${linhas.map(l => `<div class="lev-l">${l}</div>`).join('')}</div>`;
}
const fEco = v => (v >= 0 ? '' : '− ') + fMi(Math.abs(v)).replace('R$ ', 'R$ ');
const pp = v => v == null ? '—' : NF0.format(v * 100) + '%';

V.gestao = function() {
    const cur = S.cur, prv = S.cur - 1;
    const rs = rowsF(['H']);
    const L = alavancas(rs, prv, cur);
    if (!L) return { html: card('Eficiência em custos', '', '<div class="empty">Sem dados dos dois anos para comparar com o filtro atual.</div>'), after() {} };
    const { t0, t1, A0, A1 } = L;
    const eco = L.eco1 + L.eco2;
    const sem = t1.c + eco;
    const per = perLabel();
    const dEff = dlt(t1.eff, t0.eff), dH = dlt(t1.h, t0.h), dC = dlt(t1.c, t0.c);
    const C0 = cancel(prv), C1 = cancel(cur);
    const dpp = (a, b) => a == null || b == null ? '—' : (a - b >= 0 ? '+' : '−') + NF0.format(Math.abs(a - b) * 100) + ' p.p.';

    const hero = `<div class="milestone gestao-hero">
      <div class="mi-ic">★</div>
      <div style="flex:1;min-width:0">
        <div class="gh-k">Resultado em custos · ${prv} × ${cur} · ${per}</div>
        <div class="gh-t">${eco >= 0 ? 'Renegociação e porte certo evitaram' : 'Tarifa e porte somam'} <span class="mi-num">${fEco(eco)}</span> em gastos com rebocadores</div>
        <div class="milestone-grid">
          <div class="milestone-item"><div class="ml">Gasto real em ${cur}</div><div class="mv">${fMi(t1.c)}</div></div>
          <div class="milestone-item"><div class="ml">Ao custo/h de ${prv} seria</div><div class="mv acc">${fMi(sem)}</div></div>
          <div class="milestone-item"><div class="ml">Economia</div><div class="mv">${sem ? NF1.format(eco / sem * 100) + '%' : '—'}</div></div>
          <div class="milestone-item"><div class="ml">Custo médio por hora</div><div class="mv">${fR(t0.eff)} → ${fR(t1.eff)}</div></div>
        </div>
      </div></div>`;

    const lev = `<div class="levs">
      ${levCard(1, 'Renegociação de tarifas', fEco(L.eco1), [`Custo por hora <b>menor</b> com o <b>mesmo porte</b> de rebocador.`, `<span class="mu">Queda do R$/h dentro de cada porte × horas de ${cur}</span>`], L.eco1 >= 0 ? 'good' : 'bad')}
      ${levCard(2, 'Rebocador do porte certo', fEco(L.eco2), [`Manobras simples com embarcações <b>menores e mais baratas</b>.`, `<span class="mu">Troca de porte, ao custo/h de ${prv}</span>`], L.eco2 >= 0 ? 'good' : 'bad')}
      ${levCard(3, 'Planejamento das manobras', `${pp(A0.fp)} → ${pp(A1.fp)}`, [`Manobras no <b>fundeio</b> dentro da meta de <b>5 h</b>.`, `<span class="mu">Porto (meta 3 h): ${pp(A0.pp)} → ${pp(A1.pp)}</span>`], (A1.fp || 0) >= (A0.fp || 0) ? 'good' : 'bad')}
    </div>`;

    const ctx = `<div class="kgrid ctxk">
      ${kpi('Gasto com rebocadores', fMi(t1.c), [trend(dC, 'spend', 'vs ' + prv + ' <span class="mu">(' + fMi(t0.c) + ')</span>')])}
      ${kpi('Custo médio por hora', fR(t1.eff), [trend(dEff, true, 'vs ' + prv + ' <span class="mu">(' + fR(t0.eff) + ')</span>')])}
      ${kpi('Horas de rebocador', fH(t1.h), [trend(dH, false, 'vs ' + prv + ' <span class="mu">(' + fH(t0.h) + ')</span>')], 'Volume depende da demanda das operações')}
      ${kpi('Atendimentos dentro da meta', pp(A1.pct), [{ cls: A1.pct >= A0.pct ? 'good' : 'bad', ic: A1.pct >= A0.pct ? '▲' : '▼', t: `<b>${dpp(A1.pct, A0.pct)}</b> vs ${prv} <span class="mu">(${pp(A0.pct)})</span>` }], fN(A1.n) + ' atendimentos de manobra em ' + cur)}
    </div>`;

    // 1) tarifa por fornecedor
    const ags = L.ag.filter(o => (o.h1 || 0) > 0 || (o.h0 || 0) > 0).sort((a, b) => (b.h1 || 0) - (a.h1 || 0));
    const eMaxAg = Math.max(...ags.map(o => Math.max(o.e0 || 0, o.e1 || 0))) || 1;
    const agRows = ags.map(o => {
        const d = dlt(o.e1, o.e0);
        return `<tr><td><i class="dotc" style="background:${agColor(o.a)}"></i>${esc(o.a)}</td>
          <td class="bcell"><div class="bb"><i class="b0" style="width:${(o.e0 || 0) / eMaxAg * 100}%"></i></div><div class="bb"><i class="b1" style="width:${(o.e1 || 0) / eMaxAg * 100}%"></i></div></td>
          <td class="n">${o.e0 ? fR(o.e0) : '—'}<br>${o.e1 ? '<b>' + fR(o.e1) + '</b>' : '—'}</td>
          <td class="n"><span class="tc ${d == null ? '' : d < 0 ? 'good' : 'bad'}">${o.e0 && o.e1 ? fP(d) : (o.e1 ? 'novo' : 'saiu')}</span></td>
          <td class="n">${fH(o.h1)}</td></tr>`;
    });
    const c1 = card('1 · Renegociação de tarifas', `Custo médio por hora de cada fornecedor — <span class="dotc" style="background:var(--y-old)"></span>${prv} &nbsp;<span class="dotc" style="background:var(--y-cur)"></span>${cur}, no mesmo período.`,
        tbl([{ t: 'Fornecedor' }, { t: '' }, { t: 'R$/h', c: 'n' }, { t: 'Var.', c: 'n' }, { t: 'Horas ' + cur, c: 'n' }], agRows, 'loc'));

    // 2) porte das embarcações
    const tierRows = [prv, cur].map(y => {
        const g = rs.filter(r => r.y === y);
        const items = TIER_ORDER.map(t => ({ name: TIER_LABEL[t], color: TIER_COLOR[t], tc: TIER_TC[t], v: g.filter(r => r.tier === t).reduce((s, r) => s + r.h, 0) }));
        return `<div class="lrow"><span class="ly">${y}</span>${stackBar(items, { fmt: v => NF0.format(v) + ' h' })}</div>`;
    }).join('');
    const shT = (y, t) => { const g = rs.filter(r => r.y === y), tot = g.reduce((s, r) => s + r.h, 0); return tot ? g.filter(r => r.tier === t).reduce((s, r) => s + r.h, 0) / tot : null; };
    const effT = (y, t) => agg(rs.filter(r => r.y === y && r.tier === t)).eff;
    const tierTbl = tbl([{ t: 'Porte' }, { t: 'Horas ' + prv, c: 'n' }, { t: 'Horas ' + cur, c: 'n' }, { t: 'R$/h ' + prv, c: 'n' }, { t: 'R$/h ' + cur, c: 'n' }],
        TIER_ORDER.map(t => `<tr><td><i class="dotc" style="background:${TIER_COLOR[t]}"></i>${TIER_LABEL[t]}</td><td class="n">${pp(shT(prv, t))}</td><td class="n"><b>${pp(shT(cur, t))}</b></td><td class="n">${fR(effT(prv, t))}</td><td class="n"><b>${fR(effT(cur, t))}</b></td></tr>`), 'dense');
    const c2 = card('2 · Rebocador do porte certo', `Participação das horas por porte da embarcação. Porte pela tarifa de referência: pequeno até R$ 1.800/h, médio até R$ 2.800/h, grande acima.`,
        `<div class="bandleg">${legend(TIER_ORDER.map(t => ({ name: TIER_LABEL[t], color: TIER_COLOR[t] })))}</div>${tierRows}<div style="margin-top:12px">${tierTbl}</div>`);

    // 3) planejamento / índice de atendimento
    const monthsA = [];
    [prv, cur].forEach(y => { for (let mm = 1; mm <= 12; mm++) { if (y === cur && mm > S.cut.m) break; const g = rs.filter(r => r.y === y && r.m === mm); monthsA.push({ y, m: mm, a: atend(g) }); } });
    const bars = monthsA.map(o => {
        const v = o.a.fp, gest = (o.y + '-' + String(o.m).padStart(2, '0')) >= GESTAO_INI;
        return `<div class="iab" title="${MES[o.m - 1]}/${String(o.y).slice(2)}: ${pp(v)} das manobras no fundeio na meta (${fN(o.a.fn)} atendimentos)"><div class="iab-c"><i style="height:${v == null ? 0 : v * 100}%;background:${gest ? 'var(--teal-deep)' : 'var(--y-old)'}"></i></div><span>${MES[o.m - 1].slice(0, 1).toUpperCase()}</span></div>`;
    }).join('');
    const rowA = (lbl, f, bold) => `<tr><td>${lbl}</td><td class="n">${f(A0, C0)}</td><td class="n">${bold ? '<b>' + f(A1, C1) + '</b>' : f(A1, C1)}</td></tr>`;
    const iaTbl = tbl([{ t: '' }, { t: prv, c: 'n' }, { t: cur, c: 'n' }], [
        rowA('Fundeio · dentro da meta de 5 h', a => pp(a.fp) + ` <span class="mu">de ${fN(a.fn)}</span>`, true),
        rowA('Porto · dentro da meta de 3 h', a => pp(a.pp) + ` <span class="mu">de ${fN(a.pn)}</span>`, true),
        rowA('Horas além da meta por atendimento', a => a.exMan == null ? '—' : NF1.format(a.exMan) + ' h'),
        rowA('Custo das horas além da meta', a => fMi(a.exC), true),
        rowA('Operações canceladas (valor pago)', (a, c) => fN(c.n) + ` <span class="mu">${fMi(c.c)}</span>`)
    ], 'dense');
    const c3 = card('3 · Planejamento das manobras (índice de atendimento)', `Meta de atendimento: <b>5 h</b> para manobras no fundeio e <b>3 h</b> dentro do porto. Hora acima da meta é hora paga com rebocador parado ou aguardando. Manobras de até ${MAN_MAX_H} h.`,
        `<div class="iabs">${bars}</div><div class="iab-leg"><span><i style="background:var(--y-old)"></i>antes de out/25</span><span><i style="background:var(--teal-deep)"></i>desde ${GESTAO_LBL}</span><span class="mu">% das manobras no fundeio dentro da meta de 5 h, por mês</span></div><div style="margin-top:12px">${iaTbl}</div>`);

    // mensagens para a diretoria
    const msgs = [];
    msgs.push(`<b>Custo por hora:</b> de ${fR(t0.eff)}/h para <b>${fR(t1.eff)}/h</b> (${fP(dEff)}), no mesmo período de cada ano (${per}).`);
    const topAg = L.ag.filter(o => o.e0 && o.e1 && o.h1 > 20 && o.e1 < o.e0).sort((a, b) => (a.e1 - a.e0) * a.h1 - (b.e1 - b.e0) * b.h1).slice(0, 2);
    if (topAg.length) msgs.push(`<b>Renegociação:</b> ${topAg.map(o => `<b>${esc(o.a)}</b> de ${fR(o.e0)} para ${fR(o.e1)}/h`).join('; ')}.`);
    const g0 = shT(prv, 'Grande'), g1 = shT(cur, 'Grande'), p0 = shT(prv, 'Pequeno'), p1 = shT(cur, 'Pequeno');
    if (g0 != null && g1 != null) msgs.push(`<b>Porte certo:</b> horas em rebocador pequeno subiram de ${pp(p0)} para <b>${pp(p1)}</b>; grande porte caiu de ${pp(g0)} para <b>${pp(g1)}</b>.`);
    if (A0.fp != null && A1.fp != null) msgs.push(`<b>Planejamento:</b> manobras no fundeio dentro da meta de 5 h foram de ${pp(A0.fp)} para <b>${pp(A1.fp)}</b>. No porto, ${pp(A1.pp)} dentro da meta de 3 h${A1.pp <= A0.pp + 0.02 ? ' — é a próxima frente de melhoria' : ''}.`);
    if (dH != null) msgs.push(`<b>Volume:</b> as horas ${dH >= 0 ? 'cresceram' : 'caíram'} ${fP(Math.abs(dH), false)} (${fH(t0.h)} → ${fH(t1.h)}), conforme a demanda das operações; o gasto ${dC <= 0 ? 'caiu' : 'subiu'} ${fP(Math.abs(dC), false)}.`);

    const html = `${hero}${lev}${ctx}
      ${card('Evolução mês a mês', 'Barras: gasto mensal com rebocadores (serviço por hora). Linha: custo médio por hora. Área destacada: período desde out/25. Filtro de fornecedor e ativo aplicado; período completo.', '<div id="tl"></div>', 'mt')}
      <div class="two">${c1}${c2}</div>
      <div class="two">${c3}${card('Destaques para a diretoria', 'Gerado automaticamente a partir da planilha', `<ul class="msgs">${msgs.map(m => `<li>${m}</li>`).join('')}</ul><p class="note">Como calculamos: ${cur} contra ${prv} no mesmo período. A economia é a diferença entre o gasto de ${cur} e o que as mesmas horas custariam ao custo médio por hora de ${prv}, separada em preço dentro do mesmo porte (renegociação) e troca de porte (rebocador menor). Diárias e afretamentos ficam fora.</p>`)}</div>`;
    return {
        html,
        after() {
            const rsT = S.all.filter(r => r.t === 'H' && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
            const from = (S.cut.m === 12 ? cur - 1 : cur - 2) + '-' + String(S.cut.m === 12 ? 1 : S.cut.m + 1).padStart(2, '0');
            const keys = [...new Set(rsT.map(r => r.d.slice(0, 7)))].filter(k => k >= from && k <= S.maxDate.slice(0, 7)).sort();
            const pts = keys.map(k => { const g = rsT.filter(r => r.d.slice(0, 7) === k), a = agg(g); return { l: k, y: +k.slice(0, 4), m: +k.slice(5), c: a.c, h: a.h, eff: a.eff }; });
            timeline($('#tl'), pts, keys.findIndex(k => k >= GESTAO_INI));
            bindStackTips($('#view'));
        }
    };
};

/* ===================== DADOS AO VIVO =====================
   O robô da Prime Ocean lê a aba DADOS da planilha da equipe a cada 10 min e publica
   dados/rebocadores.json. O painel lê esse arquivo ao abrir, a cada 5 min e ao voltar para a aba. */
// dados direto do GitHub (atualiza sem publicar o site); reserva: cópia publicada junto do site
const LIVE_URLS = ['https://raw.githubusercontent.com/romulooc86-spec/central-de-projetos/main/projetos/dados/rebocadores.json', 'dados/rebocadores.json'];
const LIVE = { url: LIVE_URLS[0], ok: false, lido: null, sig: '', err: null, modif: null };
const fDT = s => { if (!s) return ''; const d = new Date(s); return String(d.getDate()).padStart(2, '0') + ' ' + MES[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
async function loadLive(manual) {
    try {
        let r = null;
        for (const u of LIVE_URLS) { try { r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) break; } catch (e) { r = null; } }
        if (!r) throw new Error('sem conexão');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const p = parseRows(XLSX, j.linhas, 'DADOS');
        LIVE.ok = true; LIVE.lido = new Date(); LIVE.err = null; LIVE.modif = j.modificada;
        const sig = j.modificada + '|' + j.publicado + '|' + p.rows.length;
        if (sig !== LIVE.sig) {
            LIVE.sig = sig;
            setData(p.rows, { name: j.planilha, sheet: p.sheet, at: fDT(j.publicado) });
            hideTip();
            render(true);
        }
        if (manual) toast('Dados atualizados: ' + fN(p.rows.length) + ' linhas, último registro em ' + S.maxDate.split('-').reverse().join('/') + '.');
    } catch (e) {
        LIVE.ok = false; LIVE.err = e.message;
        if (manual) toast('Não consegui ler os dados ao vivo agora. O painel mostra a última base salva.');
    }
    liveStatus();
}
function liveStatus() {
    const el = $('#live'); if (!el) return;
    const hh = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    el.innerHTML = LIVE.ok
        ? `<i class="on"></i><span>Ao vivo · planilha de ${fDT(LIVE.modif)} · lido às ${hh(LIVE.lido)}</span>`
        : `<i></i><span>Base salva no painel</span>`;
    el.title = LIVE.ok ? 'Os dados vêm da planilha Controle de Rebocadores e são relidos a cada 5 minutos.' : ('Sem conexão com os dados ao vivo' + (LIVE.err ? ' (' + LIVE.err + ')' : ''));
}
function iniciarAoVivo() {
    loadLive();
    setInterval(() => { if (!document.hidden) loadLive(); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && (!LIVE.lido || Date.now() - LIVE.lido > 60 * 1000)) loadLive(); });
}

/* ===================== VERSÃO DE TESTE — análises extras para a diretoria =====================
   Janela desde out/25: out/25 até o último registro. Base: os 12 meses anteriores (out/24–set/25).
   Filtros de fornecedor e ativo valem; o filtro de período não se aplica a estes quadros. */
const mk = r => r.d.slice(0, 7);
const addM = (k, n) => { let [y, m] = k.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); };
const BASE_INI = addM(GESTAO_INI, -12), BASE_FIM = addM(GESTAO_INI, -1);
const mLbl = k => MES[+k.slice(5) - 1] + '/' + k.slice(2, 4);
const med = a => { a = a.filter(v => v > 0).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : null; };

function janelas() {
    const H = S.all.filter(r => r.t === 'H' && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const w0 = H.filter(r => mk(r) >= BASE_INI && mk(r) <= BASE_FIM), w1 = H.filter(r => mk(r) >= GESTAO_INI);
    return { H, w0, w1, a0: agg(w0), a1: agg(w1) };
}

function ponte(w0, w1) { // gasto antes -> volume -> tarifa (mesmo porte) -> porte -> gasto depois
    const t0 = agg(w0), t1 = agg(w1);
    let preco = 0, porte = 0;
    new Set(w0.concat(w1).map(r => r.tier)).forEach(t => {
        const g0 = agg(w0.filter(r => r.tier === t)), g1 = agg(w1.filter(r => r.tier === t));
        const e0 = g0.eff != null ? g0.eff : g1.eff, e1 = g1.eff != null ? g1.eff : g0.eff;
        preco += g1.h * (e1 - e0);
        porte += t1.h * (g1.h / t1.h - g0.h / t0.h) * e0;
    });
    const vol = (t1.h - t0.h) * t0.eff;
    return { t0, t1, vol, preco, porte };
}

function marcosAuto(H) { // eventos detectados na planilha, desde 12 meses antes de out/25
    const ev = [];
    const primeiro = {}, ultimo = {};
    H.forEach(r => { const k = mk(r); if (!primeiro[r.a] || k < primeiro[r.a]) primeiro[r.a] = k; if (!ultimo[r.a] || k > ultimo[r.a]) ultimo[r.a] = k; });
    const fim = S.maxDate.slice(0, 7);
    Object.keys(primeiro).forEach(a => {
        if (primeiro[a] >= GESTAO_INI) ev.push({ k: primeiro[a], t: `Entrada do ${a}`, s: 'novo fornecedor' });
        if (ultimo[a] < addM(fim, -3) && addM(ultimo[a], 1) >= GESTAO_INI) ev.push({ k: addM(ultimo[a], 1), t: `Saída do ${a}`, s: 'deixou de ser acionado' });
    });
    // renegociação: tarifa contratada mediana do trimestre cai ≥10% frente à base
    [...new Set(H.map(r => r.a))].forEach(a => {
        const b = med(H.filter(r => r.a === a && mk(r) >= BASE_INI && mk(r) <= BASE_FIM).map(r => r.vh));
        if (!b) return;
        const meses = [...new Set(H.filter(r => r.a === a && mk(r) >= GESTAO_INI).map(mk))].sort();
        for (const k of meses) {
            const tri = H.filter(r => r.a === a && mk(r) >= k && mk(r) <= addM(k, 2));
            const v = med(tri.map(r => r.vh));
            if (v && v <= b * 0.9 && tri.length >= 4) { ev.push({ k, t: `Nova tarifa ${a}`, s: `${fR(b)} → ${fR(v)}/h` }); break; }
        }
    });
    return ev.sort((x, y) => x.k.localeCompare(y.k));
}

function curva(host, meses, ev) { // área = economia acumulada; faixa de baixo = resultado de cada mês; marcos em etiquetas curtas
    const W = 1100, H = 440, m = { l: 20, r: 20, t: 78, b: 30 }, iw = W - m.l - m.r;
    if (!meses.length) { host.innerHTML = '<div class="empty">Sem dados.</div>'; return; }
    let ac = 0; meses.forEach(o => { ac += o.eco; o.ac = ac; });
    const topA = m.t, hA = 190, baseM = topA + hA + 110, hM = 34;
    const amin = Math.min(0, ...meses.map(o => o.ac)), amax = Math.max(0, ...meses.map(o => o.ac)) * 1.1 || 1;
    const vmax = Math.max(...meses.map(o => Math.abs(o.eco))) || 1;
    const bw = iw / meses.length, X = i => m.l + bw * i + bw / 2;
    const Ya = v => topA + hA * (1 - (v - amin) / (amax - amin || 1)), Ym = v => baseM - (v / vmax) * hM;
    const idx = {}; meses.forEach((o, i) => idx[o.k] = i);
    const curto = t => t.replace(/^Início d[oa] (programa de eficiência|gestão)$/, 'Reorganização dos controles').replace('Menor custo por hora da série', 'Menor custo/h')
        .replace(/^Entrada do /, 'Entrada: ').replace(/^Saída do /, 'Saída: ').replace(/^Nova tarifa /, 'Nova tarifa: ');
    // marcos agrupados por mês
    const porMes = new Map(); ev.forEach((e, n) => { const i = idx[e.k]; if (i == null) return; if (!porMes.has(i)) porMes.set(i, []); porMes.get(i).push({ e, n }); });
    let g = '';
    // área e linha
    const pts = meses.map((o, i) => [X(i), Ya(o.ac)]);
    g += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${Ya(0)}" y2="${Ya(0)}"/><text class="ax" x="${m.l}" y="${Ya(0) - 6}">R$ 0</text>`;
    g += `<path d="${suave(pts)} L${pts[pts.length - 1][0]},${Ya(0)} L${pts[0][0]},${Ya(0)} Z" style="fill:var(--teal);opacity:.12"/>`;
    g += `<path class="ln" d="${suave(pts)}" style="stroke:var(--teal-deep);stroke-width:3.2;fill:none"/>`;
    // rótulos só nos pontos que contam a história: fundo do vale, meses com marco e o valor final
    const iMin = meses.reduce((a, o, i) => o.ac < meses[a].ac ? i : a, 0), li = meses.length - 1;
    const rot = new Set([iMin, ...porMes.keys()]); rot.delete(li); rot.delete(li - 1);   // o valor final já aparece em destaque
    meses.forEach((o, i) => { const y = Ya(o.ac); g += `<circle cx="${X(i)}" cy="${y}" r="${rot.has(i) ? 4 : 2.5}" style="fill:${rot.has(i) ? 'var(--teal-deep)' : 'var(--card)'};stroke:var(--teal-deep);stroke-width:1.5"/>`;
        if (rot.has(i)) g += `<text class="dlab" x="${X(i)}" y="${o.ac >= 0 ? y - 11 : y + 19}" text-anchor="middle" style="font-weight:700;fill:var(--tx2)">${fMi(o.ac).replace('R$ ', '')}</text>`; });
    g += `<circle cx="${X(li)}" cy="${Ya(meses[li].ac)}" r="7" style="fill:var(--teal-deep);stroke:var(--card);stroke-width:3"/>`;
    g += `<text x="${X(li) - 12}" y="${Ya(meses[li].ac) - 14}" text-anchor="end" style="font:800 15px var(--font-display);fill:var(--teal-deep)">${fMi(meses[li].ac)}</text>`;
    // marcos: etiquetas curtas numa linha, com um traço curto até o ponto
    let fimAnt = -1e9, linha = 0;
    [...porMes.keys()].sort((a, b) => a - b).forEach(i => {
        const itens = porMes.get(i), txt = itens.map(x => curto(x.e.t)).join(' · '), w = txt.length * 7.1 + 26;
        let x = Math.min(Math.max(m.l, X(i) - 10), W - m.r - w);
        linha = x < fimAnt + 8 ? (linha + 1) % 2 : 0; fimAnt = x + w;
        const y = 18 + linha * 28;
        g += `<g class="cv-ev" data-n="${itens[0].n}"><line x1="${X(i)}" x2="${X(i)}" y1="${y + 12}" y2="${Ya(meses[i].ac) - 6}" style="stroke:var(--navy);stroke-width:1;opacity:.25"/>`;
        g += `<rect x="${x}" y="${y - 11}" width="${w}" height="22" rx="11" style="fill:var(--card-soft);stroke:var(--bd2)"/><circle cx="${x + 11}" cy="${y}" r="3.5" style="fill:var(--navy)"/>`;
        g += `<text x="${x + 20}" y="${y + 4}" style="font:700 11.5px var(--font-display);fill:var(--navy)">${esc(txt)}</text></g>`;
    });
    // resultado de cada mês
    g += `<text class="axt" x="${m.l}" y="${baseM - hM - 16}">RESULTADO DO MÊS</text><line class="base" x1="${m.l}" x2="${W - m.r}" y1="${baseM}" y2="${baseM}"/>`;
    meses.forEach((o, i) => {
        const y = o.eco >= 0 ? Ym(o.eco) : baseM, h = Math.abs(Ym(o.eco) - baseM);
        g += `<rect x="${X(i) - bw * .3}" y="${y}" width="${bw * .6}" height="${Math.max(1.5, h)}" rx="2" style="fill:${o.eco >= 0 ? 'var(--teal)' : 'var(--y-old)'}"/>`;
        g += `<text class="dlab" x="${X(i)}" y="${o.eco >= 0 ? y - 5 : y + h + 12}" text-anchor="middle">${(o.eco >= 0 ? '+' : '−') + fMi(Math.abs(o.eco)).replace('R$ ', '')}</text>`;
        g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle" style="font-weight:700">${mLbl(o.k)}</text>`;
        g += `<rect class="cv-b" data-i="${i}" x="${X(i) - bw / 2}" y="${topA - 10}" width="${bw}" height="${H - topA}" fill="transparent" style="cursor:pointer"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Economia acumulada e resultado de cada mês">${g}</svg>`;
    $$('.cv-b', host).forEach(el => { const o = meses[+el.dataset.i];
        el.addEventListener('mousemove', e => showTip(`<div class="th">${mLbl(o.k)}</div><div class="tr"><span>Resultado do mês</span><b>${fEco(o.eco)}</b></div><div class="tr"><span>Acumulado</span><b>${fEco(o.ac)}</b></div><div class="tr"><span>Custo médio</span><b>${fR(o.eff)}/h</b></div>`, e));
        el.addEventListener('mouseleave', hideTip); });
    $$('.cv-ev', host).forEach(el => { el.style.cursor = 'pointer'; el.addEventListener('click', () => { const e = ev[+el.dataset.n]; const mm = /(?:do|da|tarifa) (.+)$/i.exec(e.t); if (mm && agencies().includes(mm[1].trim())) drawerItem('a', mm[1].trim(), mm[1].trim()); else drawerMes(e.k); }); });
}

function gestaoExtra() {
    const { H, w0, w1, a0, a1 } = janelas();
    if (!w0.length || !w1.length) return { marcos: '', mid: '', end: '', after() {} };
    const meses = [...new Set(w1.map(mk))].sort().map(k => { const g = agg(w1.filter(r => mk(r) === k)); return { k, eco: g.h * a0.eff - g.c, eff: g.eff, h: g.h }; });
    const ecoAc = meses.reduce((s, o) => s + o.eco, 0);
    const cheios = meses.filter(o => o.h > 60);
    const melhor = cheios.slice().sort((x, y) => x.eff - y.eff)[0];
    const ev = marcosAuto(H);
    ev.unshift({ k: GESTAO_INI, t: 'Reorganização dos controles', s: 'nova organização dos controles de contratação e planejamento' });
    if (melhor) ev.push({ k: melhor.k, t: 'Menor custo por hora da série', s: fR(melhor.eff) + '/h' });
    ev.sort((x, y) => x.k.localeCompare(y.k));
    const virada = meses.find((o, i) => meses.slice(0, i + 1).reduce((s, x) => s + x.eco, 0) > 0);

    // fornecedores
    const ags = [...new Set(w0.concat(w1).map(r => r.a))];
    const sh = (w, a) => { const t = w.reduce((s, r) => s + r.vt, 0); return t ? w.filter(r => r.a === a).reduce((s, r) => s + r.vt, 0) / t : 0; };
    const F = ags.map(a => ({ a, s0: sh(w0, a), s1: sh(w1, a), v0: med(w0.filter(r => r.a === a).map(r => r.vh)), v1: med(w1.filter(r => r.a === a).map(r => r.vh)), e1: agg(w1.filter(r => r.a === a)).eff, h1: agg(w1.filter(r => r.a === a)).h }))
        .sort((x, y) => y.s1 - x.s1 || y.s0 - x.s0);
    const reneg = F.filter(o => o.v0 && o.v1 && o.v1 < o.v0 && o.h1 > 50).sort((x, y) => (x.v1 / x.v0) - (y.v1 / y.v0))[0];
    const top = F[0];

    // rastreabilidade
    const semC = w => { const t = w.reduce((s, r) => s + r.vt, 0); return t ? w.filter(r => !r.c).reduce((s, r) => s + r.vt, 0) / t : null; };
    const cc0 = semC(w0), cc1 = semC(w1);
    const byCC = {}; w1.forEach(r => { const c = r.c || 'Sem centro de custo'; byCC[c] = (byCC[c] || 0) + r.vt; });
    const ccList = Object.entries(byCC).sort((x, y) => y[1] - x[1]).slice(0, 6);
    const ccMax = ccList.length ? ccList[0][1] : 1;

    // custo por manobra
    const cm = w => { const m = w.filter(isMan); return m.length ? m.reduce((s, r) => s + r.vt, 0) / m.length : null; };
    const cm0 = cm(w0), cm1 = cm(w1);

    // projeção 2026
    const y = S.cur, ytd = S.all.filter(r => r.t === 'H' && r.y === y && S.f.ag.has(r.a) && (!S.f.loc || r.l === S.f.loc));
    const at = agg(ytd), dia = (new Date(S.maxDate) - new Date(y + '-01-01')) / 864e5 + 1, fator = 365 / dia;
    const projC = at.c * fator, projEco = at.h * fator * a0.eff - projC;

    // oportunidades
    const arred = w1.reduce((s, r) => s + (r.vt - r.h * r.vh), 0);
    const D1 = S.all.filter(r => r.t === 'D' && mk(r) >= GESTAO_INI && S.f.ag.has(r.a));
    const dC = D1.reduce((s, r) => s + (r.vt || 0), 0);
    const porto = w1.filter(r => isMan(r) && !isFun(r) && r.h > 3.01);
    const portoC = porto.reduce((s, r) => s + (r.h - 3) * (r.vt / r.h), 0);
    const outros = agg(w1.filter(r => r.a !== top.a));
    const topGap = top && outros.eff ? Math.max(0, (top.e1 - outros.eff) * top.h1) : 0;

    const P = ponte(w0, w1);

    const tile = (l, v, s, cls) => `<div class="mc ${cls || ''}"><div class="mc-l">${l}</div><div class="mc-v">${v}</div><div class="mc-s">${s}</div></div>`;
    const marcos = `<div class="mcs">
      ${tile('Economia acumulada', fMi(ecoAc), `desde <b>${GESTAO_LBL}</b>, ao custo/h dos <b>12 meses anteriores</b>`, 'acc')}
      ${reneg ? tile('Maior renegociação', `${esc(reneg.a)} ${fP(reneg.v1 / reneg.v0 - 1)}`, `tarifa de <b>${fR(reneg.v0)}</b> para <b>${fR(reneg.v1)}/h</b>`) : ''}
      ${melhor ? tile('Menor custo/h da série', fR(melhor.eff), `em <b>${mLbl(melhor.k)}</b>`) : ''}
      ${cm0 && cm1 ? tile('Custo por manobra', `${fR(cm0)} → ${fR(cm1)}`, `<b>${fP(dlt(cm1, cm0))}</b> por atendimento`) : ''}
      ${cc0 != null ? tile('Gasto sem centro de custo', `${pp(cc0)} → ${pp(cc1)}`, 'mais <b>rastreabilidade</b> do gasto') : ''}
    </div>`;

    const evList = ev.map((e, i) => `<li><span class="evn">${i + 1}</span><b>${mLbl(e.k)} · ${esc(e.t)}</b> <span class="mu">${esc(e.s)}</span></li>`).join('');
    const tituloCurva = virada ? `A economia virou positiva em ${mLbl(virada.k)} e soma ${fMi(ecoAc)}` : `Economia acumulada: ${fEco(ecoAc)}`;
    const mid = `
      ${card(`Economia acumulada: ${fMi(ecoAc)} desde ${GESTAO_LBL}`, `Frente ao custo médio dos 12 meses anteriores (<b>${fR(a0.eff)}/h</b>)${virada ? ` · acumulado positivo desde <b>${mLbl(virada.k)}</b>` : ''}`,
        `<div id="cv"></div>`, 'mt')}
      ${card(`Ponte do custo · a demanda subiu ${fP(dlt(a1.h, a0.h))} e as ações compensaram ${fMi(-(P.preco + P.porte))}`, `${mLbl(BASE_INI)}–${mLbl(BASE_FIM)} × ${mLbl(GESTAO_INI)}–${mLbl(S.maxDate.slice(0, 7))} · serviço por hora`,
        `<div id="wf2"></div>`, 'mt')}
      ${card('<span id="t10-t">10 maiores linhas de custo</span>', `Gasto desde out/25 (${mLbl(GESTAO_INI)}–${mLbl(S.maxDate.slice(0, 7))}). Barra cheia: período atual · barra clara: 12 meses antes · ▲▼ variação frente ao período anterior`,
        `<div class="seg2 t10-seg" style="margin-bottom:12px">${T10_DIM.map((d, i) => `<button data-k="${d.k}" class="${i ? '' : 'on'}">${d.l}</button>`).join('')}</div><div id="t10"></div>`, 'mt')}`;

    const shMax = Math.max(...F.map(o => Math.max(o.s0, o.s1))) || 1;
    const fRows = F.filter(o => o.s0 > 0.005 || o.s1 > 0.005).map(o => `<tr><td><i class="dotc" style="background:${agColor(o.a)}"></i>${esc(o.a)}</td>
        <td class="bcell"><div class="bb"><i class="b0" style="width:${o.s0 / shMax * 100}%"></i></div><div class="bb"><i class="b1" style="width:${o.s1 / shMax * 100}%"></i></div></td>
        <td class="n">${pp(o.s0)}<br><b>${pp(o.s1)}</b></td>

        ${card(cc0 != null ? `Controle do gasto · sem centro de custo caiu de ${pp(cc0)} para ${pp(cc1)}` : 'Controle do gasto', `Gasto desde out/25 por centro de custo / contrato (coluna CONTRATO). Base para rateio e repasse ao cliente.`,

        ${card(`Projeção ${y} · gasto de ${fMi(projC)} e economia de ${fMi(projEco)} no ano`, `Ritmo de ${y} até ${S.maxDate.split('-').reverse().join('/')} estendido até dezembro; economia ao custo/h dos 12 meses anteriores a out/25.`,
            `<div class="kgrid k3" style="margin:0">${kpi('Gasto até agora', fMi(at.c), [], fH(at.h) + ' de rebocador')}${kpi('Gasto projetado no ano', fMi(projC), [], 'mantido o ritmo atual')}${kpi('Economia projetada', fMi(projEco), [], 'frente ao custo/h anterior')}</div>`)}
        ${card(`Próximos passos · ${fMi(oppTot)} em oportunidades mapeadas`, 'Onde ainda dá para reduzir o gasto (valores desde ' + GESTAO_LBL + '; podem se sobrepor)',

            const ccm = $('#ccm'); if (ccm) ccm.innerHTML = `<div class="iabs">${ccMes.map(o => `<div class="iab" title="${mLbl(o.k)}: ${pp(o.v)} sem centro de custo"><div class="iab-c"><i style="height:${(o.v || 0) * 100}%;background:${o.k >= GESTAO_INI ? 'var(--teal-deep)' : 'var(--y-old)'}"></i></div><span>${MES[+o.k.slice(5) - 1][0].toUpperCase()}</span></div>`).join('')}</div><div class="iab-leg"><span><i style="background:var(--y-old)"></i>12 meses antes</span><span><i style="background:var(--teal-deep)"></i>desde out/25</span></div>`;

/* ponte com eixo cortado: começa perto do menor valor para as variações aparecerem */
function ponteSvg(host, steps) {
    const W = 1100, H = 320, m = { l: 20, r: 20, t: 40, b: 56 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    let run = 0;
    const bars = steps.map(s => { if (s.total) { run = s.v; return { ...s, a: null, b: s.v }; } const a = run; run += s.v; return { ...s, a, b: run }; });
    const vals = bars.flatMap(b => [b.a, b.b].filter(v => v != null));
    const hi = Math.max(...vals), lo = Math.min(...vals);
    const base = Math.max(0, lo - (hi - lo) * 1.2), top = hi + (hi - lo) * 0.25;
    const Y = v => m.t + ih * (1 - (v - base) / (top - base));
    const cw = iw / bars.length, bw = Math.min(110, cw * 0.6);
    let g = `<text class="ax" x="${m.l}" y="${m.t - 24}">eixo a partir de ${fMi(base)}</text>`;
    bars.forEach((b, i) => {
        const x = m.l + cw * i + (cw - bw) / 2;
        const y1 = b.total ? Y(b.b) : Y(Math.max(b.a, b.b)), y2 = b.total ? Y(base) : Y(Math.min(b.a, b.b));
        const fill = b.total ? 'var(--navy)' : (b.v > 0 ? 'var(--y-old)' : 'var(--teal)');
        g += `<rect class="wf" x="${x}" y="${y1}" width="${bw}" height="${Math.max(3, y2 - y1)}" rx="4" style="fill:${fill}"/>`;
        g += `<text class="dl" x="${x + bw / 2}" y="${y1 - 9}" text-anchor="middle" style="font-size:14px">${b.total ? fMi(b.v) : (b.v > 0 ? '+' : '−') + fMi(Math.abs(b.v))}</text>`;
        g += `<text class="ax cx" x="${x + bw / 2}" y="${H - 30}" text-anchor="middle" style="font-size:12.5px;font-weight:600">${esc(b.name)}</text><text class="ax" x="${x + bw / 2}" y="${H - 13}" text-anchor="middle">${esc(b.sub || '')}</text>`;
        if (i < bars.length - 1) g += `<line class="wc" x1="${x + bw}" x2="${x + cw}" y1="${Y(b.b)}" y2="${Y(b.b)}"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ponte do custo">${g}</svg>`;
}

const T10_DIM = [
    { k: 'e', l: 'Rebocador', key: r => r.eN, lab: r => r.eN },
    { k: 'a', l: 'Fornecedor', key: r => r.a, lab: r => r.a },
    { k: 'l', l: 'Ativo atendido', key: r => r.l, lab: r => r.l },
    { k: 'od', l: 'Trajeto', key: r => (r.od || '—').toUpperCase(), lab: r => (r.od || '—').toUpperCase() },
    { k: 'c', l: 'Centro de custo', key: r => r.c || 'SEM CENTRO DE CUSTO', lab: r => r.c || 'SEM CENTRO DE CUSTO' },
    { k: 'op', l: 'Operações', key: r => r.d + '|' + r.eN + '|' + r.od + '|' + r.ln, lab: r => `${r.d.split('-').reverse().slice(0, 2).join('/')} · ${r.eN} · ${r.od || r.l}` }
];

function hbars(host, items, { fmt = fMi, noPareto = false, total, total0, keepOrder = false } = {}) {
    if (!host) return;
    if (!items.length) { host.innerHTML = '<div class="empty">Sem dados.</div>'; return; }
    items = keepOrder ? items.slice() : items.slice().sort((a, b) => b.v - a.v);
    const tot = total || items.reduce((s, o) => s + o.v, 0) || 1;
    const cmp = !noPareto && total0 > 0 && items.some(o => o.v0 != null);     // compara com os 12 meses antes
    const W = Math.max(cmp ? 720 : 520, Math.round(host.clientWidth || (cmp ? 900 : 760))), rh = 30, L = 220, R = noPareto ? 70 : (cmp ? 330 : 140), top = 8, H = top + items.length * rh + 4;
    const vmax = Math.max(...items.map(o => Math.max(o.v, o.v0 || 0))) || 1;
    const X = v => L + (W - L - R - 70) * (v / vmax);
    const seta = (d, un, casas = 1) => d == null || !isFinite(d) ? '' : (Math.abs(d) < 0.05 ? `<tspan class="dz">■ 0${un}</tspan>` : `<tspan class="${d > 0 ? 'du' : 'dd'}">${d > 0 ? '▲' : '▼'} ${(casas ? NF1 : NF0).format(Math.abs(d))}${un}</tspan>`);
    const c1 = W - R + 14, c2 = W - R + 150, c3 = W - 8;
    let g = '', ac = 0, ac0 = 0;
    if (!noPareto) {
        g += `<text class="axt" x="${c1}" y="0">DO TOTAL</text><text class="axt" x="${c3}" y="0" text-anchor="end">ACUMULADO</text>`;
        if (cmp) g += `<text class="axt" x="${c2}" y="0">VS ANTES</text>`;
    }
    items.forEach((o, i) => {
        const y = top + i * rh, lb = o.label.length > 32 ? o.label.slice(0, 31) + '…' : o.label;
        ac += o.v; ac0 += (o.v0 || 0);
        g += `<text class="ax cx" x="${L - 10}" y="${y + 19}" text-anchor="end"><title>${esc(o.label)}</title>${esc(lb)}</text>`;
        // barra clara ao fundo = 12 meses antes; barra cheia por cima = período atual
        if (o.v0 != null && o.v0 > 0) g += `<rect x="${L}" y="${y + 4}" width="${Math.max(2, X(o.v0) - L)}" height="${rh - 8}" rx="3" style="fill:var(--bd2);opacity:.75"><title>12 meses antes: ${fmt(o.v0)}</title></rect>`;
        g += `<rect class="bar hb" data-i="${i}" data-l="${esc(o.label)}" x="${L}" y="${y + 8}" width="${Math.max(2, X(o.v) - L)}" height="${rh - 16}" rx="3" style="fill:${o.color || 'var(--teal-deep)'}"/>`;
        g += `<text class="vl" x="${Math.max(X(o.v), o.v0 ? X(o.v0) : 0) + 8}" y="${y + 19}">${fmt(o.v)}</text>`;
        if (noPareto) return;
        const sh = o.v / tot * 100, acs = ac / tot * 100;
        if (cmp) {
            const sh0 = (o.v0 || 0) / total0 * 100, acs0 = ac0 / total0 * 100;
            const vr = o.v0 > 0 ? (o.v / o.v0 - 1) * 100 : null;
            g += `<text class="ax pc" x="${c1}" y="${y + 19}">${NF1.format(sh)}% ${seta(sh - sh0, ' p.p.')}</text>`;
            g += `<text class="ax pc" x="${c2}" y="${y + 19}">${vr == null ? '<tspan class="du">novo</tspan>' : seta(vr, '%', 0)}</text>`;
            g += `<text class="ax pc" x="${c3}" y="${y + 19}" text-anchor="end"><tspan style="font-weight:800">${NF0.format(acs)}%</tspan> ${seta(acs - acs0, ' p.p.')}</text>`;
        } else {
            g += `<text class="ax" x="${c1}" y="${y + 19}">${NF1.format(sh)}%</text><text class="ax" x="${c3}" y="${y + 19}" text-anchor="end" style="font-weight:700">${NF0.format(acs)}%</text>`;
        }
    });
    host.innerHTML = `<svg viewBox="0 -12 ${W} ${H + 12}" role="img" aria-label="ranking">${g}</svg>`;
    $$('.hb', host).forEach(el => { const o = items[+el.dataset.i];
        el.addEventListener('mousemove', e => showTip(`<div class="th">${esc(o.label)}</div><div class="tr"><span>Desde out/25</span><b>${fmt(o.v)}</b></div>${o.v0 != null ? `<div class="tr"><span>12 meses antes</span><b>${fmt(o.v0)}</b></div>` : ''}${o.tip || ''}`, e));
        el.addEventListener('mouseleave', hideTip); });
}

function dumbbell(host, rows, { fmt = fR, higherBetter = false, labelW = 170, keepOrder = false } = {}) {
    if (!host) return;
    rows = rows.filter(o => o.a != null || o.b != null);
    if (!keepOrder) rows = rows.slice().sort((x, y) => (x.b == null) - (y.b == null) || ((y.b ?? y.a ?? -1e18) - (x.b ?? x.a ?? -1e18)));  // maior para o menor; quem saiu vai para o fim
    if (!rows.length) { host.innerHTML = '<div class="empty">Sem dados.</div>'; return; }
    const W = Math.max(480, Math.round(host.clientWidth || 760)), rh = 44, L = labelW, R = 90, H = rows.length * rh + 22;
    const vals = rows.flatMap(o => [o.a, o.b]).filter(v => v != null);
    const lo = Math.min(...vals) * 0.85, hi = Math.max(...vals) * 1.08;
    const X = v => L + 16 + (W - L - R - 36) * ((v - lo) / (hi - lo || 1));
    let g = '';
    rows.forEach((o, i) => {
        const y = i * rh + 22;
        const melhor = o.a != null && o.b != null && (higherBetter ? o.b > o.a : o.b < o.a);
        const cor = o.b == null ? 'var(--tx3)' : (melhor ? 'var(--teal-deep)' : 'var(--navy)');
        g += `<g class="dbr" data-l="${esc(o.label)}"><rect x="0" y="${y - rh / 2}" width="${W}" height="${rh}" fill="transparent"/>`;
        g += `<text class="ax cx" x="${L - 6}" y="${y + 4}" text-anchor="end" style="font-size:12px">${esc(o.label)}</text>`;
        g += `<line class="grid" x1="${L + 10}" x2="${W - R - 10}" y1="${y}" y2="${y}"/>`;
        if (o.a != null && o.b != null) g += `<line x1="${X(o.a)}" x2="${X(o.b)}" y1="${y}" y2="${y}" style="stroke:${cor};stroke-width:5;opacity:.35;stroke-linecap:round"/>`;
        if (o.a != null) g += `<circle cx="${X(o.a)}" cy="${y}" r="6" style="fill:var(--card);stroke:var(--tx3);stroke-width:2.2"><title>antes: ${fmt(o.a)}</title></circle><text class="ax" x="${X(o.a)}" y="${y - 11}" text-anchor="middle" style="font-size:10.5px">${fmt(o.a)}</text>`;
        if (o.b != null) g += `<circle cx="${X(o.b)}" cy="${y}" r="7" style="fill:${cor}"><title>depois: ${fmt(o.b)}</title></circle><text class="vl" x="${X(o.b)}" y="${y + 21}" text-anchor="middle">${fmt(o.b)}</text>`;
        const d = o.a && o.b ? (higherBetter ? (o.b - o.a) * 100 : o.b / o.a - 1) : null;
        const txt = d == null ? (o.b == null ? 'saiu' : 'novo') : (higherBetter ? (d >= 0 ? '+' : '−') + NF0.format(Math.abs(d)) + ' p.p.' : fP(d));
        g += `<text x="${W - 8}" y="${y + 4}" text-anchor="end" style="font:800 12.5px var(--font-display);fill:${d == null ? 'var(--tx3)' : cor}">${txt}</text></g>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="antes e depois">${g}</svg>`;
}

function top10(host, w0, w1, k) {
    const D = T10_DIM.find(d => d.k === k);
    const tot = w1.reduce((s, r) => s + r.vt, 0);
    const m1 = new Map(), m0 = new Map();
    w1.forEach(r => { const kk = D.key(r); const o = m1.get(kk) || { label: D.lab(r), v: 0, h: 0, n: 0 }; o.v += r.vt; o.h += r.h; o.n++; m1.set(kk, o); });
    if (k !== 'op') w0.forEach(r => { const kk = D.key(r); m0.set(kk, (m0.get(kk) || 0) + r.vt); });
    const it = [...m1.entries()].map(([kk, o]) => ({ ...o, key: kk, v0: k === 'op' ? null : (m0.get(kk) || 0),
        tip: `<div class="tr"><span>Horas</span><b>${fH(o.h)}</b></div><div class="tr"><span>Custo/h</span><b>${fR(o.v / o.h)}</b></div>${k === 'op' ? '' : `<div class="tr"><span>Linhas</span><b>${fN(o.n)}</b></div>`}` }))
        .sort((a, b) => b.v - a.v).slice(0, 10);
    const soma = it.reduce((s, o) => s + o.v, 0);
    $('#t10-t').textContent = `10 maiores linhas de custo · por ${D.l.toLowerCase()}: ${NF0.format(soma / tot * 100)}% do gasto desde out/25`;
    hbars(host, it, { fmt: fMi, total: tot, total0: k === 'op' ? 0 : w0.reduce((s, r) => s + r.vt, 0) });
    host._items = it; host._k = k;
}

function upgradeCards() { // troca as tabelas dos cards 1, 2 e 3 (ano × ano) por gráficos
    const cur = S.cur, prv = S.cur - 1, rs = rowsF(['H']);
    const r0 = rs.filter(r => r.y === prv), r1 = rs.filter(r => r.y === cur);
    const cardOf = t => [...$$('#view .card')].find(c => ((c.querySelector('h3') || {}).textContent || '').startsWith(t));
    const swap = (c, id) => { const el = c && c.querySelector('.tw'); if (!el) return null; const d = document.createElement('div'); d.id = id; el.replaceWith(d); return d; };
    const c1 = cardOf('1 · ');
    if (c1) {
        const ags = [...new Set(r0.concat(r1).map(r => r.a))].map(a => ({ label: a, a: agg(r0.filter(r => r.a === a)).eff, b: agg(r1.filter(r => r.a === a)).eff, h: agg(r1.filter(r => r.a === a)).h }))
            .sort((x, y) => (y.h || 0) - (x.h || 0));
        dumbbell(swap(c1, 'd1'), ags, { fmt: fR });
        const ambos = ags.filter(o => o.a && o.b), caiu = ambos.filter(o => o.b < o.a), top2 = caiu.slice(0, 2);
        c1.querySelector('h3').textContent = `1 · Renegociação: custo por hora caiu em ${caiu.length} de ${ambos.length} fornecedores`;
        c1.querySelector('.card-head p').innerHTML = `${top2.map(o => `<b>${esc(o.label)} ${fP(o.b / o.a - 1)}</b>`).join(' · ')} · ○ ${prv} → ● ${cur}, mesmo período`;
    }
    const c2 = cardOf('2 · ');
    if (c2) {
        dumbbell(swap(c2, 'd2'), TIER_ORDER.map(t => ({ label: TIER_LABEL[t], a: agg(r0.filter(r => r.tier === t)).eff, b: agg(r1.filter(r => r.tier === t)).eff })), { fmt: fR });
        const sh = (w, t) => { const T = w.reduce((s, r) => s + r.h, 0); return T ? w.filter(r => r.tier === t).reduce((s, r) => s + r.h, 0) / T : null; };
        c2.querySelector('h3').textContent = `2 · Porte certo: rebocador pequeno foi de ${pp(sh(r0, 'Pequeno'))} para ${pp(sh(r1, 'Pequeno'))} das horas`;
    }
    const c3 = cardOf('3 · ');
    if (c3) {
        const A0 = atend(r0), A1 = atend(r1);
        const d = swap(c3, 'd3');
        c3.querySelector('h3').textContent = `3 · Planejamento: ${pp(A1.fp)} das manobras no fundeio dentro da meta (eram ${pp(A0.fp)})`;
        // mesmo padrão dos rankings: barra cheia = ano atual, barra clara = ano anterior
        const dpp = (a, b) => a == null || b == null ? '' : ` (${a - b >= 0 ? '+' : '−'}${NF0.format(Math.abs(a - b) * 100)} p.p.)`;
        hbars(d, [{ label: 'Fundeio · meta 5 h', v: A1.fp || 0, v0: A0.fp, color: 'var(--teal-deep)' }, { label: 'Porto · meta 3 h', v: A1.pp || 0, v0: A0.pp, color: 'var(--navy)' }].sort((a, b) => b.v - a.v),
            { fmt: v => pp(v), noPareto: true, keepOrder: true });
        if (d) d.insertAdjacentHTML('afterend', `<div class="iab-leg"><span><i style="background:var(--teal-deep)"></i>${cur}</span><span><i style="background:var(--bd2)"></i>${prv}</span><span class="mu">% das manobras dentro da meta</span></div>
          <div class="chips-k"><span>Fundeio <b>${pp(A0.fp)} → ${pp(A1.fp)}${dpp(A1.fp, A0.fp)}</b></span><span>Porto <b>${pp(A0.pp)} → ${pp(A1.pp)}${dpp(A1.pp, A0.pp)}</b></span><span>Custo das horas além da meta em ${cur} <b>${fMi(A1.exC)}</b></span></div>`);
    }
}

/* Evolução mês a mês, versão limpa: uma mensagem (custo por hora), média de antes × programa,
   poucos rótulos (primeiro, maior, menor, último) e o gasto como barras discretas na base. */
function timeline(host, pts, iniIdx) {
    if (!host) return;
    if (!pts.length) { host.innerHTML = '<div class="empty">Sem dados para o filtro selecionado.</div>'; return; }
    const W = 1100, H = 330, m = { l: 20, r: 20, t: 46, b: 40 }, iw = W - m.l - m.r;
    const hL = 170, yL0 = m.t + 22, baseB = H - m.b, hB = 46;               // área da linha | faixa do gasto
    const ev = pts.filter(p => p.eff != null).map(p => p.eff);
    const lo = Math.min(...ev) * 0.9, hi = Math.max(...ev) * 1.06;
    const bw = iw / pts.length, X = i => m.l + bw * i + bw / 2, Y = v => yL0 + hL * (1 - (v - lo) / (hi - lo || 1));
    const cMax = Math.max(...pts.map(p => p.c || 0)) || 1, Yb = v => baseB - (v / cMax) * hB;
    const media = arr => { const h = arr.reduce((s, p) => s + (p.h || 0), 0); return h ? arr.reduce((s, p) => s + (p.c || 0), 0) / h : null; };
    const ini = iniIdx >= 0 ? iniIdx : pts.length;
    const antes = pts.slice(Math.max(0, ini - 12), ini), depois = pts.slice(ini);
    const m0 = media(antes), m1 = media(depois);
    let g = '';
    // período desde out/25 (o marco que o Romulo aprovou)
    if (iniIdx >= 0) {
        const x0 = m.l + bw * iniIdx;
        g += `<rect x="${x0}" y="${m.t - 30}" width="${W - m.r - x0}" height="${H - m.t - m.b + 34}" style="fill:var(--teal-wash)" opacity=".75"/>`;
        g += `<line x1="${x0}" x2="${x0}" y1="${m.t - 30}" y2="${baseB}" style="stroke:var(--teal-deep);stroke-width:1.5;stroke-dasharray:4 3"/>`;
        g += `<text x="${x0 + 8}" y="${m.t - 14}" style="font:700 12px var(--font-display);fill:var(--teal-deep)">Reorganização dos controles · ${GESTAO_LBL}</text>`;
    }
    // gasto do mês: barras discretas na base
    pts.forEach((p, i) => { const y = Yb(p.c || 0); g += `<rect x="${X(i) - bw * .28}" y="${y}" width="${bw * .56}" height="${baseB - y}" rx="2" style="fill:var(--y-old);opacity:${i >= ini ? .55 : .35}"/>`; });
    g += `<text class="axt" x="${m.l}" y="${baseB - hB - 8}">GASTO DO MÊS</text>`;
    // médias de cada período (tracejado)
    const linhaMedia = (arr, i0, v, lab, cor) => { if (v == null || !arr.length) return; const x1 = m.l + bw * i0, x2 = m.l + bw * (i0 + arr.length); const y = Y(v);
        g += `<line x1="${x1 + 4}" x2="${x2 - 4}" y1="${y}" y2="${y}" style="stroke:${cor};stroke-width:1.6;stroke-dasharray:6 4;opacity:.9"/>`;
        return y; };
    const yA = linhaMedia(antes, Math.max(0, ini - 12), m0, 'antes', 'var(--tx3)');
    const yD = linhaMedia(depois, ini, m1, 'desde out/25', 'var(--teal-deep)');
    // linha do custo por hora (suave), cinza antes e Tiffany no programa
    const P = pts.map((p, i) => p.eff != null ? [X(i), Y(p.eff)] : null);
    const seg = (a, b) => P.slice(a, b).filter(Boolean);
    const sA = seg(0, ini + 1), sD = seg(ini, pts.length);
    if (sA.length > 1) g += `<path d="${suave(sA)}" style="fill:none;stroke:var(--y-mid);stroke-width:2.6;opacity:.75"/>`;
    if (sD.length > 1) g += `<path d="${suave(sD)}" style="fill:none;stroke:var(--teal-deep);stroke-width:3.2"/>`;
    // rótulos só nos pontos-chave
    const idx = pts.map((p, i) => p.eff != null ? i : -1).filter(i => i >= 0);
    const iMax = idx.reduce((a, b) => pts[b].eff > pts[a].eff ? b : a, idx[0]), iMin = idx.reduce((a, b) => pts[b].eff < pts[a].eff ? b : a, idx[0]);
    const chave = new Set([idx[0], iMax, iMin, idx[idx.length - 1]]);
    idx.forEach(i => { const p = pts[i], k = chave.has(i); const cor = i >= ini ? 'var(--teal-deep)' : 'var(--y-mid)';
        g += `<circle cx="${X(i)}" cy="${Y(p.eff)}" r="${k ? 4.5 : 2.6}" style="fill:${k ? cor : 'var(--card)'};stroke:${cor};stroke-width:1.6"/>`;
        if (k) g += `<text class="dlab" x="${X(i)}" y="${i === iMin ? Y(p.eff) + 18 : Y(p.eff) - 10}" text-anchor="middle" style="font-weight:700;fill:var(--tx2)">${fR(p.eff)}</text>`; });
    // médias na faixa de legenda do topo de cada período (tracejado + valor), sem cobrir a linha
    const leg = (x, y, txt, cor, peso) => `<line x1="${x}" x2="${x + 22}" y1="${y - 4}" y2="${y - 4}" style="stroke:${cor};stroke-width:2;stroke-dasharray:6 4"/><text x="${x + 30}" y="${y}" style="font:${peso} 12.5px var(--font-display);fill:${cor}">${txt}</text>`;
    if (yA != null) g += leg(m.l + bw * Math.max(0, ini - 12) + 8, m.t - 14, `Média antes: ${fR(m0)}/h`, 'var(--tx2)', 700);
    if (yD != null) g += leg(m.l + bw * ini + 10, m.t + 6, `Média desde out/25: ${fR(m1)}/h (${fP(m1 / m0 - 1)})`, 'var(--teal-deep)', 800);
    // eixo de meses
    pts.forEach((p, i) => {
        g += `<text class="ax" x="${X(i)}" y="${H - 22}" text-anchor="middle">${MES[p.m - 1].slice(0, 1).toUpperCase()}</text>`;
        if (p.m === 1 || i === 0) g += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle" style="font-weight:800">${p.y}</text>`;
        g += `<rect class="hit" data-i="${i}" x="${m.l + bw * i}" y="${m.t - 30}" width="${bw}" height="${H - m.t}" fill="transparent"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Custo por hora mês a mês, com a média antes e desde out/25">${g}</svg>`;
    $$('.hit', host).forEach(el => { const p = pts[+el.dataset.i];
        el.addEventListener('mousemove', e => showTip(`<div class="th">${MES[p.m - 1]}/${String(p.y).slice(2)}</div><div class="tr"><span>Custo médio</span><b>${fR(p.eff)}/h</b></div><div class="tr"><span>Gasto</span><b>${fMi(p.c)}</b></div><div class="tr"><span>Horas</span><b>${fH(p.h)}</b></div><div class="tr mu">${fMi(p.c)} ÷ ${fH(p.h)} = ${fR(p.eff)}/h</div>`, e));
        el.addEventListener('mouseleave', hideTip); });
    // título com a conclusão
    const card = host.closest('.card');
    if (card && m0 && m1) {
        const h3 = card.querySelector('h3'), p = card.querySelector('.card-head p');
        if (h3) h3.firstChild.textContent = `Custo por hora: de ${fR(m0)} para ${fR(m1)} em média (${fP(m1 / m0 - 1)})`;
        if (p) p.innerHTML = 'Custo médio por hora de cada mês · barras claras: gasto do mês';
    }
}

/* ===================== v2: topo enxuto — um só bloco de resultado (sem repetir mensagens e indicadores) ===================== */
function tirarDestaques() {
    const c = [...$$('#view .card')].find(x => ((x.querySelector('h3') || {}).textContent || '').startsWith('Destaques para a diretoria'));

}
function enxugarTopo() {
    const k = $('#view .kgrid.ctxk'); if (k) k.remove();                       // indicadores repetidos
    const hero = $('.gestao-hero'); if (!hero || hero.dataset.enx) return; hero.dataset.enx = '1';

    const L = alavancas(rs, prv, cur); if (!L) return;
    const dH = dlt(L.t1.h, L.t0.h), dC = dlt(L.t1.c, L.t0.c);

    if (grid) grid.insertAdjacentHTML('afterend', `<div class="gh-met"><b>Metodologia</b> ${cur} × ${prv} no mesmo período. A economia é quanto as horas de ${cur} custariam ao preço médio de ${prv}, menos o que foi pago — dividida em <b>renegociação</b> (mesmo porte, preço menor) e <b>porte certo</b> (rebocador menor em manobras simples). Diárias e afretamentos ficam fora.</div>`);
}
const _gestaoV2 = V.gestao;

/* "Total pago segundo a planilha" (vinha da aba Resumo, que saiu) no fim da 1ª aba */

/* ===== Panorama do ano: total acumulado, evolução mensal e fornecedores (por mês e por ano) =====
   Segue o padrão analítico do painel: sem grade nem eixo Y, curvas suaves (cúbica monotônica), rótulos só nos pontos-chave,
   período anterior em barra clara ao fundo, categorias do maior para o menor, nomes em negrito, largura real do quadro. */
V.pano = function () {
    const rs = rowsF(['H', 'D', 'A', 'S']);
    const cur = S.cur, prv = S.cur - 1, mx = S.cut.m;
    const anos = S.years.filter(y => rs.some(r => r.y === y));
    const fK = v => v ? NF0.format(Math.round(v / 1000)) : '–';
    const add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
    const host = document.querySelector('#view');
    const VW = Math.max(520, Math.min(1100, Math.round(((host && host.clientWidth) || 900) - 56)));
    const mlab = m => VW < 640 ? MES[m - 1].charAt(0).toUpperCase() : MES[m - 1];

    /* fornecedores: os 5 maiores do ano atual e "Demais" */
    const tA = {};
    rs.forEach(r => add(tA, r.a, (r.y === cur ? 2 : 1) * (r.vt || 0) * (r.y >= prv ? 1 : 0)));
    const nomes = Object.keys(tA).sort((a, b) => tA[b] - tA[a]);
    const top = nomes.slice(0, 5), DEM = 'Demais fornecedores';
    const grp = a => top.includes(a) ? a : DEM;
    const forn = nomes.length > 5 ? [...top, DEM] : top;
    const tm = {}, fm = {}, fy = {};
    rs.forEach(r => { const v = r.vt || 0, g = grp(r.a); add(tm, r.y + '|' + r.m, v); add(fm, g + '|' + r.y + '|' + r.m, v); add(fy, g + '|' + r.y, v); });
    forn.sort((a, b) => ((fy[b + '|' + cur] || 0) - (fy[a + '|' + cur] || 0)) || ((fy[b + '|' + prv] || 0) - (fy[a + '|' + prv] || 0)));
    if (forn.includes(DEM) && !fy[DEM + '|' + cur] && !fy[DEM + '|' + prv]) forn.splice(forn.indexOf(DEM), 1);
    if (forn.includes(DEM)) { forn.splice(forn.indexOf(DEM), 1); forn.push(DEM); }
    const cor = i => forn[i] === DEM ? 'var(--c-other)' : 'var(--c' + (i + 1) + ')';
    const tY = y => anos.includes(y) ? Array.from({ length: 12 }, (_, i) => tm[y + '|' + (i + 1)] || 0).reduce((s, v) => s + v, 0) : 0;
    const tCur = tY(cur), tPrv = tY(prv);
    const meses = Array.from({ length: 12 }, (_, i) => i + 1);
    const mCur = meses.map(m => tm[cur + '|' + m] || 0);
    const iMax = mCur.indexOf(Math.max(...mCur));
    const H = agg(rowsF(['H']).filter(r => r.y === cur)), Hp = agg(rowsF(['H']).filter(r => r.y === prv));
    const nMes = Math.max(1, mx);
    const lastP = meses.filter(m => (tm[prv + '|' + m] || 0) > 0).pop() || 0;
    /* custo caiu = bom (Tiffany ▼); subiu = atenção (marinho ▲) */
    const chip = d => d == null ? '' : `<span class="pn-d ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${NF1.format(Math.abs(d) * 100)}%</span>`;

    /* 1) total acumulado, ano atual × anterior */
    const acum = y => { let s = 0; return meses.map(m => (s += tm[y + '|' + m] || 0)); };
    const aC = acum(cur), aP = acum(prv);
    const Hh = 280, mg = { l: 14, r: 120, t: 40, b: 28 }, iw = VW - mg.l - mg.r, ih = Hh - mg.t - mg.b;
    const ymax = Math.max(aC[mx - 1] || 0, aP[Math.max(lastP, 1) - 1] || 0, 1) * 1.04;
    const X = m => mg.l + (m - 1) / 11 * iw, Y = v => mg.t + ih - v / ymax * ih;
    const pts = (a, ate) => a.slice(0, ate).map((v, i) => [+X(i + 1).toFixed(1), +Y(v).toFixed(1)]);
    const dAc = dlt(aC[mx - 1], aP[Math.max(mx, 1) - 1] || null);
    const gap = aC[mx - 1] - (aP[Math.max(mx, 1) - 1] || 0);
    let svgA = `<svg viewBox="0 0 ${VW} ${Hh}" width="100%" class="pn-svg" role="img" aria-label="Gasto acumulado no ano">`;
    meses.forEach(m => { svgA += `<text x="${X(m)}" y="${Hh - 8}" text-anchor="middle" class="pn-ax ${m <= mx ? 'pn-b' : ''}">${mlab(m)}</text>`; });
    if (lastP) svgA += `<path d="${suave(pts(aP, lastP))}" fill="none" stroke="var(--c4)" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round"/>`;
    const pc = pts(aC, mx);
    svgA += `<path d="${suave(pc)} L${X(mx)} ${Y(0)} L${X(1)} ${Y(0)}Z" fill="var(--teal)" opacity=".14"/><path d="${suave(pc)}" fill="none" stroke="var(--teal-deep)" stroke-width="3.6" stroke-linecap="round"/>`;
    /* rótulos só nos pontos-chave: último ponto de cada ano e o mês de maior gasto */
    svgA += `<circle cx="${X(mx)}" cy="${Y(aC[mx - 1])}" r="5" fill="var(--teal-deep)"><title>${MES[mx - 1]}/${cur}: ${fR(aC[mx - 1])} acumulado</title></circle>`;
    svgA += `<text x="${X(mx) + 12}" y="${Y(aC[mx - 1]) + 1}" class="pn-ax pn-b pn-t">${fMi(aC[mx - 1])}</text><text x="${X(mx) + 12}" y="${Y(aC[mx - 1]) + 15}" class="pn-ax">${cur}</text>`;
    if (lastP) {
        const yp = Y(aP[lastP - 1]), yc = Y(aC[mx - 1]), yl = Math.max(yp + 4, yc + 38);
        svgA += `<circle cx="${X(lastP)}" cy="${yp}" r="4" fill="var(--c4)"/><text x="${X(lastP) + 12}" y="${yl}" class="pn-ax pn-b">${fMi(aP[lastP - 1])}</text><text x="${X(lastP) + 12}" y="${yl + 14}" class="pn-ax">${prv}</text>`;
    }
    if (mCur[iMax] && iMax + 1 <= mx) {
        const xm = X(iMax + 1), ym = Y(aC[iMax]);
        svgA += `<circle cx="${xm}" cy="${ym}" r="4.5" fill="var(--navy)"/><text x="${xm}" y="${ym - 12}" text-anchor="middle" class="pn-ax pn-b">${MES[iMax]}: +${fMi(mCur[iMax])} no mês</text>`;
    }
    svgA += '</svg>';
    const pillGap = dAc != null ? `<span class="pn-pill ${gap > 0 ? 'up' : 'dn'}">${gap > 0 ? '▲' : '▼'} ${fMi(Math.abs(gap))} (${NF1.format(Math.abs(dAc) * 100)}%) ${gap > 0 ? 'acima' : 'abaixo'} de ${prv} no mesmo ponto</span>` : '';

    /* 2) evolução mensal: barras empilhadas por fornecedor; barra clara ao fundo = mesmo mês do ano anterior */
    const vmax = Math.max(...mCur, ...meses.map(m => tm[prv + '|' + m] || 0), 1) * 1.14;
    const area = Hh - 36 - 52, bw = (VW - 24) / 12, Yb = v => 36 + area - v / vmax * area, base0 = Yb(0);
    let svgM = `<svg viewBox="0 0 ${VW} ${Hh}" width="100%" class="pn-svg" role="img" aria-label="Gasto por mês">`;
    meses.forEach(m => {
        const cx = 12 + (m - 1) * bw + bw / 2, wP = bw * .8, wC = bw * .52;
        const p = tm[prv + '|' + m] || 0, c = mCur[m - 1];
        if (p) svgM += `<rect x="${(cx - wP / 2).toFixed(1)}" y="${Yb(p).toFixed(1)}" width="${wP.toFixed(1)}" height="${(base0 - Yb(p)).toFixed(1)}" rx="3" fill="var(--bd)" opacity=".85"><title>${MES[m - 1]}/${prv}: ${fR(p)}</title></rect>`;
        let acc = 0;
        forn.forEach((f, i) => { const v = fm[f + '|' + cur + '|' + m] || 0; if (!v) return; svgM += `<rect x="${(cx - wC / 2).toFixed(1)}" y="${Yb(acc + v).toFixed(1)}" width="${wC.toFixed(1)}" height="${Math.max(.6, base0 - Yb(v)).toFixed(1)}" fill="${cor(i)}"><title>${f} · ${MES[m - 1]}/${cur}: ${fR(v)} (${NF0.format(v / c * 100)}% do mês)</title></rect>`; acc += v; });
        if (c) {
            svgM += `<text x="${cx}" y="${Yb(Math.max(c, p)) - 7}" text-anchor="middle" class="pn-ax pn-b ${m - 1 === iMax ? 'pn-t' : ''}">${fK(c)}</text>`;
            if (p) { const d = dlt(c, p); svgM += `<text x="${cx}" y="${Hh - 22}" text-anchor="middle" class="pn-v ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}${NF0.format(Math.abs(d) * 100)}%</text>`; }
        }
        svgM += `<text x="${cx}" y="${Hh - 6}" text-anchor="middle" class="pn-ax ${m <= mx ? 'pn-b' : ''}">${mlab(m)}</text>`;
    });
    svgM += '</svg>';
    const leg = `<div class="pn-leg">${forn.map((f, i) => `<span><i style="background:${cor(i)}"></i><b>${esc(f)}</b></span>`).join('')}<span><i style="background:var(--bd)"></i>mesmo mês de ${prv}</span></div>`;

    /* 3) fornecedor × mês: mapa de calor, ordenado do maior para o menor */
    const cols = meses.filter(m => m <= mx);
    const vmaxCell = Math.max(1, ...forn.flatMap(f => cols.map(m => fm[f + '|' + cur + '|' + m] || 0)));
    const gt = `grid-template-columns:minmax(${VW < 640 ? 96 : 130}px,1.5fr) repeat(${cols.length},minmax(40px,1fr)) minmax(64px,.9fr)`;
    let heat = `<div class="pn-heat" style="${gt}"><div class="pn-h"></div>${cols.map(m => `<div class="pn-h">${mlab(m)}</div>`).join('')}<div class="pn-h pn-tt">${cur}</div>`;
    forn.forEach((f, i) => {
        heat += `<div class="pn-fn"><i style="background:${cor(i)}"></i>${esc(f)}</div>`;
        cols.forEach(m => { const v = fm[f + '|' + cur + '|' + m] || 0, t = v / vmaxCell; heat += `<div class="pn-c" style="background:rgba(4,140,128,${v ? (.07 + .78 * t).toFixed(2) : 0});color:${t > .5 ? '#fff' : 'inherit'};font-weight:${t > .5 ? 800 : 500}" title="${esc(f)} · ${MES[m - 1]}/${cur}: ${fR(v)}">${fK(v)}</div>`; });
        heat += `<div class="pn-c pn-tt">${fK(fy[f + '|' + cur])}</div>`;
    });
    heat += `<div class="pn-fn pn-tot">Total</div>${cols.map(m => `<div class="pn-c pn-tot">${fK(tm[cur + '|' + m])}</div>`).join('')}<div class="pn-c pn-tot pn-tt">${fK(tCur)}</div></div>`;

    /* 4) fornecedor × ano: barras por ano (mesmo período), maior para o menor */
    const ymaxF = Math.max(1, ...forn.flatMap(f => anos.map(y => fy[f + '|' + y] || 0)));
    const cy = y => y === cur ? 'var(--teal-deep)' : (y === prv ? '#8FA7B0' : '#C9D3D6');
    let anual = `<div class="pn-leg">${anos.map(y => `<span><i style="background:${cy(y)}"></i><b>${y}</b></span>`).join('')}</div><div class="pn-ann">`;
    forn.forEach((f, i) => {

    const kp = (l, v, s) => `<div class="pn-k"><div class="pn-kl">${l}</div><div class="pn-kv">${v}</div><div class="pn-ks">${s}</div></div>`;
    const per = S.f.per === 'ytd' ? `jan–${MES[mx - 1]}` : 'ano';
    const lider = forn[0], shL = tCur ? (fy[lider + '|' + cur] || 0) / tCur : 0;
    const html = `<div class="pn-kpis">
      ${kp(`Total pago em ${cur}`, fMi(tCur), `${per} · ${chip(dlt(tCur, tPrv)) || '—'} vs ${prv}`)}
      ${kp('Média por mês', fMi(tCur / nMes), `${nMes} ${nMes === 1 ? 'mês' : 'meses'} com dados`)}
      ${kp('Mês de maior gasto', mCur[iMax] ? MES[iMax].toUpperCase() : '—', mCur[iMax] ? fMi(mCur[iMax]) : '')}
      ${kp('Custo por hora (serviço)', fR(H.eff), `${fH(H.h)} · ${chip(dlt(H.eff, Hp.eff)) || '—'} vs ${prv}`)}
    </div>
    ${card(`Total acumulado: <b>${fMi(aC[mx - 1])}</b> em ${cur}`, `${cur} × ${prv}, gasto somado mês a mês`, `${pillGap}${svgA}`)}
    ${card(`Evolução mensal: pico de <b>${fMi(mCur[iMax])}</b> em ${MES[iMax]}`, `R$ mil por mês e fornecedor · variação sobre o mesmo mês de ${prv}`, leg + svgM)}
    ${card(`${esc(lider)} concentra <b>${NF0.format(shL * 100)}%</b> do gasto de ${cur}`, `R$ mil por fornecedor e mês · mais escuro = maior valor`, heat)}
    ${card('Fornecedores ano a ano: quem subiu e quem caiu', `Mesmo período de cada ano (${per}) · participação e variação sobre ${prv}`, anual)}`;
    return { html, after() { } };
};

/* logo na versão "Colorida Negativa" do manual (sobre fundo marinho): partes escuras viram branco, Tiffany fica */
function logoNegativo(img) {
    const run = () => {
        if (img.dataset.neg) return;
        try {
            const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
            const x = c.getContext('2d'); x.drawImage(img, 0, 0);
            const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
            for (let i = 0; i < p.length; i += 4) {
                const r = p[i], g = p[i + 1], b = p[i + 2], a = p[i + 3];
                if (!a) continue;
                if (g > 110 && g - r > 55) continue;                       // Tiffany: mantém
                const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
                if (lum > 0.92) { p[i + 3] = 0; continue; }               // fundo branco: transparente
                p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(a * Math.min(1, (1 - lum) * 1.2));
            }
            x.putImageData(d, 0, 0);
            img.dataset.neg = '1';
            img.src = c.toDataURL('image/png');
        } catch (e) {}
    };
    if (img.complete && img.naturalWidth) run(); else img.addEventListener('load', run, { once: true });
}

const dx = (o, c) => `<div class="dx"><div><b>O que mostra</b><p>${o}</p></div><div><b>Como calculamos</b><p>${c}</p></div></div>`;
const kp = arr => `<div class="dk">${arr.map(([l, v, s]) => `<div><span>${l}</span><b>${v}</b>${s ? `<em>${s}</em>` : ''}</div>`).join('')}</div>`;
const ops = (rs, n = 8) => `<div class="dops">${rs.slice().sort((a, b) => b.vt - a.vt).slice(0, n).map(r => `<div><span>${r.d.split('-').reverse().slice(0, 2).join('/')} · <b>${esc(r.eN)}</b> <em>${esc(r.a)}</em><br><small>${esc(r.od || r.l)}${r.cl ? ' · ' + esc(r.cl) : ''} · ${NF1.format(r.h)} h a ${fR(r.vh)}/h</small></span><strong>${fMi(r.vt)}</strong></div>`).join('')}</div>`;
const agrupa = (rs, fn) => { const m = new Map(); rs.forEach(r => { const k = fn(r); m.set(k, (m.get(k) || 0) + r.vt); }); return [...m.entries()].map(([label, v]) => ({ label, v })).sort((a, b) => b.v - a.v); };

function drawerItem(dimK, key, label) {

    const r1 = G.w1.filter(r => D.key(r) === key), r0 = G.w0.filter(r => D.key(r) === key);
    const a1 = agg(r1), a0 = agg(r0);
    const tot = G.w1.reduce((s, r) => s + r.vt, 0);
    const outraDim = dimK === 'e' ? 'l' : 'e';
    const O = T10_DIM.find(d => d.k === outraDim);
    openDrawer(`${D.l}: ${label}`, dx(`Tudo o que foi pago em "${esc(label)}" desde ${mLbl(GESTAO_INI)}, comparado aos 12 meses anteriores.`, `Soma de VALOR/TOTAL das linhas da aba DADOS (serviço por hora) com este ${D.l.toLowerCase()}. Custo/h = gasto ÷ horas.`) +
        kp([['Gasto desde out/25', fMi(a1.c), pp(a1.c / tot) + ' do total'], ['12 meses antes', fMi(a0.c), a0.c ? fP(a1.c / a0.c - 1) : 'sem uso antes'], ['Horas', fH(a1.h), fN(r1.length) + ' linhas'], ['Custo médio', fR(a1.eff) + '/h', a0.eff ? 'antes ' + fR(a0.eff) + '/h' : '']]) +
        `<h4>Gasto por mês</h4><div id="dm"></div><h4>Por ${O.l.toLowerCase()}</h4><div id="do"></div><h4>Maiores operações</h4>${ops(r1)}`,

            hbars($('#do', body), agrupa(r1, O.key).slice(0, 8), { fmt: fMi, noPareto: true });

function drawerMarco(i) {

        openDrawer('Maior renegociação: ' + a, dx(`A tarifa contratada (VALOR/HR) do fornecedor ${esc(a)} antes e desde out/25, por rebocador.`, 'Mediana da coluna VALOR/HR das linhas de cada período. A mediana ignora valores atípicos (diárias, mobilização).') +
            kp([['Tarifa antes', fR(G.reneg.v0) + '/h', ''], ['Tarifa desde out/25', fR(G.reneg.v1) + '/h', fP(G.reneg.v1 / G.reneg.v0 - 1)], ['Horas desde out/25', fH(agg(V1).h), pp(G.F.find(o => o.a === a)?.s1) + ' do gasto']]) + '<h4>Tarifa por rebocador · ○ antes → ● período atual</h4><div id="dr"></div>',
