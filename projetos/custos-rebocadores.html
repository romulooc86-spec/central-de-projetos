/* ===================== v2: padrão analítico para todas as abas =====================
   - tabelas: ranking do maior para o menor, barra de dados em todas as colunas numéricas,
     variação colorida (▼ Tiffany = melhor, ▲ marinho = atenção) e maior valor em negrito;
   - barras empilhadas: percentual em todos os segmentos (os pequenos ficam fora da barra);
   - linhas: curvas suavizadas e rótulos discretos;
   - roda sozinho sempre que a tela muda (abas, alternância tabela/mapa e painel de detalhe). */

function numBR(s) {
    const m = /([−-])?\s*R?\$?\s*([\d.]+(?:,\d+)?)\s*(mi\b|mil\b)?/.exec(String(s).replace(/ /g, ' '));
    if (!m) return null;
    let v = parseFloat(m[2].replace(/\./g, '').replace(',', '.'));
    if (!isFinite(v)) return null;
    if (m[3] === 'mi') v *= 1e6; else if (m[3] === 'mil') v *= 1e3;
    return m[1] ? -v : v;
}
const isVar = (th, td) => /^var/i.test(th || '') || /[▲▼]|p\.p\./.test(td.textContent);

function analiticoTabela(t) {
    if (t.dataset.an || t.classList.contains('hm')) return;
    t.dataset.an = '1';
    const ths = [...t.querySelectorAll('thead th')].map(x => x.textContent.trim());
    const tb = t.tBodies[0]; if (!tb) return;
    const rows = [...tb.rows].filter(r => !r.classList.contains('tot'));
    if (!rows.length) return;
    const metricas = !ths[0] || /^ano$/i.test(ths[0]);          // linhas = indicadores, colunas = anos
    const entidade = !metricas && ths[0] && !/^data$/i.test(ths[0]) && rows.length >= 2;
    const temCel = td => td && td.classList.contains('n') && !td.classList.contains('bcell');
    let ci = -1;
    // 1) ranking do maior para o menor
    if (entidade) {
        const cur = String(S.cur);
        ci = ths.findIndex(h => h === cur);
        if (ci < 0) ci = ths.findIndex(h => /R\$\/h/.test(h) && h.endsWith(cur));
        if (ci < 0) ci = ths.findIndex(h => /^gasto$/i.test(h) || /^economia$/i.test(h) || /^valor$/i.test(h));
        if (ci > 0) {
            rows.sort((a, b) => (numBR(b.cells[ci]?.textContent) ?? -1e18) - (numBR(a.cells[ci]?.textContent) ?? -1e18));
            const tot = [...tb.rows].filter(r => r.classList.contains('tot'));
            rows.concat(tot).forEach(r => tb.appendChild(r));
            const th = t.querySelectorAll('thead th')[ci]; if (th && !th.querySelector('.srt')) th.insertAdjacentHTML('beforeend', ' <span class="srt" title="ordenado do maior para o menor">▼</span>');
        }
        rows.forEach((r, i) => { const c = r.cells[0]; if (c && !c.querySelector('.rk')) c.insertAdjacentHTML('afterbegin', `<span class="rk">${i + 1}</span>`); });
    }
    // 2) visual limpo: uma barra só (coluna do ranking), variação colorida e maior valor em negrito
    const ncol = Math.max(...rows.map(r => r.cells.length));
    for (let c = 1; c < ncol; c++) {
        const cs = rows.map(r => r.cells[c]).filter(temCel);
        if (!cs.length) continue;
        if (cs.some(td => isVar(ths[c], td))) {
            cs.forEach(td => { const t2 = td.textContent; td.classList.add('dv', /▼|−/.test(t2) ? 'dv-g' : (/▲|\+/.test(t2) ? 'dv-b' : 'dv-n')); });
            continue;
        }
        const vs = cs.map(td => numBR(td.textContent)); const mx = Math.max(...vs.filter(v => v != null).map(Math.abs));
        if (c === ci && mx > 0) cs.forEach((td, i) => { if (vs[i] == null) return; td.classList.add('ibc'); td.insertAdjacentHTML('afterbegin', `<span class="ib"><i style="width:${Math.max(2, Math.abs(vs[i]) / mx * 100).toFixed(1)}%"></i></span>`); });
        else if (!metricas && cs.length > 2) cs.forEach((td, i) => { if (vs[i] != null && Math.abs(vs[i]) === mx) td.classList.add('dmax'); });
    }
}

/* barras empilhadas com percentual em todos os segmentos */
function stackBar(items, { fmt, min = 7 }) {
    const tot = items.reduce((a, b) => a + b.v, 0) || 1;
    const it = items.filter(i => i.v > 0).sort((a, b) => b.v - a.v);
    const lab = pc => (pc >= 10 ? NF0 : NF1).format(pc) + '%';
    const peq = it.filter(i => i.v / tot * 100 < min);
    return `<div class="stkw"><div class="stack">${it.map(i => { const pc = i.v / tot * 100;
        return `<div class="seg ${pc < min ? 'sm' : ''}" style="width:${pc}%;background:${i.color};color:${i.tc || '#fff'}" data-tip="${esc(i.name)}|${esc(fmt(i.v))}|${NF1.format(pc)}%">${pc >= min ? `<span>${lab(pc)}</span>` : ''}</div>`; }).join('')}</div>` +
        (peq.length ? `<div class="stk-sm">${peq.map(i => `<span><i style="background:${i.color}"></i>${esc(i.name)} <b>${lab(i.v / tot * 100)}</b></span>`).join('')}</div>` : '') + `</div>`;
}

/* linhas suaves SEM passar do ponto (cúbica monotônica, Fritsch–Carlson):
   a curva nunca cria picos ou vales que não existem nos dados */
function suave(pts) {
    const n = pts.length;
    if (n < 3) return 'M' + pts.map(p => p.join(',')).join('L');
    const dx = [], dy = [], m = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = (pts[i + 1][1] - pts[i][1]) / (dx[i] || 1); }
    m[0] = dy[0]; m[n - 1] = dy[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = dy[i - 1] * dy[i] <= 0 ? 0 : (dy[i - 1] + dy[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
        if (dy[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
        const a = m[i] / dy[i], b = m[i + 1] / dy[i], s = a * a + b * b;
        if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * dy[i]; m[i + 1] = t * b * dy[i]; }
    }
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < n - 1; i++) {
        const h = dx[i] / 3;
        d += `C${pts[i][0] + h},${pts[i][1] + m[i] * h} ${pts[i + 1][0] - h},${pts[i + 1][1] - m[i + 1] * h} ${pts[i + 1][0]},${pts[i + 1][1]}`;
    }
    return d;
}
function suavizarLinhas(root) {

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', suave(pts)); path.setAttribute('class', 'ln'); path.setAttribute('style', pl.getAttribute('style') || '');
        pl.replaceWith(path);
    });
}
/* tira os números do eixo Y (sem grade eles ficam soltos e com valores quebrados); os rótulos de dados cumprem esse papel */
/* rótulos do eixo X: abrevia para a inicial quando não cabem */
function eixoXcompacto(svg) { const ts = $$('text.ax[text-anchor="middle"]', svg); if (ts.length < 6) return; const ymax = Math.max(...ts.map(t => +t.getAttribute('y'))); const xs = ts.filter(t => +t.getAttribute('y') === ymax); if (xs.length < 2) return; const passo = Math.abs(+xs[1].getAttribute('x') - +xs[0].getAttribute('x')); const larg = svg.viewBox.baseVal.width || 760, tela = svg.getBoundingClientRect().width || larg; if (passo * tela / larg < 34) xs.forEach(t => { const s = t.textContent.trim(); if (s.length > 1 && MES.includes(s.toLowerCase().slice(0, 3))) { t.textContent = s[0].toUpperCase(); } }); }

/* barras agrupadas: rótulo em todas as barras e sem números soltos no eixo Y */
const _groupedBarsBase = groupedBars;
/* barras agrupadas: categorias (fornecedor, porte…) viram barras HORIZONTAIS — uma linha por categoria,
   uma barra por série, valor no fim de cada barra: nenhum rótulo fica em cima do outro.
   Categorias de tempo (anos/meses) continuam verticais. Sempre do maior para o menor. */
groupedBars = function(host, o) {
    let cats = o.cats;
    const tempo = cats.every(c => /^[0-9]{4}$/.test(String(c)) || MES.includes(String(c).toLowerCase().slice(0, 3)));
    if (tempo || !o.series.length) { const r = _groupedBarsBase(host, { ...o, label: 'all' }); const svg = $('svg', host); if (svg) { semEixoY(svg); requestAnimationFrame(() => eixoXcompacto(svg)); } return r; }
    const S0 = o.series, last = S0[S0.length - 1], lf = o.lfmt || (v => NF0.format(v));
    const v = (c, s) => { try { const x = o.val(c, s); return x == null || !(x > 0) ? null : x; } catch (e) { return null; } };
    cats = cats.slice().sort((a, b) => (v(b, last) ?? -1) - (v(a, last) ?? -1));
    const W = Math.max(520, Math.round(host.clientWidth || 760)), L = 150, R = 76, bh = 13, gp = 3, pad = 14;
    const rowH = S0.length * (bh + gp) + pad, H = cats.length * rowH + 4;
    const vmax = Math.max(...cats.flatMap(c => S0.map(s => v(c, s) || 0))) || 1;
    const X = x => L + (W - L - R) * (x / vmax);
    let g = '';
    cats.forEach((c, ci) => {
        const y0 = ci * rowH + pad / 2, yc = y0 + (S0.length * (bh + gp)) / 2;
        g += `<text class="ax cx" x="${L - 12}" y="${yc + 4}" text-anchor="end">${esc(c)}</text>`;
        S0.forEach((s, si) => {
            const x = v(c, s), y = y0 + si * (bh + gp);
            if (x == null) { g += `<text class="dlab" x="${L + 4}" y="${y + bh - 2}">—</text>`; return; }
            const atual = si === S0.length - 1;
            g += `<rect class="bar gb" data-c="${ci}" data-s="${si}" x="${L}" y="${y}" width="${Math.max(2, X(x) - L)}" height="${bh}" rx="3" style="fill:${s.color};${o.onClick ? 'cursor:pointer' : ''}"/>`;
            g += `<text class="${atual ? 'vl' : 'dlab'}" x="${X(x) + 6}" y="${y + bh - 2}" style="${atual ? 'font-weight:800' : ''}">${lf(x)}</text>`;
        });
        if (ci < cats.length - 1) g += `<line x1="${L - 140}" x2="${W - 4}" y1="${y0 + rowH - pad / 2}" y2="${y0 + rowH - pad / 2}" style="stroke:var(--bd);stroke-width:1"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="barras por categoria">${g}</svg>`;
    $$('.gb', host).forEach(b => { const c = cats[+b.dataset.c], s = S0[+b.dataset.s];
        bindTip(b, () => o.tip ? o.tip(c, s, v(c, s)) : `<div class="th">${esc(c)}</div><div class="tr"><span class="sw" style="background:${s.color}"></span><span>${esc(s.name)}</span><b>${lf(v(c, s))}</b></div>`);
        if (o.onClick) b.addEventListener('click', () => { hideTip(); o.onClick(c, s, v(c, s)); }); });
};

    const linhas = anos.map((a, i) => { const T = tot.v[i], Hh = hora.v[i], D = dia ? dia.v[i] : Math.max(0, T - Hh), d = i ? dv(T, tot.v[i - 1]) : null;
        return `<div class="tp-r"><span class="tp-a">${a}</span><div class="tp-b"><i style="width:${Hh / mx * 100}%;background:var(--teal-deep)"></i><i style="width:${D / mx * 100}%;background:var(--y-old)"></i></div>
          <span class="tp-v"><b>${fMi(T)}</b>${d == null ? '' : ` <em class="${d > 0 ? 'du' : 'dd'}">${d > 0 ? '▲' : '▼'} ${NF1.format(Math.abs(d) * 100)}%</em>`}</span>

   O clique da linha original continua funcionando (detalhe). */
const numsBR = s => { const out = []; const re = /([−-])?\s*R?\$?\s*([\d.]+(?:,\d+)?)\s*(mi\b|mil\b)?/g; let m; const txt = String(s).replace(/ /g, ' ');
    while ((m = re.exec(txt))) { let v = parseFloat(m[2].replace(/\./g, '').replace(',', '.')); if (!isFinite(v)) continue; if (m[3] === 'mi') v *= 1e6; else if (m[3] === 'mil') v *= 1e3; out.push(m[1] ? -v : v); } return out; };
const partes = td => { // divide célula com dois valores (atual / anterior)
    const brs = td.innerHTML.split(/<br\s*\/?>/i); if (brs.length > 1) return brs.map(h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.trim(); });
    const kids = [...td.childNodes].map(n => n.textContent.trim()).filter(Boolean); return kids.length > 1 ? kids : [td.textContent.trim()];
};

function tabelaVisual(t) {
    if (t.dataset.vis || t.classList.contains('hm') || t.closest('.drw')) return false;
    const ths = [...t.querySelectorAll('thead th')].map(x => x.textContent.replace('▼', '').trim());
    const tb = t.tBodies[0]; if (!tb) return false;
    const all = [...tb.rows], tot = all.filter(r => r.classList.contains('tot')), rows = all.filter(r => !r.classList.contains('tot'));
    if (!rows.length) return false;
    t.dataset.vis = '1';
    const metricas = !ths[0] || /^ano$/i.test(ths[0]);
    const ncol = Math.max(...rows.map(r => r.cells.length));
    const isNum = c => rows.some(r => r.cells[c] && r.cells[c].classList.contains('n') && !r.cells[c].classList.contains('bcell'));
    const isV = c => rows.some(r => r.cells[c] && isVar(ths[c], r.cells[c]));
    const box = t.closest('.tw') || t;
    if (metricas) {                                     // indicador × anos
        const anos = ths.slice(1);
        const html = rows.map(r => {
            const lab = r.cells[0].textContent.trim();
            const cel = [...r.cells].slice(1).map(td => ({ t: td.textContent.trim(), v: numsBR(td.textContent)[0] }));
            const mx = Math.max(...cel.map(c => Math.abs(c.v || 0))) || 1;
            const a = cel[cel.length - 1].v, b = cel[cel.length - 2]?.v, d = a != null && b ? a / b - 1 : null;
            return `<div class="mt-r"><div class="mt-l">${esc(lab)}</div><div class="mt-y">${cel.map((c, i) => `<div class="mt-c ${i === cel.length - 1 ? 'on' : ''}"><span>${esc(anos[i] || '')}</span><div class="mt-b"><i style="width:${c.v == null ? 0 : Math.max(2, Math.abs(c.v) / mx * 100)}%"></i></div><b>${esc(c.t)}</b></div>`).join('')}</div>
              <div class="mt-d">${d == null || !isFinite(d) ? '' : `<em class="${d > 0 ? 'du' : 'dd'}">${d > 0 ? '▲' : '▼'} ${NF1.format(Math.abs(d) * 100)}%</em><small>vs ${esc(anos[anos.length - 2] || '')}</small>`}</div></div>`;
        }).join('');
        box.outerHTML = `<div class="mt">${html}</div>`;
        return true;
    }
    // ranking
    const cur = String(S.cur);
    let ci = ths.findIndex(h => h === cur);
    if (ci < 0) ci = ths.findIndex(h => /^(gasto|valor|economia)$/i.test(h));
    if (ci < 0) ci = ths.findIndex((h, c) => c > 0 && isNum(c) && !isV(c));
    if (ci < 0) return false;
    const vi = [...Array(ncol).keys()].filter(c => c > 0 && isV(c)).pop();
    const prio = h => /hora|h$/i.test(h) ? 1 : /custo|tarifa|r\$\/h/i.test(h) ? 2 : /%/.test(h) ? 3 : /linhas/i.test(h) ? 5 : 4;
    const larg = box.getBoundingClientRect().width || 900, nSec = larg > 950 ? 3 : larg > 700 ? 2 : 1;   // cards de meia largura mostram menos colunas
    const sec = [...Array(ncol).keys()].filter(c => c > 0 && c !== ci && c !== vi && isNum(c) && !isV(c)).sort((a, b) => prio(ths[a]) - prio(ths[b])).slice(0, nSec);
    const txtCols = [...Array(ncol).keys()].filter(c => c > 0 && !isNum(c) && !isV(c) && !rows.some(r => r.cells[c]?.classList.contains('ob') || r.cells[c]?.classList.contains('bcell')));
    const obCol = [...Array(ncol).keys()].find(c => rows.some(r => r.cells[c]?.classList.contains('ob')));
    const dados = rows.map(r => {
        const main = r.cells[ci], ps = main ? partes(main) : [''];
        const v = numsBR(ps[0])[0] ?? null, v0 = ps.length > 1 ? (numsBR(ps[1])[0] ?? null) : null;
        const dot = r.cells[0].querySelector('.dotc, i[style*="background"]');
        const nome = [r.cells[0].textContent.replace(/^\d+/, '').trim(), ...txtCols.map(c => r.cells[c]?.textContent.trim()).filter(Boolean)].join(' · ');
        return { r, v, v0, t: ps[0], t0: ps[1], nome, cor: dot ? dot.style.background : '', ob: obCol != null ? (r.cells[obCol]?.textContent.trim() || '') : '',
            sec: sec.map(c => { const q = partes(r.cells[c] || document.createElement('td')); return { a: q[0], b: q[1] }; }), vr: vi != null ? (r.cells[vi]?.textContent.trim() || '') : '' };
    }).sort((a, b) => (b.v ?? -1e18) - (a.v ?? -1e18));
    const mx = Math.max(...dados.map(d => Math.max(Math.abs(d.v || 0), Math.abs(d.v0 || 0)))) || 1;
    const cols = `28px minmax(150px,1.3fr) minmax(200px,2fr) ${sec.map(() => 'minmax(88px,.7fr)').join(' ')} ${vi != null ? '96px' : ''}`;
    const cab = `<div class="rk-h" style="grid-template-columns:${cols}"><span></span><span>${esc(ths[0])}</span><span>${esc(ths[ci])} ▼</span>${sec.map(c => `<span class="n">${esc(ths[c])}</span>`).join('')}${vi != null ? `<span class="n">${esc(ths[vi])}</span>` : ''}</div>`;
    const lin = dados.map((d, i) => `<div class="rk-r" data-i="${i}" style="grid-template-columns:${cols}">
        <span class="rk ${i ? '' : 'rk1'}">${i + 1}</span>
        <span class="rk-n">${d.cor ? `<i style="background:${d.cor}"></i>` : ''}<b>${esc(d.nome)}</b>${d.ob ? `<small>${esc(d.ob.length > 110 ? d.ob.slice(0, 109) + '…' : d.ob)}</small>` : ''}</span>
        <span class="rk-b"><span class="rk-bar">${d.v0 != null ? `<i class="g" style="width:${Math.abs(d.v0) / mx * 100}%"></i>` : ''}<i style="width:${Math.max(1.5, Math.abs(d.v || 0) / mx * 100)}%;${d.cor ? `background:${d.cor}` : ''}"></i></span><b>${esc(d.t)}</b>${d.t0 ? `<small>${esc(d.t0)}</small>` : ''}</span>
        ${d.sec.map(s => `<span class="n">${esc(s.a || '—')}${s.b ? `<small>${esc(s.b)}</small>` : ''}</span>`).join('')}
        ${vi != null ? `<span class="n rk-v ${/▼|−/.test(d.vr) ? 'dd' : /▲|\+/.test(d.vr) ? 'du' : ''}">${esc(d.vr || '—')}</span>` : ''}</div>`).join('');
    const rod = tot.length ? `<div class="rk-t">${[...tot[0].cells].map((c, i) => i === 0 ? `<b>${esc(c.textContent.trim())}</b>` : (c.textContent.trim() ? `<span>${esc(ths[i] || '')} <b>${esc(c.textContent.trim())}</b></span>` : '')).join('')}</div>` : '';
    const legenda = dados.some(d => d.v0 != null) ? `<div class="iab-leg"><span><i style="background:var(--teal-deep)"></i>período atual</span><span><i style="background:var(--bd2)"></i>período anterior</span></div>` : '';
    const wrap = document.createElement('div'); wrap.className = 'rkl'; wrap.innerHTML = cab + lin + rod + legenda;
    box.replaceWith(wrap);
    $$('.rk-r', wrap).forEach(el => { const d = dados[+el.dataset.i]; if (d.r.classList.contains('rowclick') || d.r.onclick || d.r.dataset.ag || d.r.dataset.l) { el.classList.add('clk2'); el.addEventListener('click', () => d.r.click()); } });
    return true;
}
/* ---------- shell ---------- */
const TABS = [
    ['gestao', 'Eficiência em custos'],
    ['pano', 'Panorama do ano'],
    ['preco', 'Preço por hora'],
    ['volume', 'Volume × preço'],
    ['forn', 'Fornecedores'],
    ['onde', 'Onde gastamos'],
    ['efic', 'Eficiência'],
    ['dados', 'Dados']
];

function renderFilters() {
    const ags = agencies();
    $('#filters').innerHTML = `<div class="fg"><span class="fl">Período</span><div class="seg2"><button data-p="ytd" class="${S.f.per==='ytd'?'on':''}">Mesmo período de cada ano (${perLabel()})</button><button data-p="ano" class="${S.f.per==='ano'?'on':''}">Ano completo</button></div></div>
   <div class="fg"><span class="fl">Fornecedor</span><div class="chips">${ags.map(a=>`<button class="chip ${S.f.ag.has(a)?'on':''}" data-a="${esc(a)}"><i style="background:${agColor(a)}"></i>${esc(a)}</button>`).join('')}</div></div>
   <div class="fg"><span class="fl">Ativo</span><select id="f-loc"><option value="">Todos</option>${locals().map(l=>`<option ${S.f.loc===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
    $$('#filters [data-p]').forEach(b => b.onclick = () => {
        S.f.per = b.dataset.p;
        render();
    });
    $$('#filters .chip').forEach(b => b.onclick = () => {
        const a = b.dataset.a;
        if (S.f.ag.has(a)) {
            if (S.f.ag.size > 1) S.f.ag.delete(a);
        } else S.f.ag.add(a);
        render();
    });
    $('#f-loc').onchange = e => {
        S.f.loc = e.target.value;
        render();
    };
}

function render(keepScroll) {
    const y = window.scrollY;
    $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
    $('#filters').style.display = (S.tab === 'dados') ? 'none' : '';
    if (S.tab !== 'dados') renderFilters();
    $('#asof').title = S.src.name;
    $('#asof').textContent = 'Dados até ' + S.maxDate.split('-').reverse().join('/');
    const v = V[S.tab]();
    $('#view').innerHTML = v.html;
    v.after();
    if (keepScroll) window.scrollTo(0, y);
}

function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.hidden = true, 5000);
}
async function loadFile(f) {
    try {
        const buf = await f.arrayBuffer();
        const r = parseWorkbook(XLSX, new Uint8Array(buf));
        const src = {
            name: f.name,
            sheet: r.sheet,
            at: new Date().toLocaleString('pt-BR')
        };
        setData(r.rows, src);
        try {
            localStorage.setItem('po_reb_v1', JSON.stringify({
                rows: r.rows.map(o => ({
                    ...o,
                    ob: (o.ob || '').slice(0, 140)
                })),
                src
            }));
        } catch (e) {}
        S.tab = S.tab;
        render();
        toast('Base atualizada: ' + fN(r.rows.length) + ' linhas, último registro em ' + S.maxDate.split('-').reverse().join('/') + '.');
    } catch (e) {
        toast('Não consegui ler o arquivo: ' + e.message);
    }
}

function initEmbedded() {
    setData(JSON.parse(JSON.stringify(EMBED.rows)), EMBED.src);
}

function init() {
    try {
        localStorage.removeItem('po_reb_v1');
    } catch (e) {}
    initEmbedded();
    $('.tabs').innerHTML = TABS.map(([k, l], i) => `<button data-t="${k}"><span>${i+1}</span>${l}</button>`).join('');
    $$('.tabs button').forEach(b => b.onclick = () => {
        S.tab = b.dataset.t;
        hideTip();
        render();
        window.scrollTo(0, 0);
    });
    $('#file').onchange = e => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
        e.target.value = '';
    };
    $('#upd').onclick = () => loadLive(true);
    $('#theme').onclick = () => {
        const r = document.documentElement;
        const dark = (r.dataset.theme === 'dark') || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
        r.dataset.theme = dark ? 'light' : 'dark';
        render(true);
    };
    // modo apresentação: esconde discretamente os controles de atualização/edição de dados para exibir à diretoria
    $('.acts').insertAdjacentHTML('afterbegin', '<button class="btn ghost" id="present" title="Modo apresentação — oculta os controles de atualização e a página Dados para exibir à diretoria">⛶</button>');
    const setPresent = on => {
        document.body.classList.toggle('present', on);
        $('#present').classList.toggle('on', on);
        $('#present').title = on ? 'Sair do modo apresentação' : 'Modo apresentação — oculta os controles de atualização e a página Dados para exibir à diretoria';
        if (on && S.tab === 'dados') {
            S.tab = 'gestao';
            render();
        }
        try {
            localStorage.setItem('po_present_v1', on ? '1' : '0');
        } catch (e) {}
    };
    $('#present').onclick = () => setPresent(!document.body.classList.contains('present'));
    let presentInit = false;
    try {
        presentInit = localStorage.getItem('po_present_v1') === '1';
    } catch (e) {}
    setPresent(presentInit);
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.body.classList.contains('present')) setPresent(false);
    });
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
        e.preventDefault();
        if (e.target.closest && e.target.closest('#drop2')) return;
        if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
    document.addEventListener('keydown', e => {
        if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
        const avail = document.body.classList.contains('present') ? TABS.filter(t => t[0] !== 'dados') : TABS;
        const i = avail.findIndex(t => t[0] === S.tab);
        if (e.key === 'ArrowRight' && i < avail.length - 1) {
            S.tab = avail[i + 1][0];
            render();
            window.scrollTo(0, 0);
        }
        if (e.key === 'ArrowLeft' && i > 0) {
            S.tab = avail[i - 1][0];
            render();
            window.scrollTo(0, 0);
        }
    });
    render();
    iniciarAoVivo();
}
document.addEventListener('DOMContentLoaded', init);</script>
