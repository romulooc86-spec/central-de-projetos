<script>
/* ===================== NÚCLEO DE DADOS · Lançamento de Barreira ===================== */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const META = 15;            // minutos: meta contratual (solicitação → término)
const T_MAX = 720;          // acima de 12 h o tempo não entra nas médias (vai para a qualidade dos dados)
const CRIT = 30;            // ponto crítico: mais de 30 min
const fN = n => n == null || isNaN(n) ? '–' : Math.round(n).toLocaleString('pt-BR');
const fD = (n, d = 1) => n == null || isNaN(n) ? '–' : n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fP = (x, d = 1) => x == null || isNaN(x) ? '–' : fD(x * 100, d) + '%';
const fP0 = x => x == null || isNaN(x) ? '–' : fD(x * 100, 0) + '%';
const hhmm = f => { if (f == null) return '–'; const m = Math.round(f * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const fDt = iso => iso ? iso.slice(8) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '–';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mod1 = x => ((x % 1) + 1) % 1;
const mLbl = ym => MES[+ym.slice(5) - 1] + '/' + ym.slice(2, 4);
const sum = a => a.reduce((s, v) => s + v, 0);
const avg = a => a.length ? sum(a) / a.length : null;
const median = a => { if (!a.length) return null; a = [...a].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const groupBy = (a, f) => { const m = new Map(); a.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };

/* ---------- catálogo de inconsistências ---------- */
const CHK = {
  txt:    { sev: 'Alta',  nome: 'Horário digitado como texto', desc: 'Hora escrita com ponto e vírgula, dois pontos duplos ou outro símbolo. O painel recupera o valor, mas a planilha não calcula.' },
  h24:    { sev: 'Alta',  nome: 'Horário fora de 00:00–23:59', desc: 'Hora com valor de um dia inteiro ou mais (ex.: 30:00).' },
  fimAnt: { sev: 'Alta',  nome: 'Término antes do início', desc: 'Hora de término menor que a de início, sem virada de dia plausível (23h–03h).' },
  iniAnt: { sev: 'Média', nome: 'Início antes da solicitação', desc: 'O atendimento começou antes de ser solicitado, sem virada de dia plausível.' },
  div:    { sev: 'Média', nome: 'Tempo da planilha diverge do calculado', desc: 'O tempo digitado/calculado na planilha difere de término − solicitação em mais de 1,5 min.' },
  t12:    { sev: 'Alta',  nome: 'Tempo acima de 12 horas', desc: 'Provável erro de data ou de hora; fica fora das médias, mas conta como fora da meta.' },
  curto:  { sev: 'Baixa', nome: 'Tempo abaixo de 5 minutos', desc: 'Atendimento praticamente instantâneo; vale confirmar os horários.' },
  semCt:  { sev: 'Alta',  nome: 'Contrato em branco', desc: 'Sem contrato, o atendimento não entra no resultado por contrato.' },
  semLoc: { sev: 'Alta',  nome: 'Local em branco', desc: 'Sem berço ou local informado.' },
  ctLoc:  { sev: 'Alta',  nome: 'Contrato incompatível com o local', desc: 'Berço de um contrato lançado em outro (LON 1: berços; LON 2: BEX; EQUINOR; demais locais: SPOT).' },
  eqMin:  { sev: 'Baixa', nome: 'Equipe fora do padrão', desc: 'Equipe escrita fora do padrão A, B, C ou D (ex.: minúscula).' },
  dup:    { sev: 'Alta',  nome: 'Possível lançamento duplicado', desc: 'Mesma data, embarcação, operação e hora de início já lançados em outra linha.' },
  meta:   { sev: 'Média', nome: 'Meta diferente de 15 minutos', desc: 'A coluna Meta da linha não está em 15 min, o contratado.' },
  nome:   { sev: 'Baixa', nome: 'Nome da embarcação com espaço sobrando', desc: 'Espaço no fim ou duplo no nome; separa a mesma embarcação em duas nos relatórios.' },
  embSimul:{ sev: 'Alta', nome: 'Mesma embarcação em dois atendimentos ao mesmo tempo', desc: 'A embarcação aparece em duas operações com horários de execução sobrepostos.' },
  locSimul:{ sev: 'Média', nome: 'Mesmo berço com dois atendimentos ao mesmo tempo', desc: 'Duas operações no mesmo local com horários de execução sobrepostos.' },
  eqTurno:{ sev: 'Baixa', nome: 'Equipe fora do turno habitual', desc: 'Em geral A e C atuam de dia (07h–19h) e B e D à noite; pode ser troca de escala, vale confirmar.' },
  critObs:{ sev: 'Média', nome: 'Ponto crítico sem observação', desc: 'Atendimento acima de 30 min sem justificativa na coluna Observação.' },
};
const SEV_ORD = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };
const LOC_CT = { 'BERÇO 01': 'LON 1', 'BERÇO 02': 'LON 1', 'BERÇO 03': 'LON 1', 'BERÇO 04': 'LON 1', 'BERÇO 06': 'LON 1', 'BERÇO 07': 'LON 1', 'BEX 01': 'LON 2', 'BEX 02': 'LON 2', 'EQUINOR': 'EQUINOR' };

/* ---------- leitura da planilha ---------- */
function horaTexto(x) {
  if (typeof x === 'number') return { v: x, txt: false };
  if (x == null) return { v: null, txt: false };
  const m = String(x).match(/(\d{1,2})\D+(\d{1,2})/);
  if (m && +m[1] < 24 && +m[2] < 60) return { v: (+m[1] * 60 + +m[2]) / 1440, txt: true };
  return { v: null, txt: true };
}
const serialISO = s => new Date(Date.UTC(1899, 11, 30) + Math.round(s) * 864e5).toISOString().slice(0, 10);

function parseBarreira(linhas) {
  const rows = [];
  linhas.forEach(a => {
    if (typeof a[1] !== 'number') return;
    const ds = Math.floor(a[1]), iso = serialISO(ds);
    const embRaw = a[2] == null ? '' : String(a[2]);
    const eqRaw = a[5] == null ? '' : String(a[5]);
    const so = horaTexto(a[6]), io = horaTexto(a[7]), fo = horaTexto(a[8]);
    const r = {
      id: a[0], ds, iso, y: +iso.slice(0, 4), mo: +iso.slice(5, 7), ym: iso.slice(0, 7), dow: new Date(iso + 'T12:00:00Z').getUTCDay(),
      embRaw, emb: embRaw.trim().replace(/\s+/g, ' ').toUpperCase(), ct: a[3] ? String(a[3]).trim().toUpperCase() : '', loc: a[4] ? String(a[4]).trim().toUpperCase() : '',
      eqRaw, eq: eqRaw.trim().toUpperCase(), op: a[11] ? String(a[11]).trim().toUpperCase() : '', obs: a[12] ? String(a[12]).trim() : '',
      sol: so.v, ini: io.v, fim: fo.v, tcol: typeof a[9] === 'number' ? a[9] * 1440 : null, meta: typeof a[10] === 'number' ? a[10] * 1440 : null,
      fl: [], dt: {}
    };
    const flag = (c, det) => { r.fl.push(c); r.dt[c] = det || ''; };
    if (so.txt || io.txt || fo.txt) flag('txt', ['sol', 'ini', 'fim'].filter((k, i) => [so, io, fo][i].txt).map(k => ({ sol: 'solicitação', ini: 'início', fim: 'término' }[k]) + ' “' + a[{ sol: 6, ini: 7, fim: 8 }[k]] + '”').join(' · '));
    ['sol', 'ini', 'fim'].forEach(k => { if (r[k] != null && (r[k] >= 1 || r[k] < 0)) { flag('h24', 'valor ' + r[k].toFixed(3)); r[k] = mod1(r[k]); } });
    r.eq1 = r.eq.replace(/[^A-D]/g, '');
    // tempo de atendimento = término − solicitação (como a planilha calcula)
    let tc = null;
    if (r.sol != null && r.fim != null) tc = mod1(r.fim - r.sol) * 1440;
    else if (r.ini != null && r.fim != null) tc = mod1(r.fim - r.ini) * 1440;
    r.t = tc != null ? tc : (r.tcol != null && r.tcol > 0 ? r.tcol : null);
    if (tc != null && r.tcol != null && Math.abs(r.tcol - tc) > 1.5 && Math.abs(Math.abs(r.tcol - tc) - 1440) > 1.5) flag('div', 'planilha ' + fD(r.tcol, 0) + ' min × calculado ' + fD(tc, 0) + ' min');
    else if (tc != null && r.tcol != null && r.tcol < 0) flag('div', 'planilha ' + fD(r.tcol, 0) + ' min × calculado ' + fD(tc, 0) + ' min');
    r.esp = null; r.exe = null;
    if (r.sol != null && r.ini != null) { let e = (r.ini - r.sol) * 1440; if (e < -720) e += 1440; if (e > 720) e -= 1440; r.esp = e; }
    if (r.ini != null && r.fim != null) { const x = mod1(r.fim - r.ini) * 1440; if (x <= T_MAX) r.exe = x; }
    if (r.t != null && r.t > T_MAX) { flag('t12', fD(r.t / 60, 1) + ' h'); }
    if (r.t != null && r.t < 5) flag('curto', fD(r.t, 0) + ' min');
    const noite = (x, y) => x != null && y != null && x >= 21 / 24 && y <= 3 / 24;
    if (r.ini != null && r.fim != null && r.fim < r.ini && !noite(r.ini, r.fim)) flag('fimAnt', 'início ' + hhmm(r.ini) + ' · término ' + hhmm(r.fim));
    if (r.sol != null && r.ini != null && r.ini < r.sol && !noite(r.sol, r.ini)) flag('iniAnt', 'solicitação ' + hhmm(r.sol) + ' · início ' + hhmm(r.ini));
    if (!r.ct) flag('semCt');
    if (!r.loc) flag('semLoc');
    if (r.ct && r.loc && (LOC_CT[r.loc] || 'SPOT') !== r.ct) flag('ctLoc', r.ct + ' em ' + r.loc);
    if (r.eqRaw && r.eqRaw !== r.eq1) flag('eqMin', '“' + r.eqRaw + '”');
    if (r.meta != null && Math.abs(r.meta - META) > 0.5) flag('meta', fD(r.meta, 0) + ' min');
    if (embRaw && (embRaw !== embRaw.trim() || /\s{2}/.test(embRaw))) flag('nome', '“' + embRaw + '”');
    r.na = r.t != null && Math.round(r.t) <= META;                 // dentro da meta
    r.cr = r.t != null && r.t > CRIT;                              // ponto crítico
    if (r.cr && !r.obs) flag('critObs', fD(r.t, 0) + ' min');
    r.h = r.sol != null ? Math.floor(r.sol * 24) : (r.ini != null ? Math.floor(r.ini * 24) : null);
    r.turno = r.h == null ? null : (r.h >= 7 && r.h < 19 ? 'Dia' : 'Noite');
    if (r.turno && ((r.turno === 'Dia' && (r.eq1 === 'B' || r.eq1 === 'D')) || (r.turno === 'Noite' && (r.eq1 === 'A' || r.eq1 === 'C')))) flag('eqTurno', 'equipe ' + r.eq1 + ' no turno da ' + (r.turno === 'Dia' ? 'dia' : 'noite') + ' (' + hhmm(r.sol != null ? r.sol : r.ini) + ')');
    rows.push(r);
  });
  // duplicados
  const seen = new Map();
  rows.forEach(r => { if (r.ini == null) return; const k = [r.iso, r.emb, r.op, Math.round(r.ini * 1440)].join('|'); if (seen.has(k)) { r.fl.push('dup'); r.dt.dup = 'igual à linha ' + seen.get(k); } else seen.set(k, r.id); });
  concorrencia(rows);
  sobrepostos(rows, r => r.emb, 'embSimul'); sobrepostos(rows, r => r.loc, 'locSimul');
  rows.forEach(r => { r.bad = r.fl.some(c => CHK[c].sev !== 'Baixa'); });   // gravidade baixa lista, mas não pesa no índice
  return rows;
}

function sobrepostos(rows, keyf, code) {
  groupBy(rows.filter(r => r.wE && keyf(r)), keyf).forEach(a => {
    a.sort((x, y) => x.wE[0] - y.wE[0]); let fim = -1, quem = null;
    a.forEach(r => { if (quem && r.wE[0] < fim) { r.fl.push(code); r.dt[code] = 'sobrepõe a linha ' + quem.id + ' (' + hhmm(quem.ini) + '–' + hhmm(quem.fim) + ')'; } if (r.wE[1] > fim) { fim = r.wE[1]; quem = r; } });
  });
}
/* ---------- simultaneidade ---------- */
function janelas(r) {
  const base = r.ds * 1440;
  r.wA = r.wE = null;
  if (r.fim == null || (r.sol == null && r.ini == null)) return;
  const s0 = r.sol != null ? r.sol : r.ini;
  let a = base + s0 * 1440, i = r.ini != null ? base + r.ini * 1440 : a;
  if (r.sol != null && r.ini != null && r.ini + 0.5 < r.sol) i += 1440;   // início depois da meia-noite
  if (i < a) i = a;
  let e = base + r.fim * 1440; while (e < i) e += 1440;
  if (e - a > T_MAX || e - i > T_MAX) return;
  r.wA = [a, Math.max(e, a + 1)]; r.wE = [i, Math.max(e, i + 1)];
}
function varre(rs, w, out, grp) {
  const g = grp ? groupBy(rs, grp) : new Map([['*', rs]]);
  const picos = [];
  g.forEach(list => {
    const ev = [];
    list.forEach(r => { if (r[w]) { ev.push([r[w][0], 1, r], [r[w][1], 0, r]); if (!(out in r)) r[out] = 1; } });
    ev.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
    const act = new Set();
    ev.forEach(([t, typ, r]) => {
      if (typ === 0) { act.delete(r); return; }
      act.add(r); const n = act.size;
      act.forEach(q => { if (q[out] < n) q[out] = n; });
      if (!grp && n >= 3) picos.push({ t, n, ids: [...act] });
    });
  });
  return picos;
}
function concorrencia(rows) {
  rows.forEach(janelas);
  rows.forEach(r => { r.cA = r.cE = r.qA = r.qE = 0; if (r.wA) { r.cA = r.cE = r.qA = r.qE = 1; } });
  const out = {};
  out.A = varre(rows, 'wA', 'cA'); out.E = varre(rows, 'wE', 'cE');
  varre(rows, 'wA', 'qA', r => r.eq1); varre(rows, 'wE', 'qE', r => r.eq1);
  // episódios de pico: agrupa instantes com ≤ 60 min de distância e guarda o maior
  const ep = lista => { lista.sort((a, b) => a.t - b.t); const res = []; lista.forEach(p => { const u = res[res.length - 1]; if (u && p.t - u.fim <= 60) { u.fim = p.t; if (p.n > u.n) { u.n = p.n; u.ids = p.ids; u.t = p.t; } } else res.push({ ...p, fim: p.t }); }); return res; };
  CONC.picos = { A: ep(out.A), E: ep(out.E) };
}
const CONC = { picos: { A: [], E: [] } };

/* ---------- métricas ---------- */
function agg(rs, W) {
  W = W || 'E';
  const n = rs.length, ok = rs.filter(r => r.na).length;
  const tv = rs.filter(r => r.t != null && r.t <= T_MAX).map(r => r.t);
  const cr = rs.filter(r => r.cr), cr60 = rs.filter(r => r.t != null && r.t > 60);
  const sim = rs.filter(r => r['c' + W] >= 2), simEq = rs.filter(r => r['q' + W] >= 2);
  const iso = rs.filter(r => r['c' + W] < 2);
  return {
    espM: avg(rs.filter(r => r.esp != null && r.esp >= 0 && r.esp <= T_MAX).map(r => r.esp)), exeM: avg(rs.filter(r => r.exe != null).map(r => r.exe)),
    n, ok, pct: n ? ok / n : null, avg: avg(tv), med: median(tv), crit: cr.length, critP: n ? cr.length / n : null, cr60: cr60.length,
    sim: sim.length, simP: n ? sim.length / n : null, simEq: simEq.length, simEqP: n ? simEq.length / n : null,
    pctIso: iso.length ? iso.filter(r => r.na).length / iso.length : null, pctSim: sim.length ? sim.filter(r => r.na).length / sim.length : null,
    pctSimEq: simEq.length ? simEq.filter(r => r.na).length / simEq.length : null,
    col: rs.filter(r => r.op === 'COLOCAÇÃO').length, ret: rs.filter(r => r.op === 'RETIRADA').length, bad: rs.filter(r => r.bad).length
  };
}

/* ---------- estado, filtros e janelas de período ---------- */
const S = { rows: [], max: null, Y: null, cut: null, f: { per: 'ytd', ct: '', op: '', eq: '' }, tab: 'resumo', meta: {} };
function setRows(rows) {
  S.rows = rows; S.max = rows.reduce((m, r) => r.iso > m ? r.iso : m, '0000');
  S.Y = +S.max.slice(0, 4); S.cut = S.max.slice(5);
}
const inWin = (r, y) => r.y === y && r.iso.slice(5) <= S.cut;
const filt = (rs, f) => { f = f || S.f; return rs.filter(r => (!f.ct || r.ct === f.ct) && (!f.op || r.op === f.op) && (!f.eq || r.eq1 === f.eq)); };
function periodo(f) {
  f = f || S.f; const base = filt(S.rows, f);
  if (f.per === 'all') return { cur: base, prv: null, lc: 'todo o histórico', lp: '' };
  return { cur: base.filter(r => inWin(r, S.Y)), prv: base.filter(r => inWin(r, S.Y - 1)), lc: lblPer(S.Y), lp: lblPer(S.Y - 1) };
}
function lblPer(y) { const m = +S.cut.slice(0, 2); return (m === 12 && S.cut === '12-31') ? 'ano ' + y : MES[0] + '–' + MES[m - 1] + '/' + String(y).slice(2); }
const meses = rs => [...new Set(rs.map(r => r.ym))].sort();

/* ===================== COMPONENTES VISUAIS ===================== */
/* variação: dir = 'up' (subir é bom) ou 'down' (descer é bom); un = 'pp' | '%' | 'abs' */
function delta(c, p, o) {
  o = o || {}; if (c == null || p == null || isNaN(c) || isNaN(p)) return '<span class="d neu">–</span>';
  let v, t;
  if (o.un === 'pp') { v = (c - p) * 100; t = fD(Math.abs(v), 1) + ' p.p.'; }
  else if (o.un === 'abs') { v = c - p; t = fD(Math.abs(v), o.d == null ? 1 : o.d) + (o.suf || ''); }
  else { if (!p) return '<span class="d neu">–</span>'; v = (c / p - 1) * 100; t = fD(Math.abs(v), 1) + '%'; }
  if (Math.abs(v) < (o.un === 'pp' ? 0.05 : 0.05)) return '<span class="d neu">= estável</span>';
  const up = v > 0, good = (o.dir || 'up') === 'up' ? up : !up;
  return `<span class="d ${good ? 'good' : 'att'}">${up ? '▲' : '▼'} ${up ? '+' : '−'}${t}</span>`;
}
function kpi(lb, v, nt, o) {
  o = o || {};
  return `<div class="kpi ${o.dark ? 'dark' : ''}" ${o.go ? `data-go="${o.go}"` : ''}><div class="lb">${lb}</div><div class="v">${v}</div><div class="nt">${nt || ''}</div></div>`;
}
function card(title, sub, body, o) {
  o = o || {};
  return `<section class="card ${o.cls || ''}" ${o.id ? `id="${o.id}"` : ''}>${o.info ? `<button class="info" data-info="${o.info}" aria-label="Como calculamos">i</button>` : ''}<h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}${body}</section>`;
}
/* ranking visual: rows [{nome, sub, v, vp, cols:[html], key}] ; cols = [{h, cls}] */
function ranking(rows, o) {
  const max = Math.max(...rows.map(r => Math.max(r.v || 0, r.vp || 0)), 1e-9);

function monotone(xs, ys) {   // spline cúbica monotônica (Fritsch–Carlson)

  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; } }

  for (let i = 0; i < n - 1; i++) { const h = xs[i + 1] - xs[i]; p += `C${xs[i] + h / 3} ${ys[i] + m[i] * h / 3} ${xs[i + 1] - h / 3} ${ys[i + 1] - m[i + 1] * h / 3} ${xs[i + 1]} ${ys[i + 1]}`; }
  return p;
}

      colChart($('#chw'), { labels: ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'], vals: wd.map(a => a.length), fmt: v => fN(v), H: 230, sub: wd.map(a => a.length ? fP0(a.filter(r => r.na).length / a.length) : ''), cores: wd.map(() => '#042738') });
      const pc = [...groupBy(cur.filter(r => r.cr), r => r.ct).entries()].filter(([k]) => k).map(([k, a]) => ({ k, a, n: (groupBy(cur, r => r.ct).get(k) || []).length })).sort((x, y) => y.a.length - x.a.length);
      $('#rkp').innerHTML = ranking(pc.map(c => ({ nome: c.k, key: 'crit|' + c.k, v: c.a.length, cols: [fP(c.a.length / c.n), `${fN(c.a.filter(r => !r.obs).length)}`] })), { fmt: v => fN(v), hn: 'Contrato', hv: 'Críticos', cols: ['% do contrato', 'Sem observação'] });
    }
  };
}

/* ---------- 5 · EQUIPES ---------- */
function vEquipes() {
  const f2 = { ...S.f, eq: '' }, P = periodo(f2), cur = P.cur, prv = P.prv, A = agg(cur);
  const eqs = ['A', 'B', 'C', 'D'].map(e => ({ e, rs: cur.filter(r => r.eq1 === e), a: agg(cur.filter(r => r.eq1 === e)), b: prv ? agg(prv.filter(r => r.eq1 === e)) : null })).filter(x => x.a.n);
  const worst = [...eqs].sort((x, y) => x.a.pct - y.a.pct)[0], rest = agg(cur.filter(r => r.eq1 !== worst.e));
  const missW = (worst.a.n - worst.a.ok) / Math.max(A.n - A.ok, 1);
  const ms3 = meses(S.rows).slice(-3), l3 = ['A', 'B', 'C', 'D'].map(e => { const a = filt(S.rows, f2).filter(r => ms3.includes(r.ym) && r.eq1 === e); return a.length ? `${e} ${fP0(a.filter(r => r.na).length / a.length)}` : null; }).filter(Boolean).join(' · ');
  const html = `
  <div class="banner"><div class="n">${fP0(worst.a.pct)}</div><div><b>Equipe ${worst.e}: menor cumprimento da meta de 15 min em ${P.lc}</b><span>As demais equipes juntas chegam a ${fP0(rest.pct)}. A equipe ${worst.e} faz ${fP0(worst.a.n / A.n)} dos atendimentos e responde por ${fP0(missW)} dos que ficaram fora da meta; tempo médio de ${fD(worst.a.avg, 1)} min contra ${fD(rest.avg, 1)} min. <b style="display:inline;font:700 14px var(--font-body)">Últimos 3 meses (${ms3.map(mLbl).join(', ')}): ${l3}.</b></span></div></div>
  <div class="grid">${card('Desempenho por equipe', `${P.lc}${prv ? ' × ' + P.lp : ''} · do maior para o menor cumprimento · barra clara = período anterior`, '<div id="rkq"></div>', { info: 'equipe' })}</div>
  <div class="grid" style="margin-top:16px">${card('Cumprimento da meta por equipe, mês a mês', '% de atendimentos em até 15 min · quanto mais escuro, maior o cumprimento', '<div id="hmq"></div>', { info: 'calor' })}</div>
  <div class="grid" style="margin-top:16px">${card('Equipe × turno', 'Atendimentos e % na meta por equipe no turno de dia (07h–19h) e de noite (19h–07h)', '<div id="tbt"></div>', { info: 'turno' })}</div>`;
  return {
    html, after() {
      const ord = [...eqs].sort((x, y) => y.a.pct - x.a.pct);
      $('#rkq').innerHTML = ranking(ord.map(x => ({ nome: 'Equipe ' + x.e, key: 'eq|' + x.e, v: x.a.pct, vp: x.b ? x.b.pct : null, cols: [`${fN(x.a.n)}<small style="color:var(--tx3)">${fP0(x.a.n / A.n)} do volume</small>`, `${fD(x.a.avg, 1)} min<small>${x.b ? dm(x.a.avg, x.b.avg) : ''}</small>`, `${fD(x.a.espM, 1)} min<small>${x.b ? delta(x.a.espM, x.b.espM, { un: 'abs', dir: 'down', d: 1, suf: ' min' }) : ''}</small>`, `${fD(x.a.exeM, 1)} min<small>${x.b ? delta(x.a.exeM, x.b.exeM, { un: 'abs', dir: 'down', d: 1, suf: ' min' }) : ''}</small>`, `${fN(x.a.crit)}<small>${x.b ? dcr(x.a.crit, x.b.crit) : ''}</small>`] })), { fmt: v => fP0(v), hn: 'Equipe', hv: '% na meta', cols: ['Atendimentos', 'Tempo médio', 'Espera média', 'Execução média', 'Críticos >30'] });
      const all = filt(S.rows, f2), ms = meses(all);
      $('#hmq').innerHTML = heatMes([['Total', all], ...ord.map(x => ['Equipe ' + x.e, all.filter(r => r.eq1 === x.e)])], ms);
      const tu = (x, t) => { const a = x.rs.filter(r => r.turno === t); return a.length ? `<b>${fN(a.length)}</b> <small>${fP0(a.filter(r => r.na).length / a.length)} na meta</small>` : '–'; };
      $('#tbt').innerHTML = `<div class="rkw"><table class="cmp"><tr><th>Equipe</th><th>Dia · 07h–19h</th><th>Noite · 19h–07h</th></tr>${ord.map(x => `<tr><td>Equipe ${x.e}</td><td>${tu(x, 'Dia')}</td><td>${tu(x, 'Noite')}</td></tr>`).join('')}</table></div>`;
    }
  };
}

/* ---------- 6 · SIMULTANEIDADE ---------- */
S.win = 'E';
function vSimult() {
  const W = S.win, P = periodo(), cur = P.cur, prv = P.prv, A = agg(cur, W), B = prv && agg(prv, W);
  const cc = 'c' + W, qq = 'q' + W;
  const pico = cur.reduce((m, r) => Math.max(m, r[cc]), 0);
  const picos = CONC.picos[W].filter(p => p.ids.some(r => cur.includes(r))).sort((a, b) => b.n - a.n || b.t - a.t).slice(0, 10);
  const dif = A.pctIso != null && A.pctSim != null ? (A.pctIso - A.pctSim) * 100 : null;
  const html = `
  <div class="chips"><span style="font:700 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);align-self:center;margin-right:4px">Janela</span>
    <button class="chip ${W === "E" ? "on" : ""}" data-win="E">Execução · início → término</button><button class="chip ${W === "A" ? "on" : ""}" data-win="A">Atendimento completo · solicitação → término</button></div>
  <div class="grid g4">
    ${kpi('Em sobreposição', fP(A.simP), `${fN(A.sim)} atendimentos · ${B ? delta(A.simP, B.simP, { un: 'pp', dir: 'down' }) + ' vs ' + P.lp : P.lc}`, { dark: true })}
    ${kpi('Pico ao mesmo tempo', fN(pico) + '<small>atendimentos</small>', picos[0] ? `${fDt(picos[0].ids[0].iso)} · ${hhmm(picos[0].t % 1440 / 1440)}` : '')}
    ${kpi('Mesma equipe em paralelo', fP(A.simEqP), `${fN(A.simEq)} atendimentos com a equipe já ocupada`)}
    ${kpi('Efeito na meta', dif == null ? '–' : (dif > 0 ? '−' : '+') + fD(Math.abs(dif), 0) + '<small>p.p.</small>', `isolado ${fP0(A.pctIso)} × simultâneo ${fP0(A.pctSim)}`)}
  </div>
  <div class="grid g2" style="margin-top:16px">
    ${card('Quantos atendimentos ao mesmo tempo', `${P.lc} · atendimentos por nível; abaixo, % na meta`, '<div class="leg"><span><i class="b" style="background:#A9B8BD"></i>Isolado</span><span><i class="b" style="background:#042738"></i>Em sobreposição</span></div><div id="chs"></div>', { info: 'simult' })}
    ${card('Evolução da sobreposição', '% dos atendimentos do mês que coincidiram com outro', `<div class="leg"><span><i style="background:${COR.a26}"></i>${S.Y}</span><span><i style="background:${COR.a25}"></i>${S.Y - 1}</span></div><div id="chm"></div>`)}
  </div>
  <div class="grid g2" style="margin-top:16px">
    ${card('Por contrato', 'Quem mais convive com sobreposição', '<div id="rkc"></div>')}
    ${card('Por equipe', 'Sobreposição e equipe ocupada', '<div id="rke"></div>')}
  </div>
  <div class="grid" style="margin-top:16px">${card('Maiores picos de simultaneidade', `${P.lc} · clique para ver os atendimentos do pico`, '<div class="lst" id="pks"></div>')}</div>`;
  return {
    html, after() {
      const lv = [1, 2, 3, 4].map(n => cur.filter(r => n < 4 ? r[cc] === n : r[cc] >= 4));
      colChart($('#chs'), { labels: ['1 (isolado)', '2', '3', '4 ou mais'], vals: lv.map(a => a.length), cores: ['#A9B8BD', '#042738', '#042738', '#042738'], fmt: v => fN(v), H: 250, sub: lv.map(a => a.length ? fP0(a.filter(r => r.na).length / a.length) + ' na meta' : '') });
      const ov = overlay(S.rows.filter(r => (!S.f.ct || r.ct === S.f.ct) && (!S.f.op || r.op === S.f.op) && (!S.f.eq || r.eq1 === S.f.eq)), (rs, ms) => sobreMes(rs, ms, W));
      lineChart($('#chm'), { labels: mesesAno(), H: 250, ymin: 0, fmt: v => fP0(v), series: [{ cor: COR.a25, vals: ov[S.Y - 1], lab: false, w: 2.2 }, { cor: COR.a26, vals: ov[S.Y] }] });
      const mk = (keyf, lblf) => [...groupBy(cur, keyf).entries()].filter(([k, a]) => k && a.length >= 30).map(([k, a]) => ({ k, A: agg(a, W), b: prv ? agg(prv.filter(r => keyf(r) === k), W) : null })).sort((x, y) => y.A.simP - x.A.simP);
      $('#rkc').innerHTML = ranking(mk(r => r.ct).map(c => ({ nome: c.k, key: 'sc|' + c.k, v: c.A.simP, vp: c.b ? c.b.simP : null, cols: [fN(c.A.sim), fP0(c.A.pctSim)] })), { fmt: v => fP0(v), hn: 'Contrato', hv: '% em sobreposição', cols: ['Atend.', '% na meta'] });
      $('#rke').innerHTML = ranking(mk(r => r.eq1).map(c => ({ nome: 'Equipe ' + c.k, key: 'se|' + c.k, v: c.A.simP, vp: c.b ? c.b.simP : null, cols: [fN(c.A.simEq), fP0(c.A.pctSimEq)] })), { fmt: v => fP0(v), hn: 'Equipe', hv: '% em sobreposição', cols: ['Equipe ocupada', '% na meta'] });
      $('#pks').innerHTML = picos.length ? picos.map((p, i) => {
        const rs = p.ids; const cts = [...new Set(rs.map(r => r.ct))].join(', '), eqs = [...new Set(rs.map(r => r.eq1))].sort().join('/');
        const mi = rs.reduce((a, r) => a + (r.na ? 1 : 0), 0);
        return `<div class="li" data-pk="${i}"><div class="n">${p.n} <em>ao mesmo tempo</em></div><div class="lt"><b>${fDt(rs[0].iso)} · ${hhmm(p.t % 1440 / 1440)}</b><span>${cts} · equipes ${eqs} · ${mi} de ${rs.length} na meta</span></div></div>`;

}


/* ---------- 7 · QUALIDADE ---------- */
function vQualidade() {
  const base = filt(S.rows, { ...S.f, per: 'all' }), n = base.length, bad = base.filter(r => r.bad).length;
  const lista = Object.keys(CHK).map(c => ({ c, rs: base.filter(r => r.fl.includes(c)) })).filter(x => x.rs.length).sort((a, b) => SEV_ORD[CHK[a.c].sev] - SEV_ORD[CHK[b.c].sev] || b.rs.length - a.rs.length);
  const alta = base.filter(r => r.fl.some(c => CHK[c].sev === 'Alta')).length;
  const mx = Math.max(...lista.map(x => x.rs.length), 1);
  const html = `
  <div class="grid g21">
    ${card('Índice de qualidade da planilha', 'Lançamentos sem inconsistência de gravidade alta ou média (as de gravidade baixa são só padronização)', `<div class="score"><div class="n">${fD((1 - bad / n) * 100, 1)}<em>%</em></div><div><b style="font:700 16px var(--font-display);color:var(--navy)">${fN(n - bad)} de ${fN(n)} linhas corretas</b><div style="font-size:14px;color:var(--tx2)">${fN(bad)} linhas pedem revisão (gravidade alta ou média), sendo ${fN(alta)} de gravidade alta. As regras abaixo rodam sozinhas a cada leitura da planilha.</div></div></div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bcsv">Baixar lista para correção (CSV)</button></div>`, { info: 'qualidade' })}
    ${card('Gravidade', 'Linhas afetadas por nível', `<div id="stg"></div>`)}
  </div>
  <div class="grid" style="margin-top:16px">${card('Inconsistências encontradas', 'Clique para ver as linhas da planilha (o número é a linha do Excel)', `<div id="cks">${lista.map(x => `<div class="ck" data-ck="${x.c}"><div class="sev ${CHK[x.c].sev}">${CHK[x.c].sev}</div><div><b>${CHK[x.c].nome}</b><span class="t">${CHK[x.c].desc}</span></div><div class="bar"><i style="width:${x.rs.length / mx * 100}%"></i></div><div class="q">${fN(x.rs.length)}</div></div>`).join('')}</div>`)}</div>
  <div class="grid g2" style="margin-top:16px">
    ${card('Inconsistências por mês', '% das linhas do mês com alguma inconsistência · barras = quantidade', '<div id="chk"></div>')}
    ${card('Onde nascem os erros', 'Percentual de linhas com inconsistência, por equipe', '<div id="rkk"></div>')}
  </div>
  <div class="grid" style="margin-top:16px">${card('Colocações × retiradas por embarcação', 'Embarcações com diferença de 2 ou mais entre colocações e retiradas lançadas · indica lançamento faltante ou repetido', '<div id="rkb"></div>', { info: 'saldo' })}</div>`;
  return {
    html, after() {
      $('#stg').innerHTML = stack100(['Alta', 'Média', 'Baixa'].map((s, i) => ({ nome: s, cor: ['#042738', '#5F8793', '#8ED8CE'][i], tx: i === 2 ? '#042738' : '#fff', v: base.filter(r => r.fl.some(c => CHK[c].sev === s)).length })), {});
      const ms = meses(base), g = groupBy(base, r => r.ym);
      lineChart($('#chk'), { labels: ms.map(mLbl), H: 250, ymin: 0, fmt: v => fP0(v), bars: ms.map(m => (g.get(m) || []).filter(r => r.bad).length), series: [{ cor: '#042738', vals: ms.map(m => { const a = g.get(m) || []; return a.length ? a.filter(r => r.bad).length / a.length : null; }) }] });
      const eg = [...groupBy(base, r => r.eq1 || '?').entries()].filter(([k]) => k !== '?').map(([k, a]) => ({ k, n: a.length, b: a.filter(r => r.bad).length })).sort((x, y) => y.b / y.n - x.b / x.n);
      $('#rkk').innerHTML = ranking(eg.map(e => ({ nome: 'Equipe ' + e.k, v: e.b / e.n, cols: [fN(e.b), fN(e.n)] })), { fmt: v => fP(v), hn: 'Equipe', hv: '% com inconsistência', cols: ['Linhas com erro', 'Lançamentos'] });
      const bal = [...groupBy(base, r => r.emb).entries()].filter(([k]) => k).map(([k, a]) => { const c = a.filter(r => r.op === 'COLOCAÇÃO').length, t = a.filter(r => r.op === 'RETIRADA').length; return { k, c, t, d: Math.abs(c - t) }; }).filter(x => x.d >= 2).sort((a, b) => b.d - a.d).slice(0, 10);
      $('#rkb').innerHTML = bal.length ? ranking(bal.map(x => ({ nome: x.k, v: x.d, cols: [fN(x.c), fN(x.t)] })), { fmt: v => fN(v), hn: 'Embarcação', hv: 'Diferença', cols: ['Colocações', 'Retiradas'] }) : '<p class="sub">Todas as embarcações com colocações e retiradas equilibradas.</p>';
      $('#bcsv').onclick = () => {
        const L = []; base.filter(r => r.bad).forEach(r => r.fl.forEach(c => L.push([r.id, fDt(r.iso), r.emb, r.ct, r.loc, r.eq1, r.op, CHK[c].sev, CHK[c].nome, r.dt[c] || ''])));
        L.sort((a, b) => a[0] - b[0]); csv('inconsistencias-barreira.csv', ['Linha do Excel', 'Data', 'Embarcação', 'Contrato', 'Local', 'Equipe', 'Operação', 'Gravidade', 'Inconsistência', 'Detalhe'], L); toast('Lista baixada: ' + fN(L.length) + ' apontamentos.');
      };
    }
  };
}

  anual: { t: 'Comparativo entre anos', o: 'Indicadores do ano anterior completo, do mesmo período dos dois anos (para comparar igual com igual) e a variação.', c: 'Atendimentos por dia = atendimentos ÷ dias corridos da janela. Setas em verde-água indicam melhora e em marinho piora; para volume a seta é neutra.' },
  calor: { t: 'Cumprimento da meta mês a mês', o: 'Cada célula é o % de atendimentos do mês concluídos em até 15 minutos. Quanto mais escuro o verde-água, maior o cumprimento. Permite ver de uma vez a evolução e a virada de patamar.', c: 'Meses com menos de 10 atendimentos ficam em branco. A linha Total considera os filtros aplicados.' },
  equipe: { t: 'Desempenho por equipe', o: 'Resultado de cada equipe no período, ordenado do maior para o menor cumprimento da meta.', c: '“Mesma equipe em paralelo” = atendimentos em que a mesma equipe já estava em outro atendimento no mesmo intervalo (janela de execução, início → término).' },
  turno: { t: 'Equipe × turno', o: 'Quantos atendimentos cada equipe fez de dia e de noite e o percentual na meta em cada turno.', c: 'Dia = hora da solicitação entre 07h e 19h; noite = de 19h às 07h. Em geral A e C atuam de dia, B e D à noite; células com poucos registros são lançamentos fora da escala habitual.' },
  simult: { t: 'Simultaneidade', o: 'Quantos atendimentos estavam em andamento ao mesmo tempo. Nível 1 = atendimento isolado; 2 ou mais = sobreposição.', c: 'Dois atendimentos se sobrepõem quando o intervalo de um começa antes de o outro terminar (encostar não conta). O nível de um atendimento é o maior número de atendimentos ativos ao mesmo tempo durante a sua janela. Janela de atendimento: solicitação → término (a que a meta de 15 min mede). Janela de execução: início → término.' },
  qualidade: { t: 'Qualidade dos dados', o: 'Regras automáticas que apontam lançamentos com erro, dúvida ou campo faltando. Cada apontamento mostra a linha da planilha.', c: 'Gravidade alta = impede ou distorce o cálculo; média = distorce uma análise; baixa = padronização. Pontos críticos (> 30 min) não são tratados como erro, apenas quando falta observação.' },
  saldo: { t: 'Colocações × retiradas', o: 'Cada embarcação deveria ter o mesmo número de colocações e retiradas de barreira.', c: 'Diferença absoluta entre colocações e retiradas de cada embarcação em todo o histórico. Diferença de 2 ou mais costuma indicar lançamento faltante ou repetido.' }
});

/* ===================== APLICAÇÃO ===================== */
const TABS = [['resumo', 'Resumo', vResumo, false], ['volume', 'Volume', vVolume, true], ['contratos', 'Contratos', vContratos, true], ['operacao', 'Operação', vOperacao, true], ['equipes', 'Equipes', vEquipes, true], ['simultaneidade', 'Simultaneidade', vSimult, true], ['qualidade', 'Qualidade dos dados', vQualidade, true], ['dados', 'Dados', vDados, false]];
const LIVE_URLS = (location.hostname === 'localhost' || location.protocol === 'file:' ? ['dados/barreira.json'] : []).concat(['https://raw.githubusercontent.com/romulooc86-spec/central-de-projetos/main/projetos/dados/barreira.json', 'dados/barreira.json']);
const LIVE = { ok: false, lido: null, sig: '', err: null };

function buildTabs() {
  $('#tabs').innerHTML = TABS.map((t, i) => `<button class="tab" data-t="${t[0]}"><span>${i + 1}</span>${t[1]}</button>`).join('');
}
function setTab(t, noScroll) {
  S.tab = t; $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const def = TABS.find(x => x[0] === t); $('#fbar').style.display = def[3] ? '' : 'none'; if (!def[3]) $('#filters').classList.remove('open');
  try { history.replaceState(null, '', '#' + t); } catch (e) { }
  render(); if (!noScroll) window.scrollTo({ top: 0 });
}
function fillFilters() {
  const rs = S.rows, opt = (arr, cur) => '<option value="">Todos</option>' + arr.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const cts = [...new Set(rs.map(r => r.ct).filter(Boolean))].sort(), ops = [...new Set(rs.map(r => r.op).filter(Boolean))].sort(), eqs = ['A', 'B', 'C', 'D'];
  $('#filters').innerHTML = `
    <label>Período<select id="f-per"><option value="ytd" ${S.f.per === 'ytd' ? 'selected' : ''}>${lblPer(S.Y)} × ${lblPer(S.Y - 1)}</option><option value="all" ${S.f.per === 'all' ? 'selected' : ''}>Todo o histórico</option></select></label>
    <label>Contrato<select id="f-ct">${opt(cts, S.f.ct)}</select></label>
    <label>Operação<select id="f-op">${opt(ops, S.f.op)}</select></label>
    <label>Equipe<select id="f-eq">${opt(eqs, S.f.eq)}</select></label>
    <label>&nbsp;<button class="btn s2" id="f-clr">Limpar filtros</button></label>`;
  $('#f-per').onchange = e => { S.f.per = e.target.value; render(); }; $('#f-ct').onchange = e => { S.f.ct = e.target.value; render(); };
  $('#f-op').onchange = e => { S.f.op = e.target.value; render(); }; $('#f-eq').onchange = e => { S.f.eq = e.target.value; render(); };
  $('#f-clr').onclick = () => { S.f = { per: 'ytd', ct: '', op: '', eq: '' }; fillFilters(); render(); };
}
function filterSummary() {
  const f = S.tab === 'qualidade' ? { ...S.f, per: 'all' } : S.f, p = [f.per === 'all' ? 'Todo o histórico' : `${lblPer(S.Y)} × ${lblPer(S.Y - 1)}`]; if (f.ct) p.push(f.ct); if (f.op) p.push(f.op.charAt(0) + f.op.slice(1).toLowerCase()); if (f.eq) p.push('Equipe ' + f.eq);
  return p.join(' · ');
}
let rendering = false;
function render() {
  if (!S.rows.length) return;
  const def = TABS.find(x => x[0] === S.tab);
  $('#fsum').textContent = filterSummary();
  let v;
  try { v = def[2](); } catch (e) { console.error(e); $('#view').innerHTML = `<div class="card"><h3>Não foi possível montar esta aba</h3><p class="sub">${esc(e.message)}</p></div>`; return; }
  $('#view').innerHTML = v.html + '<div class="foot">Prime Ocean Navegação · Lançamento de barreira · dados da planilha de controle da equipe</div>';
  try { v.after(); } catch (e) { console.error(e); }
  window._redraw = () => { try { v.after(); } catch (e) { } };
}
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window._redraw) window._redraw(); }, 180); });

/* ---------- leitura ao vivo ---------- */
async function loadLive(manual) {
  try {
    let r = null;
    for (const u of LIVE_URLS) { try { r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) break; } catch (e) { r = null; } }
    if (!r || !r.ok) throw new Error('sem conexão');
    const j = await r.json();
    LIVE.ok = true; LIVE.lido = new Date(); LIVE.err = null; LIVE.modif = j.modificada;
    const sig = j.modificada + '|' + j.publicado + '|' + j.linhas.length;
    if (sig !== LIVE.sig) {
      LIVE.sig = sig; S.meta = { planilha: j.planilha, modificada: j.modificada, publicado: j.publicado };
      setRows(parseBarreira(j.linhas)); fillFilters(); coverTexto(); render();
    }
    if (manual) toast('Dados atualizados: ' + fN(S.rows.length) + ' lançamentos, último em ' + fDt(S.max) + '.');
  } catch (e) { LIVE.ok = false; LIVE.err = e.message; if (manual) toast('Não consegui ler os dados ao vivo agora.'); }
  liveStatus();
}
function liveStatus() {
  const hh = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const dd = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '') + ', ' + hh(d); };
  $('#live').innerHTML = LIVE.ok ? `<i class="on"></i><span>Ao vivo · planilha salva ${dd(LIVE.modif)} · lida ${hh(LIVE.lido)}</span>` : '<i></i><span>Sem conexão com os dados</span>';
}
function coverTexto() {
  const A = agg(S.rows.filter(r => inWin(r, S.Y))), B = agg(S.rows.filter(r => inWin(r, S.Y - 1)));
  $('#cvTxt').innerHTML = `<b>${fN(S.rows.length)}</b> atendimentos desde ${MES[+S.rows.reduce((a, r) => r.iso < a ? r.iso : a, '9999').slice(5, 7) - 1]}/${S.rows.reduce((a, r) => r.iso < a ? r.iso : a, '9999').slice(2, 4)} · meta de <b>15 minutos</b> por atendimento · ${fP0(A.pct)} dentro da meta em ${lblPer(S.Y)}`;
}
function fecharCapa() { $('#cover').classList.add('out'); document.body.classList.remove('cv'); }
function abrirCapa() { $('#cover').classList.remove('out'); document.body.classList.add('cv'); }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t && t.classList.contains('tab')) return setTab(t.dataset.t);
  const g = e.target.closest('[data-go]'); if (g) return setTab(g.dataset.go);
  const inf = e.target.closest('[data-info]'); if (inf) return showInfo(inf.dataset.info);
  const yv = e.target.closest('[data-yv]'); if (yv) { S.yv = +yv.dataset.yv; return render(); }
  const w = e.target.closest('[data-win]'); if (w) { S.win = w.dataset.win; return render(); }
  const ck = e.target.closest('[data-ck]'); if (ck) { const c = ck.dataset.ck, rs = filt(S.rows, { ...S.f, per: 'all' }).filter(r => r.fl.includes(c)); return openDrawer(CHK[c].nome, `<h4>O que significa</h4><p>${CHK[c].desc}</p><h4>Linhas</h4>${tabelaAtend(rs, { det: r => r.dt[c] || '' })}`); }
  const pk = e.target.closest('[data-pk]'); if (pk) { const p = vSimult.picos[+pk.dataset.pk]; return openDrawer(`${p.n} atendimentos ao mesmo tempo`, `<p>${fDt(p.ids[0].iso)} · ${hhmm(p.t % 1440 / 1440)}. Atendimentos em andamento neste instante (janela ${S.win === 'A' ? 'solicitação → término' : 'início → término'}).</p>${tabelaAtend(p.ids)}`); }
  const rk = e.target.closest('.rk-r[data-key]'); if (rk) {
    const [k, v] = rk.dataset.key.split('|'), P = periodo(), W = S.win;
    const fx = { ct: r => r.ct === v, loc: r => r.loc === v, emb: r => r.emb === v, eq: r => r.eq1 === v, crit: r => r.ct === v && r.cr, sc: r => r.ct === v && r['c' + W] >= 2, se: r => r.eq1 === v && r['c' + W] >= 2 }[k];
    if (fx) { const rs = P.cur.filter(fx).sort((a, b) => (b.t || 0) - (a.t || 0)); const ttl = { ct: 'Contrato ', loc: 'Local ', emb: '', eq: 'Equipe ', crit: 'Pontos críticos · ', sc: 'Em sobreposição · ', se: 'Em sobreposição · equipe ' }[k] + v; return openDrawer(ttl, `<p>${P.lc}. Ordenado do maior para o menor tempo de atendimento.</p>${tabelaAtend(rs)}`); }
  }
  const kp = e.target.closest('.kpi'); if (kp && !kp.dataset.go) return;
});
$('#drwBg').onclick = closeDrawer; $('#drwX').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); if (!$('#cover').classList.contains('out') && ['Enter', ' ', 'ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); fecharCapa(); } });
$('#cvGo').onclick = fecharCapa;
$('#cover').addEventListener('wheel', e => { if (e.deltaY > 20) fecharCapa(); }, { passive: true });
let ty = 0; $('#cover').addEventListener('touchstart', e => ty = e.touches[0].clientY, { passive: true }); $('#cover').addEventListener('touchend', e => { if (ty - e.changedTouches[0].clientY > 40) fecharCapa(); });
$('#bHome').onclick = () => { setTab('resumo'); };
$('#logo').onclick = abrirCapa;
$('#bRef').onclick = () => loadLive(true);
$('#bFil').onclick = () => $('#filters').classList.toggle('open');
$('#bPres').onclick = () => {
  const on = !document.body.classList.contains('pres'); document.body.classList.toggle('pres', on);
  if (on) { if (S.tab === 'dados') setTab('resumo'); (document.documentElement.requestFullscreen || (() => { })).call(document.documentElement).catch(() => { }); }
  else if (document.fullscreenElement) document.exitFullscreen();
};
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('pres'); });

buildTabs();
const h0 = location.hash.slice(1); if (TABS.some(t => t[0] === h0)) { S.tab = h0; }
if (location.hash === '#painel' || TABS.some(t => t[0] === h0)) fecharCapa(); else document.body.classList.add('cv');
$$('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
loadLive().then(() => { setTab(S.tab, true); });
setInterval(() => { if (!document.hidden) loadLive(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!LIVE.lido || Date.now() - LIVE.lido > 60 * 1000)) loadLive(); });

</script>
</body>
</html>
