:root{
  --vermelho:#DA202C; --vermelho-15:#F8D2D4; --vermelho-escuro:#B51E20;
  --bg:#EFEEEC; --superficie:#FFFFFF; --superficie-2:#F6F5F4;
  --texto:#2F2F2F; --texto-2:#5E5E60; --texto-3:#8A8C91;
  --borda:#DDDBD9; --topo:#0B0B0C; --topo-texto:#FFFFFF; --topo-2:#B0B0B0;
  --atencao:#8A6100; --atencao-bg:#F7EDD9;
  --ok:#2E7D32; --ok-bg:#E3F1E4;
  --sombra:0 1px 2px rgba(20,10,10,.06),0 4px 14px rgba(20,10,10,.05);
  --f-titulo:'DIN','Arial Narrow',Arial,sans-serif;
  --f-corpo:'Poppins',Helvetica,Arial,sans-serif;
  --gutter:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121112; --superficie:#1C1B1C; --superficie-2:#242224;
    --texto:#ECEAE8; --texto-2:#B4B1AE; --texto-3:#8A8783;
    --borda:#343133; --topo:#000000; --vermelho-15:#3A1518;
    --atencao:#E2B864; --atencao-bg:#33280F; --ok:#8BC98E; --ok-bg:#15291A;
    --sombra:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121112; --superficie:#1C1B1C; --superficie-2:#242224;
  --texto:#ECEAE8; --texto-2:#B4B1AE; --texto-3:#8A8783;
  --borda:#343133; --topo:#000000; --vermelho-15:#3A1518;
  --atencao:#E2B864; --atencao-bg:#33280F; --ok:#8BC98E; --ok-bg:#15291A;
  --sombra:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--f-corpo);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-titulo);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}

.topo{background:var(--topo);color:var(--topo-texto);padding-inline:var(--gutter);padding-block:20px 22px;border-bottom:4px solid var(--vermelho)}
.topo-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.marca{display:flex;flex-direction:column;gap:14px}
.logo{width:150px;height:auto;display:block}
.topo h1{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:700;letter-spacing:.01em;line-height:1.05}
.topo p{margin:4px 0 0;color:var(--topo-2);font-size:.82rem}
.resumo{display:flex;gap:22px;flex-wrap:wrap}
.resumo div{display:flex;flex-direction:column}
.resumo b{font-family:var(--f-titulo);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.resumo span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--topo-2)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:var(--gutter);padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}

.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
.busca{flex:1 1 240px;min-width:0;padding:10px 16px;border-radius:99px;border:1px solid var(--borda);background:var(--superficie)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--borda);background:var(--superficie);border-radius:99px;padding:6px 13px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--texto);color:var(--bg);border-color:var(--texto)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--borda);background:var(--superficie);border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
.btn-pri{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn-pri:hover{background:var(--vermelho-escuro)}
.btn-perigo{color:var(--vermelho);border-color:var(--vermelho)}

.grupo{display:flex;flex-direction:column;gap:10px}
.grupo h2{font-size:.78rem;font-family:var(--f-corpo);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-2);display:flex;align-items:center;gap:10px}
.grupo h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--cor,var(--borda)) 0 64px,var(--borda) 64px)}
.grupo h2{color:var(--cor,var(--texto-2))}
.grupo h2 .qtd{font-size:.72rem;font-weight:600;letter-spacing:0;color:var(--texto-3);order:3}
.ponto{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cor,var(--texto-3));flex:none}
.chip .ponto{width:8px;height:8px;margin-right:6px;vertical-align:0}
.grupo .card{border-top:4px solid var(--cor,var(--borda))}
.grupo .card:hover{border-color:var(--cor,var(--vermelho))}
.tag.tipo{background:color-mix(in srgb,var(--cor,#8A8C91) 14%,transparent);color:var(--cor,var(--texto-2));border-color:transparent}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}

.card{background:var(--superficie);border:1px solid var(--borda);border-radius:10px;box-shadow:var(--sombra);display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--vermelho)}
.card a.corpo{display:flex;flex-direction:column;gap:6px;padding:16px 16px 12px;text-decoration:none;color:inherit;flex:1}
.card h3{font-size:1.08rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .desc{font-size:.84rem;color:var(--texto-2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--superficie-2);color:var(--texto-2);border:1px solid var(--borda);white-space:nowrap}
.tag.outra{background:var(--atencao-bg);color:var(--atencao);border-color:transparent}
.tag.comp{background:var(--vermelho-15);color:var(--texto);border-color:transparent}
.rodape-card{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--borda);padding:8px 10px 8px 16px;font-size:.75rem;color:var(--texto-3);font-variant-numeric:tabular-nums}
.acoes{display:flex;gap:2px}
.icone{border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600;color:var(--texto-2)}
.icone:hover{background:var(--superficie-2);color:var(--texto)}
.abrir{color:var(--vermelho);font-weight:600}

.vazio{padding:40px 16px;text-align:center;color:var(--texto-3)}

.painel{background:var(--superficie);border:1px solid var(--borda);border-radius:10px;padding:18px}
.painel h2{font-size:1.15rem;margin-bottom:8px}
.painel ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.88rem;max-width:72ch}
.painel p{font-size:.88rem;color:var(--texto-2);max-width:72ch;margin:8px 0 0}
.aviso{font-size:.84rem;background:var(--atencao-bg);color:var(--atencao);border-radius:8px;padding:10px 14px}

form.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
form.editor label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--texto-2)}
form.editor input,form.editor select,form.editor textarea{padding:9px 11px;border:1px solid var(--borda);border-radius:8px;background:var(--superficie-2);font-weight:400;min-width:0}

        <h1>Central de Projetos</h1>

      </div>
    </div>
    <div class="resumo" aria-label="Resumo">
      <div><b id="r-total">0</b><span>Projetos</span></div>
      <div><b id="r-cat">0</b><span>Frentes</span></div>
      <div><b id="r-ult">—</b><span>Última atualização</span></div>

</header>

<div class="wrap">
  <div class="barra">
    <input id="busca" class="busca" type="search" placeholder="Buscar projeto…" autocomplete="off" aria-label="Buscar projeto">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por frente"></div>
  </div>
  <div id="lista"></div>
  <div class="vazio" id="vazio" hidden>Nenhum projeto com esse filtro.</div>
</div>

<footer>Os projetos marcados como “Requer login no Claude” abrem só para quem tem acesso a eles no Claude.</footer>

<script src="projetos.js"></script>
<script>
const ORIGEM = {claude:["Requer login no Claude","outra"]};
const itens = (window.PROJETOS || []).slice();
let filtroCat = "Todos";
try { filtroCat = localStorage.getItem("cp-filtro") || "Todos"; } catch(e) {}

const $ = s => document.querySelector(s);
const fmt = d => d ? d.split("-").reverse().join("/") : "";
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function el(tag, attrs, ...kids){ const e=document.createElement(tag); for(const k in attrs||{}){ if(k==="text") e.textContent=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } kids.flat().forEach(c=>c&&e.append(c)); return e; }
const ordenar = (a,b) => (b.atualizado||"").localeCompare(a.atualizado||"") || a.titulo.localeCompare(b.titulo);
/* cada frente tem uma cor; a ordem das seções segue a rotina (boletins e equipe primeiro) */
const FRENTES = [
  ["Boletins de navio", "#DA202C"], ["Área da equipe", "#7C3AED"], ["TPS", "#2563EB"],
  ["Prime Ocean", "#0E9F8E"], ["Operações", "#D97706"], ["Pessoal", "#64748B"]
];
const corDe = c => (FRENTES.find(f => f[0] === c) || [0, "#8A8C91"])[1];
const ordemDe = c => { const i = FRENTES.findIndex(f => f[0] === c); return i < 0 ? 99 : i; };
const TIPOS = [[/boletim/i,"Boletim"],[/painel da equipe/i,"Editor"],[/painel/i,"Painel"],[/planejamento/i,"Planejamento"],[/cen[aá]rio/i,"Cenários"],
  [/indicador/i,"Indicadores"],[/controle/i,"Controle"],[/central/i,"Central"],[/alinhamento/i,"Alinhamento"],[/docagem/i,"Docagem"]];
const tipoDe = i => (TIPOS.find(([re]) => re.test(i.titulo)) || [0, "Projeto"])[1];

function render(){
  const cats = {}; itens.forEach(i => cats[i.categoria]=(cats[i.categoria]||0)+1);
  const nomesCat = Object.keys(cats).sort((a,b)=>ordemDe(a)-ordemDe(b)||a.localeCompare(b));
  if (filtroCat!=="Todos" && !cats[filtroCat]) filtroCat="Todos";
  $("#r-total").textContent = itens.length;
  $("#r-cat").textContent = nomesCat.length;
  const ult = itens.map(i=>i.atualizado).filter(Boolean).sort().pop();
  $("#r-ult").textContent = ult ? fmt(ult).slice(0,5) : "—";

  const chips = $("#chips"); chips.replaceChildren();
  ["Todos",...nomesCat].forEach(c => chips.append(el("button",{type:"button",class:"chip","aria-pressed":String(c===filtroCat),style:c==="Todos"?"":`--cor:${corDe(c)}`,onclick:()=>{filtroCat=c; try{localStorage.setItem("cp-filtro",c)}catch(e){} render();}}, c==="Todos"?null:el("i",{class:"ponto"}), c, el("span",{class:"n",text:c==="Todos"?itens.length:cats[c]}))));

  const q = norm($("#busca").value.trim());
  const vis = itens.filter(i => (filtroCat==="Todos"||i.categoria===filtroCat) && (!q || norm(i.titulo+" "+(i.descricao||"")+" "+i.categoria).includes(q))).sort(ordenar);
  const lista = $("#lista"); lista.replaceChildren();
  $("#vazio").hidden = vis.length>0;
  const grupos = {}; vis.forEach(i => (grupos[i.categoria] ||= []).push(i));
  nomesCat.filter(c=>grupos[c]).forEach(c => lista.append(el("section",{class:"grupo",style:`--cor:${corDe(c)}`},
    el("h2",{}, el("i",{class:"ponto"}), c, el("span",{class:"qtd",text:String(grupos[c].length)})), el("div",{class:"grade"}, grupos[c].map(card)))));
}

function card(i){
  const tags = [el("span",{class:"tag tipo",text:tipoDe(i)})];
  if (ORIGEM[i.origem]) tags.push(el("span",{class:"tag "+ORIGEM[i.origem][1],text:ORIGEM[i.origem][0]}));
  const abs = new URL(i.url, location.href).href;
  return el("article",{class:"card"},
    el("a",{class:"corpo",href:i.url,target:"_blank",rel:"noopener"},
      el("h3",{text:i.titulo}),
      i.descricao ? el("p",{class:"desc",text:i.descricao}) : null,
      tags.length ? el("div",{class:"meta"},tags) : null),
    el("div",{class:"rodape-card"}, el("span",{text:i.atualizado?"Atualizado em "+fmt(i.atualizado):"Sem data"}),
      el("div",{class:"acoes"}, el("button",{type:"button",class:"icone",onclick:e=>copiar(abs,e.currentTarget)},"Copiar link"))));
}

async function copiar(url, btn){
  try { await navigator.clipboard.writeText(url); btn.textContent="Copiado"; setTimeout(()=>btn.textContent="Copiar link",1600); }
  catch(e){ const inp=el("input",{value:url,"aria-label":"Link"}); inp.style.width="100%"; btn.replaceWith(inp); inp.select(); }
}

$("#busca").addEventListener("input", render);
render();
</script>
